# Torrentflix: the Torrentflix web UI (mirrored from github.com/joolay/homebrew app-flix, see src/torrentflix/README.md) plus a small
# profile-sync API. It has no streaming server of its own: it uses the one from joolay-stremio (host port 11470), which this app depends on.
# The UI is protected by Umbrel's login (app_proxy). Port 3901 serves ONLY /tf/api/* so the TV app can sync profiles without that login.
# Keep the `web` image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-torrentflix_web_1
      APP_PORT: 3900

  web:
    image: ghcr.io/joolay/torrentflix:1.0.0
    restart: on-failure
    environment:
      - PORT=3900
      - API_PORT=3901
      - DATA_DIR=/data
      # Host port of the Stremio app's streaming server (joolay-stremio publishes 11470)
      - TF_STREMIO_PORT=11470
    ports:
      # Profile-sync API only. NOT behind Umbrel's login (the TV app calls it directly), so keep it on your home network.
      - "3901:3901"
    volumes:
      - ${APP_DATA_DIR}/data:/data
