manifestVersion: 1
id: joolay-torrentflix
category: media
name: Torrentflix
version: "1.0.0"
tagline: A classic Netflix-style front end for your Stremio streaming server
description: >-
  Torrentflix gives your browser and your TV a clean, classic Netflix-style interface on top of the Stremio app's streaming server.


  It finds sources with Torrentio, shows the top 3 by seeds in 4K, 1080p, 720p and other, and plays them through the streaming server of the Stremio app on your Umbrel (install that first).


  Up to 12 profiles, each with its own My List and watch progress, are saved on your Umbrel and shared by the browser and the Torrentflix TV app for LG webOS (set Settings > Profile sync to http://umbrel.local:3901).


  The interface is protected by your Umbrel login. Only the small profile-sync API is open on your home network (port 3901), so keep this Umbrel off the public internet. You are responsible for what you stream and for following the laws that apply to you.
developer: joolay
website: https://github.com/joolay/homebrew
dependencies:
  - joolay-stremio
repo: https://github.com/joolay/umbrel-apps
support: https://github.com/joolay/umbrel-apps/issues
port: 3900
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "First release: Netflix-style interface, Torrentio sources (top 3 by seeds per resolution) and synced profiles."
submitter: joolay
submission: https://github.com/joolay/umbrel-apps
