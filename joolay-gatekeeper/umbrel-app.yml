manifestVersion: 1
id: joolay-gatekeeper
category: developer
name: Gatekeeper
version: "1.0.2"
tagline: One sign-in for every app
description: >-
  Puts a JoolzApp sign-in in front of the apps on this Umbrel. A protected app's address goes through Gatekeeper, which checks the
  person's JoolzApp account and whether Portal Admin has approved them for that app. The admin opens everything, and an app can be
  marked admin only. Runs behind TSDProxy (which keeps the Tailscale names), so nothing about TSDProxy changes.
