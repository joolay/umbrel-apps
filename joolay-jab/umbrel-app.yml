manifestVersion: 1
id: joolay-jab
category: productivity
name: JoolzApp Biz
version: "1.1.0"
tagline: The private dashboard for the practice's apps
description: >-
  JoolzApp Biz (JAB) is the private home screen for the dental practice's own apps: patient records, the shop display and whatever else the practice runs.
  It looks and works like the JoolzApp Dashboard (same glass theme, press and hold to rearrange) but it is a separate network: its own people, roles
  (Admin, Editor, Member, View-only), passwords and PIN or pattern sign-in, none of it shared with your JoolzApp accounts or PocketBase.
  People are added in JAB Admin (install it too). Admins get an Admin folder on the dashboard with JAB Admin and any app marked admin only.
  The admin groups the apps, links each one to its address and picks its icon and colours right on the dashboard.
