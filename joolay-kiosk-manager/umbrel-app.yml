manifestVersion: 1
id: joolay-kiosk-manager
category: developer
name: Kiosk Manager
version: "1.1.0"
tagline: Show Umbrel on the server's own screen
description: >-
  Installs and controls a fullscreen kiosk browser on the Umbrel device itself, so the dashboard
  appears on a monitor plugged into the server with no other computer needed.
  Load or unload the kiosk with one tap, and add or remove it as a boot-up service.
  Installing the kiosk adds a few packages (Cage, Chromium) and a small "kiosk" user to the Umbrel's operating system.
  This app runs with privileged access to the host, which gives it full control of this machine.
developer: joolay
