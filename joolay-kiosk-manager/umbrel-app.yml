releaseNotes: "Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: The top bar now stays at the top of the screen when you scroll. First release: install the kiosk browser, load and unload it, and add or remove it as a boot service. Reports its status to the Portal Admin status feed (needs Portal Admin 0.33.0), with no JoolzApp sign-in."
