<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP NAME</title>
<meta name="theme-color" content="#BRAND">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APP NAME">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="gate.css">
<style>
/* Brand tokens only (see templates/glass/README.md) */
:root{--accent:#BRAND;--accent-2:#BRAND2;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#DARK;--accent-2:#DARK2;--accent-t:#06210F}}
:root[data-theme="dark"]{--accent:#DARK;--accent-2:#DARK2;--accent-t:#06210F}
</style>
<script src="theme-global.js"></script>
</head>
<body>
<main class="jz-card" id="card">
  <img class="jz-logo" src="icon.svg" alt="">
  <h1>APP NAME</h1>
  <p class="jz-sub" id="sub">Sign in with your JoolzApp account</p>
  <div id="view"></div>
</main>
<script src="pwtoggle.js"></script>
<script src="quick-ui.js"></script>
<script src="gate.js"></script>
<script>
JZGate({ app: "APP-SLUG", name: "APP NAME", tokenKey: "gd.token", tokenHeader: "x-gd-token", clear: ["gd_prefs"], tagline: "One line about the app" });
</script>
</body>
</html>
