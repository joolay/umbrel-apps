releaseNotes: "Port Master now has its own private Tailscale address (https://port-master.<your tailnet>.ts.net, tailnet only, not public) through TSDProxy, and checks that route like any other app. It uses host port 3907. New: Port Master now keeps a hidden list of every port used by the official Umbrel App Store (including apps you have not installed), refreshed weekly, and reports any app that shares a port with another. The official app keeps the port; the other app is flagged to change, with a free port to move to. The list itself is never shown or sent anywhere. Adds a .local column (umbrel.local by default, changeable in Settings): it shows when an app answers on the .local name, so you can tell a broken name from a broken app. The status feed now carries every app's ports and route states (not only the problems), the address of each route, and any port clash between apps. The top bar now stays at the top of the screen when you scroll. The route table fits the screen with smaller text, and version and port show only when an app is opened. The Install icon shows on http addresses too and explains what to do. Routing Reporter is now called Port Master (same app, same address). Adds an Install icon to the top bar. Routes now sit in columns to save space, the top bar stays in place when scrolling, a summary names the apps that need attention, and an Ignore button hides a route that is not meant to work (for example an app not on Tailscale)."
submitter: joolay
