releaseNotes: "New: Port Master now looks after ALL Tailscale names, including the ones our own apps used to carry in their settings (the update of each app hands its name over, same address, same port, same Public or tailnet-only setting). Rename and Remove now work on every app, and the Rename box has a Public on the internet (Funnel) option. Routes that Port Master can only confirm through TSDProxy say so, and certificate problems are named in plain words. New: a Restart TSDProxy now button on the TSDProxy tab (asks Services Manager, which restarts it within a minute). Changed: the Tailscale and Name columns are now called TS IP and TS Name. Fix: all Tailscale name routes showed red with 'name not found (DNS)' although the names were working. Port Master runs inside the Umbrel, which does not use Tailscale's own name service, so it could not look the names up. It now asks Tailscale's name service directly and, if that still fails, trusts TSDProxy when it reports the proxy as running (a proxy you paused stays red). Fix: on a phone the app names no longer break letter by letter; the port now sits under the app name and the separate Port column is hidden. Fix: the large pale glow behind the page could cover the top of a long page; the backdrop glows are now capped in size. Before: New: Port Master now looks after Tailscale names. On the TSDProxy tab, a new Tailscale names section lists every app with its name and state. Apps without a name get one by themselves (automatic is on; Remove a name and it stays off for that app, Create brings it back; Settings has Create names for all apps without one): it is tailnet only, never public, and shows up as its own Tailscale name route. You can rename a name Port Master gave and remove it again. Port Master fixes things by itself: a clash with another app moves its own name to a free one, a name is dropped when the app is gone or has got a name of its own, and an entry is written again when the file was changed or the app moved to another port. Names that an app carries in its own settings, and the ones Portal Admin published (OpenClaw), stay as they are and are only checked (clash, not in TSDProxy yet). Port Master keeps its names in its own list file in the TSDProxy folder (joolz-names.yaml) and asks Services Manager to restart TSDProxy once to read it. Before: New: add any installed app to the JoolzApp Store. The Portal cell of every app that does not use the JoolzApp account (Stremio, OpenClaw and others) is now a button: tap it, choose the name and the address the tile opens (Public, Tailscale name, Tailscale address or LAN), and the tile appears on the JoolzApp Store; you also choose Admin (only admins see the tile, the default) or Portal (everyone with a JoolzApp account), get a warning for a Public address, and a new Login column shows which apps sit behind the JoolzApp account (an added app keeps its own login, because the tile is only a shortcut). Tap it again to hide the tile. JoolzApp apps keep getting theirs by themselves and owner-only tools stay in the Admin folder. Needs Portal Admin 0.39.0 (installs together). Before: New: every tick in the list is now a switch. On a Public or Tailscale-name route it pauses that app's TSDProxy proxy, so the address stops answering, and tapping again resumes it (one switch covers both routes of an app; Services Manager 1.3.0 does the pausing and keeps it paused after a TSDProxy restart). On LAN, .local and Tailscale-address routes it can only stop counting the route as a problem. A new TSDProxy tab shows its version, whether Port Master can control it, whether a newer image is ready and every proxy with Pause and Resume, and a features list shows what Port Master does now and what is proposed. The Ignore button is now called Disable/Enable. Before: Fix: there was too much empty space between the top bars (menu bar and toolbar) and the page when the app is installed on a phone. The gap under the bars is now just the normal padding. Updated to the current Glass template: the Claude link now shows on the sync ticks (two green = Claude has read the last change, red cross = broken) instead of a chain-link icon (now loaded as one file, so nothing can go missing): tabs (All, JoolzApp, Other, Down) in the menu bar, a Sort selector and the Check now button in the toolbar, a Home button back to the JoolzApp Store, the Settings gear in the standard place, the latest top bar, theme and sync icons. The list is now one full-width table per group (no side-by-side grid) with a Port column, a Portal column (a tile shows which apps appear on the JoolzApp Store home screen) and the Name and Public columns for every app, with tidier spacing so the headings no longer overlap. Fix: the app did not start after the last update (two files were missing from its image), so it could not be reached on any route. The Claude link icon in the top bar is now a still chain link (green = read, amber = sent but not read, grey with a red strike = broken), with no hands, device or AI badge, and the connected icon is now a plain green or red dot. New: every route now has an Open button (LAN, .local, Tailscale address, Tailscale name and Public) that opens the app on that route in a new tab, and a broken route has a Fix button that explains in plain steps what to do for that route and a Recheck now button that tests just that route straight away, so you can see it turn green. Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: Port Master now recognises apps published through TSDProxy's list file (like OpenClaw, set up from Portal Admin > Changes) and checks their Tailscale name route. Port Master now has its own private Tailscale address (https://port-master.<your tailnet>.ts.net, tailnet only, not public) through TSDProxy, and checks that route like any other app. It uses host port 3907. New: Port Master now keeps a hidden list of every port used by the official Umbrel App Store (including apps you have not installed), refreshed weekly, and reports any app that shares a port with another. The official app keeps the port; the other app is flagged to change, with a free port to move to. The list itself is never shown or sent anywhere. Adds a .local column (umbrel.local by default, changeable in Settings): it shows when an app answers on the .local name, so you can tell a broken name from a broken app. The status feed now carries every app's ports and route states (not only the problems), the address of each route, and any port clash between apps. The top bar now stays at the top of the screen when you scroll. The route table fits the screen with smaller text, and version and port show only when an app is opened. The Install icon shows on http addresses too and explains what to do. Routing Reporter is now called Port Master (same app, same address). Adds an Install icon to the top bar. Routes now sit in columns to save space, the top bar stays in place when scrolling, a summary names the apps that need attention, and an Ignore button hides a route that is not meant to work (for example an app not on Tailscale)."
