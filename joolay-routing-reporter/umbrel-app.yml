releaseNotes: "Fix: apps whose name moved to Port Master got a default name, port and no Public setting (for example portal and project-pilot, and the missing Public address for Project Pilot and ShutterWorth). Once, on this update, our own apps are put back on their old name, port and Public setting. Fix: when names Port Master wrote are still not known to TSDProxy after about 6 minutes, Port Master now asks for the TSDProxy restart itself (up to 3 tries). Before: Shared template update (adds the AI settings component; no change to how this app works)."
