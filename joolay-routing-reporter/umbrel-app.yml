manifestVersion: 1
id: joolay-routing-reporter
category: developer
name: Port Master
version: "1.10.2"
tagline: Checks every app's LAN, Tailscale and Public routes and tells Portal Admin
description: >-
  Finds every app installed on this Umbrel and checks, every few minutes, that it answers on the home network (LAN), on your Tailscale address and,
  for apps published through TSDProxy, on their Tailscale name and their public Funnel address. A route that stops answering is shown in red with the reason
  and the time it broke. The result is sent to Portal Admin, where the "JoolzApp apps" page lists every JoolzApp app with its routes and an admin can
  flag a broken route to Claude through the status feed. Add your Tailscale address and tailnet name in Settings.
  Checks run from inside the Umbrel, so a Public route means the Funnel address answers from here; it cannot see a break outside your network.
developer: joolay
