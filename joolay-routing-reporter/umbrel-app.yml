releaseNotes: "Updated to the current Glass template: tabs (All, JoolzApp, Other, Down) in the menu bar, a Sort selector and the Check now button in the toolbar, a Home button back to the JoolzApp Store, the Settings gear in the standard place, the latest top bar, theme and sync icons. The list is now one full-width table per group (no side-by-side grid) with a Port column, a Portal column (a tile shows which apps appear on the JoolzApp Store home screen) and the Name and Public columns for every app, with tidier spacing so the headings no longer overlap. Fix: the app did not start after the last update (two files were missing from its image), so it could not be reached on any route. The Claude link icon in the top bar is now a still chain link (green = read, amber = sent but not read, grey with a red strike = broken), with no hands, device or AI badge, and the connected icon is now a plain green or red dot. New: every route now has an Open button (LAN, .local, Tailscale address, Tailscale name and Public) that opens the app on that route in a new tab, and a broken route has a Fix button that explains in plain steps what to do for that route and a Recheck now button that tests just that route straight away, so you can see it turn green. Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: Port Master now recognises apps published through TSDProxy's list file (like OpenClaw, set up from Portal Admin > Changes) and checks their Tailscale name route. Port Master now has its own private Tailscale address (https://port-master.<your tailnet>.ts.net, tailnet only, not public) through TSDProxy, and checks that route like any other app. It uses host port 3907. New: Port Master now keeps a hidden list of every port used by the official Umbrel App Store (including apps you have not installed), refreshed weekly, and reports any app that shares a port with another. The official app keeps the port; the other app is flagged to change, with a free port to move to. The list itself is never shown or sent anywhere. Adds a .local column (umbrel.local by default, changeable in Settings): it shows when an app answers on the .local name, so you can tell a broken name from a broken app. The status feed now carries every app's ports and route states (not only the problems), the address of each route, and any port clash between apps. The top bar now stays at the top of the screen when you scroll. The route table fits the screen with smaller text, and version and port show only when an app is opened. The Install icon shows on http addresses too and explains what to do. Routing Reporter is now called Port Master (same app, same address). Adds an Install icon to the top bar. Routes now sit in columns to save space, the top bar stays in place when scrolling, a summary names the apps that need attention, and an Ignore button hides a route that is not meant to work (for example an app not on Tailscale)."
