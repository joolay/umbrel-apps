# Port Master: checks every app's LAN, Tailscale and Public routes and reports to Portal Admin.
# Source: src/routing-reporter in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-routing-reporter_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: an owner-only tool that shows every route on the server.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/routing-reporter:1.10.0
    restart: on-failure
    stop_grace_period: 10s
    # Lets the container reach the Umbrel's own ports (the default "LAN" address is the host itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Private Tailscale address https://port-master.<tailnet>.ts.net via TSDProxy (tailnet only: no Funnel, never public). Port Master has no sign-in of its
    # own (it relies on Umbrel's login), so it must NOT be published with Funnel.
    ports:
      - "3907:3000"
    # The Tailscale name (and Funnel, if public) is kept by Port Master since 1.10.0 (TSDProxy tab); this app publishes its port for it.
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Read-only: Umbrel's installed-app folders (umbrel-app.yml and docker-compose.yml) tell it which apps exist, their ports and which are published.
      - ${UMBREL_ROOT}/app-data:/umbrel-app-data:ro
      # TSDProxy's settings folder. Port Master reads its list file (joolz-published.yaml: apps Portal Admin published for us, like OpenClaw) and Services Manager's report
      # (tsdproxy-status.json), and writes joolz-paused.json (the proxies to pause: that is what the Public and Tailscale-name ticks do) and joolz-names.yaml (the Tailscale names it gives apps without one). Once, it adds a "lists:" line for that file to tsdproxy.yaml (a .bak copy is kept) and leaves restart-tsdproxy for Services Manager.
      - ${UMBREL_ROOT}/../tsdproxy/config:/tsdproxy-config
    environment:
      # Signs this app in to Portal Admin (it writes data/pocketbase.env after you sign in there) so the report reaches the "JoolzApp apps" page and the status feed.
      - POCKETBASE_APP_ID=routing-reporter
      # Owner-only tool, opened from Umbrel: no icon on the JoolzApp home screen.
      - JOOLZAPP_DASHBOARD=hidden
      # Optional starting values; all of them can be set in the app's Settings.
      - LAN_HOST=${ROUTING_LAN_HOST:-}
      - TAILSCALE_IP=${ROUTING_TAILSCALE_IP:-}
      - TAILNET=${ROUTING_TAILNET:-}
