name: portal-admin image
on:
  push:
    branches: [main]
    paths: ["portal-admin/**", ".github/workflows/portal-admin-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./portal-admin/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: portal-admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/joolay/portal-admin:${{ steps.v.outputs.version }}
            ghcr.io/joolay/portal-admin:latest
