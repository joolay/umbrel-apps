name: build-images
# Every folder src/<app>/ with a Dockerfile is built to ghcr.io/joolay/<app>:<version>,
# where <version> comes from joolay-<app>/umbrel-app.yml. Images are pushed from branches too,
# so the image exists before the manifest change reaches main.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["src/**", "joolay-*/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.d.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          apps=$(for f in src/*/Dockerfile; do [ -f "$f" ] && basename "$(dirname "$f")"; done | jq -R . | jq -sc .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          m="joolay-${{ matrix.app }}/umbrel-app.yml"; c="joolay-${{ matrix.app }}/docker-compose.yml"
          [ -f "$m" ] || { echo "::error::missing $m"; exit 1; }
          ver=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$m" | head -1)
          grep -q "ghcr.io/joolay/${{ matrix.app }}:$ver" "$c" || { echo "::error::$c image tag must equal version $ver"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/joolay/${{ matrix.app }}:${{ steps.v.outputs.version }}
