releaseNotes: "Changes: Parents: hide a title from every kids profile (undone only in Settings > Kids) or recommend it to one kid or all kids (shows on their Home); a new Kids tab shows what each kid watched, how far and when; screen time per kid or for All kids (a kid's own value wins): a daily total of play time and a winding-down time, with 15, 10 and 5 minute warnings and a hard stop; a parent gives more time (15 min to 2 h) by typing their own Quick Access code (needs JoolzApp Portal Admin 0.30). Titles watched to the credits count as watched, with Watch again and Play from beginning; titles with no source or not out yet are listed apart in search under Not available yet. Fix: the search bar and speak button sit centred together; fix: the image was missing a file and would not start. Search and Discover are now one tab (type to search, or leave it empty to browse by film or show, genre, year and sort); your last 5 searches are listed and each can be removed (they follow your account); titles with no source are no longer listed, and one with a source but no cover art gets a tile with its name; Trending and Popular no longer show films that are not out yet; Home now shows age rating, runtime and genre like the other tabs. Also: hovering the Magic Remote pointer over the progress bar now shows the nearest thumbnail (the pointer was landing on the bar's inner parts, not the bar); new player layout (sources, subtitles, audio sync and speed on the left; back, play, forward in the centre; aspect ratio and fill-screen on the right); aspect ratio cycles Auto, 16:9, 4:3, 21:9 and 1:1; Fill removes black bars; audio sync delays the sound up to 5 s. Also: source list crops long file names, shows the size on the right and marks the file that is playing and your preferred choice; the speed, subtitles and sources buttons in the player are icons; the search bar and results are centred with the speak button beside the bar; a title with no cover art gets a tile with its name. Changes: fixed Quick Access stalling on Saving after you pick a PIN (the TV now returns to the home screen). Quick Access is now one code for your whole JoolzApp account: set it once, then just turn it on for each TV (needs JoolzApp Portal Admin 0.29). Fix: saving a Quick Access PIN could sit on Saving… with no end. The keypad now locks while it saves and counts the seconds, Portal Admin gets 15 seconds to answer before a clear message appears, and the message stays up for 6 seconds. Fix: on a title page with a long tagline or credit line the Cast / More like this tabs and cards overlapped the Play buttons; they now sit just below the buttons. Fix: the sign-in and setup cards were tiny on a phone held upright; they now fill the screen width. Fix: opening JoolzTV from the JoolzApp dashboard showed Not found (the dashboard opens every app at /sso.html, which JoolzTV did not have). Also: Sharper icon: a larger glass square with no outer border. New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: Fix: the app did not start since 1.9.1 (a file was missing from the image). Also: New: Sign in with a QR code on the TV (first sign-in, new TV, adding a household member, or a profile's sign-in). Scan it with your phone signed in to JoolzApp and tap Approve; needs Portal Admin 0.25.0 and the JoolzApp address set in Portal Admin. Also: The LG TV app can now update itself: when it connects, this server tells it if a newer TV app exists (new /tv/update, read from your Homebrew feed), and the TV Updater service installs it. Also: TMDB answers are now kept on disk and refreshed only when TMDB reports a change (or after a week or two), with a size limit, and are rate-limit friendly. Also: New Appearance setting: Dark, Light, or Auto (light from sunrise to sunset where you are), saved on your JoolzApp account. Also: Episodes that are not out yet are greyed out with their date, and Notify me checks every 3 hours after release, reading the first minute (or downloading ahead). Also: The TMDB key now comes from Portal Admin > App keys (stored hidden in PocketBase), so each admin enters their own once. Also: You can watch a title while it is downloading ahead (downloads step aside whenever a player runs short and carry on afterwards), the first minute of the next episode is read ahead near the end of a fully downloaded episode, and Settings has tabs. Also: 50 GB cache, Download ahead, big-key keyboard, collections in My List, Also on Netflix, parental controls, TMDB, glass player controls, seek previews, voice search, skip intro / credits."
