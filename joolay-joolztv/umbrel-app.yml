releaseNotes: "Changed: the aspect ratio button in the player is now just the icon (the shape still appears briefly when you change it); when the TV cannot read a file and the server converts it instead, the player now only says "Your TV cannot read this file" for a few seconds, with no transcoding wording left on screen. Before: Changed: the Tailscale name joolztv (public, Funnel) is now looked after by Port Master instead of this app's own settings, so you can rename or remove it in Port Master. The address stays the same and may be unreachable for about a minute while the update installs. Before: Changes: Profiles with an age limit now get genre rows in Movies (only films rated for their age; Horror, Thriller, Crime, War and Romance are never offered). TV Shows stays on the one kids row for those profiles."
