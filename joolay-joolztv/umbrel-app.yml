releaseNotes: "Parental controls: only parent accounts can change a kids profile (age limit, a block list or an only-allow list of titles, kids profile on/off), with a For kids button on every title page. Porn and erotica are blocked for every user. Also: Collections tab, TMDB (artwork, ratings, cast, Discover), glass player controls, seek previews, voice search, skip intro / credits, Sources screen, household-wide sign-in, profile pictures."
