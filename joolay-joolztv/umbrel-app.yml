releaseNotes: "Sharper icon: a larger glass square with no outer border. New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: Fix: the app did not start since 1.9.1 (a file was missing from the image). Also: New: Sign in with a QR code on the TV (first sign-in, new TV, adding a household member, or a profile's sign-in). Scan it with your phone signed in to JoolzApp and tap Approve; needs Portal Admin 0.25.0 and the JoolzApp address set in Portal Admin. Also: The LG TV app can now update itself: when it connects, this server tells it if a newer TV app exists (new /tv/update, read from your Homebrew feed), and the TV Updater service installs it. Also: TMDB answers are now kept on disk and refreshed only when TMDB reports a change (or after a week or two), with a size limit, and are rate-limit friendly. Also: New Appearance setting: Dark, Light, or Auto (light from sunrise to sunset where you are), saved on your JoolzApp account. Also: Episodes that are not out yet are greyed out with their date, and Notify me checks every 3 hours after release, reading the first minute (or downloading ahead). Also: The TMDB key now comes from Portal Admin > App keys (stored hidden in PocketBase), so each admin enters their own once. Also: You can watch a title while it is downloading ahead (downloads step aside whenever a player runs short and carry on afterwards), the first minute of the next episode is read ahead near the end of a fully downloaded episode, and Settings has tabs. Also: 50 GB cache, Download ahead, big-key keyboard, collections in My List, Also on Netflix, parental controls, TMDB, glass player controls, seek previews, voice search, skip intro / credits."
