releaseNotes: "Changes: Much bigger text for TV viewing from across the room; a bigger logo with TV in a glass box; a centred, bigger Who's watching screen; descriptions use the full screen width; Movies and TV Shows now scroll through genre rows (common genres on, change them in Settings > Sources); missing age ratings, runtime, genres and cast are filled from a fallback source and replaced by TMDB as soon as it has them, and cached titles with gaps are updated automatically."
