releaseNotes: "The streaming cache is set to 50 GB (checked by reading it back; an admin can change it in Settings), and any title can be downloaded ahead of time with a Download ahead button: it fetches in the background and tells you in the app when it is ready (Ready to watch row, Settings > Downloads). Also: optional big-key keyboard, collections in My List, Also on Netflix, parental controls, Collections tab, TMDB, glass player controls, seek previews, voice search, skip intro / credits."
