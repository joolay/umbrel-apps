releaseNotes: "Sources screen with filters (the source is never named), preferred quality asked in the setup and used for automatic playback (most seeds in that quality, with a notice and alternatives when it is missing), household-wide sign-in checked by the server (90 days since anyone last used it, no more stay-signed-in switch), profile pictures: your JoolzApp photo or 24 built-in pictures."
