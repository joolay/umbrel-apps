releaseNotes: "New: App Updater can update itself, but only once every other auto-update is done. It pauses checking just before it starts, and checking resumes after the restart (the new version is compared with the old one and logged). Turn it off with the new switch. If it fails it waits 6 hours before trying again. Fix: the app lists showed [object HTMLDivElement] instead of the apps. Sharper icon: a larger glass square with no outer border. No longer shown on the JoolzApp home screen; open it from Umbrel."
