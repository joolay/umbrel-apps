releaseNotes: "Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: Faster updates showing in the status feed: it is sent right after each update finishes (retried while Portal Admin restarts), and checks run every 15 seconds for 3 minutes after a change. Before: Sends its status (apps, update results, log and checks, no passwords) to the Portal Admin status feed once it is switched on, so you and Claude can see whether updates loaded. Needs Portal Admin 0.33.0."
