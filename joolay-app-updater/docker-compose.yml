# App Updater: updates the Umbrel apps you choose, on a nightly window or as soon as umbrelOS lists a new version.
# Source: src/app-updater in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-app-updater_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: this app can update every app on the server.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/app-updater:1.0.2
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Lets the container reach umbrelOS on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # If Connect can't reach umbrelOS, set this to your Umbrel's LAN address, e.g. http://192.168.1.50
      - UMBREL_URL=${UMBREL_URL:-}
      # Lets Portal Admin find this app and give it a Portal API key (used to post update notices to the dashboard ticker).
      - POCKETBASE_APP_ID=app-updater
