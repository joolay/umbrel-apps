# atvloadly runs here as an Umbrel app using the upstream image (https://github.com/bitxeno/atvloadly), unmodified.
# There is no src/atvloadly: nothing to build. Keep the image tag equal to `version` in umbrel-app.yml.
# It discovers the Apple TV through the host's Avahi (mDNS) and D-Bus, so those sockets are mounted in read-write as upstream requires.
# Data (accounts, pairing records, IPAs) lives in this app's data folder and survives updates.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-atvloadly_web_1
      APP_PORT: 80
      # atvloadly has no login of its own and stores Apple ID sessions, so keep Umbrel's login in front of it (the default).

  web:
    image: bitxeno/atvloadly:v0.3.7
    hostname: atvloadly
    restart: on-failure
    stop_grace_period: 1m
    # Required by upstream (the bundled signing tools need it).
    security_opt:
      - seccomp:unconfined
    ulimits:
      core: 0
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
