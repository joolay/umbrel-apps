repo: https://github.com/joolay/umbrel-apps
support: https://github.com/joolay/umbrel-apps/issues
port: 3902
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Changed: the Tailscale name cctv (tailnet only) is now looked after by Port Master instead of this app's own settings, so you can rename or remove it in Port Master. The address stays the same and may be unreachable for about a minute while the update installs. Before: Changes: JoolzCCTV is now admin only. It is no longer on the public internet (Funnel is off), it lives in the Admin folder of the dashboard, and only admin accounts can open it. LAN, .local, Tailscale address and Tailscale name still work."
submitter: joolay
submission: https://github.com/joolay/umbrel-apps
