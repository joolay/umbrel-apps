# JoolzCCTV: live wall for Hikvision, Dahua and plain RTSP recorders at any number of premises, with per-viewer camera access.
# Source: src/cctv in this repo, built by .github/workflows/build-images.yml. Keep the image tag equal to `version` in umbrel-app.yml.
# Recorder passwords live only in <app data>/data/cctv.json (mode 600) and never leave the server. Needs network reach to each recorder
# (same LAN, or a Tailscale subnet route / port-forward for another premises). ffmpeg runs inside this container.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-cctv_web_1
      APP_PORT: 3902
      # No Umbrel login: JoolzCCTV locks itself behind the JoolzApp account (the TV app cannot use Umbrel's login).
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/cctv:1.0.3
    restart: on-failure
    stop_grace_period: 1m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Admin only (24/11/2026 decision): tailnet name, LAN, .local and Tailscale address only, never Funnel (no tailscale_funnel option below),
    # listed in the Admin folder of the dashboard, and the app itself refuses every account that is not an admin (ADMIN_ONLY).
    ports:
      - "3903:3902"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "cctv"
      tsdproxy.port.1: "443/https:3903/http, no_autodetect"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=cctv
      - POCKETBASE_APP_NAME=JoolzCCTV
      - REQUIRE_ACCOUNTS=1
      - ADMIN_ONLY=1
      - JOOLZAPP_DASHBOARD=hidden
