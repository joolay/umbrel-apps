<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9480f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diner Bell">
<title>Diner Bell</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="glass.css">
<style>
:root{--accent:#d9480f;--accent-2:#ff8a4c;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#ff8a4c;--accent-2:#ffb27d;--accent-t:#2b1100}}
:root[data-theme="dark"]{--accent:#ff8a4c;--accent-2:#ffb27d;--accent-t:#2b1100}
:root{--card:var(--glass);--ink:var(--text);--mute:var(--muted);--accent2:color-mix(in srgb,var(--accent) 14%,transparent)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{touch-action:manipulation}
.icon-btn{background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:19px;border:1px solid var(--line);flex:none}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:block;text-align:center;border:0;background:var(--accent);color:#fff;font:600 16px system-ui;padding:13px 18px;border-radius:14px;width:100%}
.btn.sec{background:var(--accent2);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.mute{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--accent2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px system-ui;padding:9px 4px;border-radius:10px}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px #0002}
input[type=text],input[type=password],select,input[type=url],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--ink);border-radius:var(--r-sm);padding:12px;font:16px system-ui}
textarea{min-height:90px;resize:vertical}
label.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:28px 12px;text-align:center;color:var(--mute)}
label.drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0 4px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;min-height:92px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);text-align:left;font:700 16px system-ui;line-height:1.2;box-shadow:0 1px 3px #0001}
.tile:active{transform:scale(.98)}
.tile small{font:500 12.5px system-ui;color:var(--mute)}
.tile .bdg{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;font:700 12px system-ui;padding:2px 8px}
.cat{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;font-weight:700}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0;font-size:16px}
.item p{margin:2px 0 0;font-size:13.5px;color:var(--mute)}
.price{font-weight:700;white-space:nowrap}
.step{display:flex;align-items:center;gap:2px;background:var(--accent2);border-radius:12px}
.step button{border:0;background:transparent;color:var(--accent);font:700 20px system-ui;width:38px;height:38px}
.step span{min-width:22px;text-align:center;font-weight:700}
.add{border:0;background:var(--accent2);color:var(--accent);font:700 14px system-ui;padding:9px 16px;border-radius:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-top:1px solid var(--line);z-index:6}
.bar .inner{max-width:640px;margin:auto}
.badge{background:#fff3;border-radius:10px;padding:2px 9px;margin-right:8px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#e0313122;color:#c92a2a;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
@media (prefers-color-scheme:dark){.err{color:#ff8787}}
.call{display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;font:700 19px system-ui;padding:16px;border-radius:16px}
.call.sm{font-size:15px;padding:11px;border-radius:12px}
.sum-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sum-line:last-of-type{border-bottom:0}
.sum-line .q{font-weight:700;min-width:30px;color:var(--accent)}
.note{font-size:13.5px;color:var(--mute);font-style:italic}
.kv{display:flex;justify-content:space-between;padding:4px 0}
.kv.big{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.link{background:none;border:0;color:var(--accent);font:600 14px system-ui;padding:4px 0}
.search{margin-bottom:6px;position:sticky;top:var(--hh,60px);z-index:4;box-shadow:0 6px 0 var(--bg)}
.item[data-item]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pill.ed{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0 7px;font-size:11px;margin-left:4px;vertical-align:middle}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.modal label{display:block;margin-top:8px}
.pill.new{background:var(--accent);color:#fff;margin-left:4px;vertical-align:middle}
.pill{display:inline-block;background:var(--accent2);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 14px system-ui}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.h{font-weight:700;margin:0 0 8px}
.person{background:var(--accent2);border-radius:12px;padding:10px 12px;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:9;text-align:center;font-size:14px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 6px;font-weight:700}

/* ---- Glass layer: shared look from glass.css ---- */
header,.bar{border-color:var(--glass-line)}
.card,.tile{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.icon-btn{background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--text)}
.btn{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-t);border-radius:var(--r-sm);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.sec{background:var(--glass-strong);color:var(--accent);box-shadow:none;border:1px solid var(--glass-line)}
.btn.ghost{background:transparent;box-shadow:none}
.tabs{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabs button.on{background:var(--glass-strong);color:var(--text)}
.tile .bdg{color:var(--accent-t)}

/* ---- Diner Bell: icon buttons, tiles, order type ---- */
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn.ic{width:auto;min-width:56px;min-height:46px;padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wa{background:linear-gradient(145deg,#1faa59,#25d366);color:#fff;box-shadow:0 6px 16px #25d36655}
.sbar{position:sticky;top:var(--hh,60px);z-index:4;display:flex;gap:8px;align-items:center;margin:0 -4px 12px;padding:8px 4px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-radius:var(--r)}
.sbar input{flex:1;min-width:0}
.sbar .search{position:static;margin:0;box-shadow:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 12px}
.rt,.ct{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:var(--r);overflow:hidden;color:#fff;text-align:left;background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:var(--shadow);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.rt .nm,.ct .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font:700 12.5px/1.15 system-ui;background:linear-gradient(transparent,#000a);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rt .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 34px system-ui;opacity:.9}
.ct .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.55;transform:translateY(-8px)}
.ct small{position:absolute;top:7px;left:8px;font:600 11px system-ui;opacity:.9}
.rt .bdg,.ct .bdg{position:absolute;top:6px;right:6px;background:#fff;color:var(--accent);border-radius:99px;font:800 11px system-ui;padding:2px 7px}
.rt.new::after{content:"NEW";position:absolute;top:6px;left:6px;background:#fff;color:var(--accent);border-radius:99px;font:800 10px system-ui;padding:2px 6px}
.rt.add{background:var(--glass);color:var(--mute);border:2px dashed var(--glass-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px system-ui;text-align:center;box-shadow:none}
.rt.add svg{color:var(--accent)}
@keyframes wig{0%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}100%{transform:rotate(-1.6deg)}}
.edit .rt:not(.add){animation:wig .28s infinite;touch-action:none}
.edit .rt:nth-child(2n){animation-delay:-.1s}.edit .rt:nth-child(3n){animation-delay:-.18s}
.rt .tb{display:none;position:absolute;top:5px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;align-items:center;justify-content:center;padding:0;z-index:2}
.edit .rt .tb{display:flex}.rt .tb.x{left:5px}.rt .tb.p{right:5px}
.edit .rt.new::after,.edit .rt .bdg{display:none}
.rt.drag{z-index:5;opacity:.85;transform:scale(1.06);animation:none!important}
.seg{display:flex;gap:6px;background:var(--glass);border:1px solid var(--glass-line);padding:4px;border-radius:14px;margin:12px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:10px;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px system-ui}
.seg button .lbl{display:none}.seg button.on{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-t)}.seg button.on .lbl{display:inline}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fld input{width:120px;text-align:right}
.pm{display:flex;align-items:center;gap:6px}.pm input{width:84px}.pm button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--accent);font:700 14px system-ui}
.bdchip{background:var(--accent2);color:var(--accent);border-radius:99px;font:700 11px system-ui;padding:2px 8px}
.callrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.callrow .num{font:700 18px system-ui}
a.ibtn-call{width:48px;height:48px;border-radius:14px;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.hide{display:none!important}
.row>input,.row>select{flex:1 1 0;min-width:0;width:auto}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="bar" class="bar" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="pwtoggle.js"></script>
<script>
/* ---------- icons ---------- */
const IP = {
  back:'<path d="M15 5l-7 7 7 7"/>', pencil:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>', check:'<path d="M5 12l5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h3l2.5 11h10l2-8H7"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat:'<path d="M4 20l1.5-4.5A8 8 0 1 1 8.5 18.5z"/><path d="M9.5 9.5c0 2.5 2 4.5 4.5 4.5l.8-1.4-1.8-.9-.8.7a3.6 3.6 0 0 1-1.6-1.6l.7-.8-.9-1.8z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>', bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l3-7h5l4 7M14 10l-1-4h-2"/>',
  dine:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>', cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', repeat:'<path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/>',
  img:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>', moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>'
};
const ic = (n, z) => `<svg viewBox="0 0 24 24" width="${z || 20}" height="${z || 20}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]}</svg>`;
// An icon-only button: always has a label for screen readers and a tooltip.
const ibtn = (n, label, attrs, cls) => `<button class="${cls || 'icon-btn'}" ${attrs || ''} title="${esc(label)}" aria-label="${esc(label)}">${ic(n)}</button>`;

/* ---------- state & storage ---------- */
const KEY = 'takeout.v1';   // old local save: copied up to your account once, so menus from before sign-in carry over
let S = { restaurants: [], carts: {}, hidden: [], seen: null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}

let view = 'home';         // home | add | menu | summary | orders | history | spend | settings
let spendPeriod = 6, spendCur = '', scope = 'me';   // scope: me (personal orders) | family
let curId = null, addTab = 'photo', busy = null, error = '', query = '', openCat = null;
let sample = true, canImages = true;
let me = null, ai = { configured: true, isAdmin: false }, pushT = null, editMode = false, restEdit = false, instrOpen = false;
let P = { tip: null, order: [], branch: {}, view: 'auto' };   // this person's Diner Bell settings, saved on their JoolzApp account

async function api(path, opts) {
  opts = opts || {}; const h = { 'content-type': 'application/json' };
  try { const t = sessionStorage.getItem('gd.token') || localStorage.getItem('gd.token'); if (t) h['x-gd-token'] = t; } catch (e) {}
  const r = await fetch(path, { method: opts.method || 'GET', headers: h, body: opts.body, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || 'Something went wrong (' + r.status + ')'); e.status = r.status; throw e; }
  return j;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} clearTimeout(pushT); pushT = setTimeout(push, 800); }
async function push() {
  try {
    await api('api/state', { method: 'PUT', body: JSON.stringify({ carts: S.carts, hidden: S.hidden, seen: S.seen }) });
    await api('api/prefs', { method: 'PUT', body: JSON.stringify({ tip: P.tip, order: P.order, branch: P.branch, hidden: S.hidden, seen: S.seen, view: P.view }) }).catch(e => { if (e.status === 401 || e.status === 403) throw e; });
  }
  catch (e) { if (e.status === 401 || e.status === 403) location.reload(); }
}
const myFamily = () => S.family && S.family.family;
const famOn = () => { const f = myFamily(); return f && f.myTier !== 'extended' ? f : null; };
async function loadFamily(withOrders) {
  try { S.family = await api('api/family'); } catch (e) { S.family = null; }
  if (famOn() && withOrders !== false) { try { S.famOrders = (await api('api/family/orders')).orders || []; } catch (e) {} } else if (!famOn()) S.famOrders = [];
}
async function loadGuard() { try { S.guard = await api('api/guardians'); } catch (e) { S.guard = null; } }
async function loadMenus() { S.restaurants = (await api('api/menus')).menus || []; }
(async () => {
  try { me = (await api('api/account/me')).user; } catch (e) {}
  try { ai = await api('api/ai/status'); } catch (e) {}
  // Menus now live in the shared archive on the server. Anything saved the old way (on this device, or in your account) is copied up once.
  let legacy = [], carts = Object.assign({}, S.carts || {}), hidden = Array.isArray(S.hidden) ? S.hidden : [], seen = Array.isArray(S.seen) ? S.seen : null;
  try { const { state } = await api('api/state'); if (state) { Object.assign(carts, state.carts || {}); if (Array.isArray(state.hidden)) hidden = state.hidden; if (Array.isArray(state.seen)) seen = state.seen; if (Array.isArray(state.restaurants)) legacy = state.restaurants; } } catch (e) {}
  let done = false; try { done = !!localStorage.getItem('grubtogo.migrated'); } catch (e) {}
  if (!done && !legacy.length) legacy = (S.restaurants || []).slice();
  // Settings live on the account (so updates and reinstalls never reset them). Anything saved before on this device or in the old
  // per-app file is copied up the first time.
  const ap = (me && me.prefs && me.prefs.diner) || null;
  if (ap) { P = { tip: typeof ap.tip === 'number' ? ap.tip : null, order: ap.order || [], branch: ap.branch || {}, view: ap.view || 'auto' }; if (Array.isArray(ap.hidden)) hidden = ap.hidden; if (Array.isArray(ap.seen)) seen = ap.seen; }
  else { const o = settings(); if (typeof o.tip === 'number') P.tip = o.tip; }
  S = { restaurants: [], carts, hidden, seen, history: [] };
  try { S.history = (await api('api/history')).orders || []; } catch (e) {}
  await loadFamily(); await loadGuard();
  let failed = 0;
  for (const r of legacy) {
    try { const m = (await api('api/menus', { method: 'POST', body: JSON.stringify(r) })).menu; if (S.carts[r.id]) { S.carts[m.id] = S.carts[r.id]; delete S.carts[r.id]; } }
    catch (e) { failed++; }
  }
  if (!failed) { try { localStorage.setItem('grubtogo.migrated', '1'); } catch (e) {} }
  if (legacy.length || !ap) push();
  try { await loadMenus(); } catch (e) { error = e.message; }
  // The first time on this account, everything already in the archive counts as seen; only menus added after that are NEW.
  if (!Array.isArray(S.seen) && !error) { S.seen = S.restaurants.map(r => r.id); push(); }
  render();
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rest = () => S.restaurants.find(r => r.id === curId);
// Default tip is a setting kept on this device only.
const SETKEY = 'grubtogo.settings';
const settings = () => { try { return JSON.parse(localStorage.getItem(SETKEY)) || {}; } catch (e) { return {}; } };
const defTip = () => { const t = P.tip != null ? P.tip : settings().tip; return typeof t === 'number' && t >= 0 && t <= 100 ? t : 15; };
const setDefTip = t => { P.tip = t; save(); };
const D = c => { c.type ||= 'collection'; c.items ||= {}; c.instructions ||= ''; c.mode ||= 'none'; c.n ||= 2; c.people ||= ['Me', 'Person 2']; c.assign ||= {}; return c; };
const cartOf = id => D(S.carts[id] ||= {});
const cart = () => cartOf(curId);
const money = (r, n) => (r.currency || 'R') + (Math.round(n * 100) / 100).toFixed(2);
const itemsOf = r => r.categories.flatMap(c => c.items.map(i => ({ ...i, cat: c.name })));
function cartLines(r) {
  const c = S.carts[r.id]; if (!c || !c.items) return [];
  const all = itemsOf(r);
  return Object.entries(c.items).filter(([, v]) => v.qty > 0).map(([id, v]) => ({ item: all.find(i => i.id === id), ...v })).filter(l => l.item);
}
const cartCount = r => cartLines(r).reduce((a, l) => a + l.qty, 0);
const lineCost = l => (l.item.price || 0) * l.qty;
const hasPrices = r => cartLines(r).some(l => l.item.price != null);
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
// Every menu in the shared archive shows up for everyone (new ones with a NEW tag until opened), except those switched off in Settings.
const isShown = r => !(S.hidden || []).includes(r.id);
const isNew = r => Array.isArray(S.seen) && !S.seen.includes(r.id);
const markSeen = id => { if (Array.isArray(S.seen) && !S.seen.includes(id)) { S.seen.push(id); save(); } };
const orderIx = r => { const k = (P.order || []).indexOf(r.id); return k < 0 ? 1e9 : k; };
const visibleRests = () => S.restaurants.filter(isShown).sort((a, b) => (orderIx(a) - orderIx(b)) || (isNew(b) - isNew(a)) || a.name.localeCompare(b.name));
const activeRests = () => visibleRests().filter(r => cartCount(r) > 0);

// Collection: no tip. Delivery: a delivery fee (often only known during the call) and a driver tip in rand. Sit Down: a tip in rand,
// suggested from the default tip % rounded to the nearest R10 (half up); once you type your own amount it is kept exactly as typed.
const suggestTip = sub => Math.floor(sub * defTip() / 100 / 10 + 0.5) * 10;
const typeOf = c => c.type || 'collection';
const numOr = v => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; };
const orderDate = c => /^\d{4}-\d{2}-\d{2}$/.test(c.date || '') && c.date < todayStr() ? c.date : todayStr();
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function bill(r) {
  const c = cartOf(r.id), lines = cartLines(r), t = typeOf(c);
  const sub = lines.reduce((a, l) => a + lineCost(l), 0);
  const fee = t === 'delivery' ? numOr(c.fee) : 0;
  const tip = t === 'delivery' ? numOr(c.dtip) : t === 'sit' ? (c.stip != null && c.stip !== '' ? numOr(c.stip) : suggestTip(sub)) : 0;
  const extra = fee + tip, total = sub + extra, pct = sub ? Math.round(tip / sub * 1000) / 10 : 0;
  let people = null, unassigned = 0;
  const pid = i => (c.pids || [])[i] || '';
  if (c.mode === 'equal') people = Array.from({ length: c.n }, (_, i) => ({ name: c.people[i] || 'Person ' + (i + 1), pid: pid(i), sub: sub / c.n, tip: extra / c.n, amt: total / c.n }));
  if (c.mode === 'items') {
    people = c.people.map((n, i) => ({ name: n, pid: pid(i), sub: 0, tip: 0, amt: 0 }));
    lines.forEach(l => {
      const a = (c.assign[l.item.id] || []).filter(i => i < people.length);
      if (!a.length) unassigned += lineCost(l); else a.forEach(i => people[i].sub += lineCost(l) / a.length);
    });
    const assigned = people.reduce((a, p) => a + p.sub, 0) || 1;
    people.forEach(p => { p.tip = extra * p.sub / assigned; p.amt = p.sub + p.tip; });
  }
  return { sub, fee, tip, extra, total, pct, type: t, people, unassigned };
}

function render() {
  const h = $('#hdr'), a = $('#app'), bar = $('#bar');
  setTimeout(() => document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'), 0);
  bar.hidden = true;
  const back = t => ibtn('back', 'Back', `data-a="${t}"`);
  const logo = `<h1>Diner Bell</h1>`;

    h.innerHTML = logo + ibtn('receipt', 'Previous orders and spending', 'data-a="history"') + ibtn('gear', 'Settings', 'data-a="settings"') + (me ? ibtn('home', 'Back to Dashboard', 'data-a="dashboard"') : '');

  } else if (view === 'summary') {
    const r = rest();
    h.innerHTML = back('menu') + `<h1>${esc(r.name)} order</h1>`; a.innerHTML = summaryHTML(r);
  } else if (view === 'settings') {
    h.innerHTML = back('home') + `<h1>Settings</h1>`; a.innerHTML = settingsHTML();
  } else if (view === 'orders') {
    h.innerHTML = back('home') + `<h1>All orders</h1>`; a.innerHTML = ordersHTML();
  } else if (view === 'history') {
    h.innerHTML = back('home') + `<h1>Previous orders</h1>`; a.innerHTML = historyHTML();
  } else if (view === 'spend') {
    h.innerHTML = back('home') + `<h1>Spending</h1>`; a.innerHTML = spendHTML();
  }
}

function spendHTML() {

  const curs = [...new Set(all.map(o => o.currency))];
  if (!curs.includes(spendCur)) spendCur = curs.sort((a, b) => all.filter(o => o.currency === b).length - all.filter(o => o.currency === a).length)[0];
  const now = new Date(), cut = spendPeriod ? new Date(now.getFullYear(), now.getMonth() - spendPeriod + 1, 1) : null;
  const os = all.filter(o => o.currency === spendCur && (!cut || dOf(o) >= cut));
  const chips = [[3, '3 months'], [6, '6 months'], [12, '12 months'], [0, 'Lifetime']].map(([n, l]) => `<button class="chip ${spendPeriod === n ? 'on' : ''}" data-a="period" data-v="${n}">${l}</button>`).join('');

  if (!os.length) return out + `<div class="card" style="text-align:center">No orders in this period.</div>`;
  const total = os.reduce((a, o) => a + o.total, 0), first = os.reduce((m, o) => dOf(o) < m ? dOf(o) : m, new Date());
  const months = Math.max(1, spendPeriod || ((now.getFullYear() - first.getFullYear()) * 12 + now.getMonth() - first.getMonth() + 1));
  // monthly buckets (yearly when lifetime runs past two years)
  const byYear = !spendPeriod && months > 24, buckets = new Map();
  for (let n = months - 1; n >= 0; n--) { const d = new Date(now.getFullYear(), now.getMonth() - n, 1); buckets.set(byYear ? String(d.getFullYear()) : monthKey(d), 0); }
  os.forEach(o => { const k = byYear ? String(dOf(o).getFullYear()) : monthKey(dOf(o)); buckets.set(k, (buckets.get(k) || 0) + o.total); });
  const data = [...buckets.entries()], max = Math.max(...data.map(d => d[1]), 1), W = 320, H = 150, bw = W / data.length;
  const bars = data.map(([k, v], ix) => { const bh = Math.round(v / max * (H - 34)); return `<g><rect x="${(ix * bw + bw * .15).toFixed(1)}" y="${H - 18 - bh}" width="${(bw * .7).toFixed(1)}" height="${bh}" rx="3" fill="var(--accent)"><title>${esc(byYear ? k : monthLbl(k))}: ${cm(spendCur, v)}</title></rect>`
    + (data.length <= 13 || ix % Math.ceil(data.length / 12) === 0 ? `<text x="${(ix * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".65">${esc(byYear ? k : monthLbl(k).split(' ')[0])}</text>` : '')
    + (v && data.length <= 13 ? `<text x="${(ix * bw + bw / 2).toFixed(1)}" y="${H - 21 - bh}" text-anchor="middle" font-size="8" fill="currentColor" opacity=".8">${Math.round(v)}</text>` : '') + `</g>`; }).join('');
  out += `<div class="card"><div class="row" style="justify-content:space-around;text-align:center">
      <div><div class="mute">Spent</div><div class="h" style="margin:0">${cm(spendCur, total)}</div></div>
      <div><div class="mute">Orders</div><div class="h" style="margin:0">${os.length}</div></div>
      <div><div class="mute">Avg / order</div><div class="h" style="margin:0">${cm(spendCur, total / os.length)}</div></div>
      <div><div class="mute">Avg / ${byYear ? 'year' : 'month'}</div><div class="h" style="margin:0">${cm(spendCur, total / data.length)}</div></div></div></div>
    <div class="card"><div class="h">${byYear ? 'Yearly' : 'Monthly'} expenditure</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${byYear ? 'Yearly' : 'Monthly'} spending">${bars}</svg></div>`;
  const by = new Map();
  os.forEach(o => { const k = normName(o.restName), e = by.get(k) || { name: o.restName, spent: 0, n: 0 }; e.spent += o.total; e.n++; e.name = o.restName; by.set(k, e); });
  const rows = [...by.values()].sort((a, b) => b.spent - a.spent), top = rows[0].spent;
  if (famView) {
    const who = new Map(); os.forEach(o => { const e = who.get(o.byId) || { name: o.byName || 'Someone', spent: 0, n: 0 }; e.spent += o.total; e.n++; who.set(o.byId, e); });
    const wr = [...who.values()].sort((a, b) => b.spent - a.spent);
    out += `<div class="card"><div class="h">Who placed the orders</div>` + wr.map(e => `<div class="kv"><span>${esc(e.name)} · ${e.n} order${e.n > 1 ? 's' : ''}</span><span>${cm(spendCur, e.spent)}</span></div>`).join('') + `</div>`;
  }
  out += `<div class="card"><div class="h">Where you order from</div>` + rows.map(e => `<div style="margin:10px 0"><div class="row" style="justify-content:space-between;gap:8px"><div>${esc(e.name)}</div><div class="price">${cm(spendCur, e.spent)}</div></div>
      <div style="background:var(--line);border-radius:99px;height:8px;margin:4px 0"><div style="width:${Math.max(2, Math.round(e.spent / top * 100))}%;height:8px;border-radius:99px;background:var(--accent)"></div></div>
      <div class="mute">${e.n} order${e.n > 1 ? 's' : ''} · ${Math.round(e.spent / total * 100)}% of spend · avg ${cm(spendCur, e.spent / e.n)}</div></div>`).join('') + `</div>`;
  return out;
}

    const curV = f === 'stip' ? (c.stip != null && c.stip !== '' ? numOr(c.stip) : suggestTip(bill(r).sub)) : numOr(c[f]);
    c[f] = Math.max(0, Math.round((curV + d) * 100) / 100); save(); return keepScroll();
  }
  if (a === 'use-sg') { delete cart().stip; save(); return keepScroll(); }
  if (a === 'wa') { const r = S.restaurants.find(x => x.id === id); return typeOf(cartOf(r.id)) === 'delivery' ? askAddress(r) : sendWhatsApp(r); }
  if (a === 'history' || a === 'spend') { go(a); if (famOn()) loadFamily().then(() => { if (view === a) render(); }); return; }
  if (a === 'period') { spendPeriod = +v; return render(); }
  if (a === 'cur') { spendCur = v; return render(); }
  if (a === 'placed') return askPlaced(S.restaurants.find(r => r.id === id));
  if (a === 'scope') { scope = v; return render(); }
  if (a === 'repeat') return repeatOrder([...(S.history || []), ...(S.famOrders || [])].find(o => o.id === id));
  if (a === 'del-order') {
    if (!confirm('Delete this order from your history? It will no longer count in your spending.')) return;
    try {
      if (scope === 'family' && famOn()) { await api('api/family/orders/' + id, { method: 'DELETE' }); S.famOrders = S.famOrders.filter(o => o.id !== id); }
      else { await api('api/history/' + id, { method: 'DELETE' }); S.history = S.history.filter(o => o.id !== id); }
      render();
    } catch (err) { toast(err.message); } return;
  }
  if (a === 'settings') return go('settings');
  if (a === 'rest-all') { S.hidden = []; save(); return render(); }
  if (a === 'rest-none') { S.hidden = S.restaurants.map(r => r.id); save(); return render(); }
  if (a === 'dtip') { setDefTip(parseFloat(v)); return render(); }
  if (a === 'dashboard') {
    // Back to the JoolzApp dashboard (Portal Admin); it signs you in with the same account, so there is no second login.
    let t = ''; try { t = sessionStorage.getItem('gd.token') || localStorage.getItem('gd.token') || ''; } catch (e) {}
    const base = (me && me.portalUrl) || (location.protocol + '//' + location.hostname + ':3892/');
    toast('Opening dashboard…'); el.disabled = true;   // instant feedback: the dashboard is a full page load
    setTimeout(() => { location.href = base + (t ? '#sso=' + encodeURIComponent(t) : ''); }, 50); return;
  }
  if (a === 'signout') { try { localStorage.removeItem('gd.token'); sessionStorage.removeItem('gd.token'); } catch (e) {} await fetch('api/account/logout', { method: 'POST' }).catch(() => {}); return location.reload(); }
  if (a === 'ai-save') {
    const key = $('#ai-key').value.trim(); if (!key) return toast('Paste your API key first.');
    try { const j = await api('api/ai/config', { method: 'POST', body: JSON.stringify({ provider: $('#ai-prov').value, apiKey: key, model: $('#ai-model').value.trim() }) }); ai = { ...ai, ...j }; toast(ai.configured ? 'Menu reading is ready ✓' : 'Saved — this provider also needs a model name.'); render(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (a === 'add') { addTab = 'photo'; busy = null; return go('add'); }
  if (a === 'tab') { addTab = el.dataset.k; error = ''; return render(); }
  if (a === 'open') { if (editMode) return; markSeen(id); return go('menu', id); }
  if (a === 'cat') { openCat = el.dataset.cat; return keepTop(); }
  if (a === 'cat-back') { openCat = null; return keepTop(); }
  if (a === 'menu') return go('menu');
  if (a === 'summary') return go('summary');
  if (a === 'orders') return go('orders');
  if (a === 'open-sum') return go('summary', id);
  if (a === 'inc') { const l = (cart().items[id] ||= { qty: 0, note: '' }); l.qty++; save(); return keepScroll(); }
  if (a === 'dec') { const c = cart(), l = c.items[id]; if (l) { l.qty = Math.max(0, l.qty - 1); if (!l.qty) delete c.items[id]; } save(); return keepScroll(); }
  if (a === 'del') {
    if (el.dataset.arm) {
      try { await api('api/menus/' + curId, { method: 'DELETE' }); } catch (e) { return toast(e.message); }
      S.restaurants = S.restaurants.filter(r => r.id !== curId); delete S.carts[curId]; save(); return go('home');
    }
    el.dataset.arm = 1; el.textContent = '✔?'; toast('Tap again to delete this restaurant and its order');
    setTimeout(() => { delete el.dataset.arm; el.textContent = '🗑'; }, 3000); return;
  }
  if (a === 'clear') { S.carts[curId] = {}; save(); return go('menu'); }
  if (a === 'copy-phone') return copy(contactOf(S.restaurants.find(r => r.id === id)).phone, el);
  if (a === 'versions') {
    const r = S.restaurants.find(x => x.id === id), box = $('#vers'); box.innerHTML = '<span class="mute">Loading…</span>';
    try {
      const { versions } = await api('api/menus/' + id + '/versions');
      box.innerHTML = versions.length ? versions.map(v => `<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid var(--line)"><div class="grow mute">${esc(fmtDate(v.version))}${v.byName ? ' · ' + esc(v.byName) : ''}</div>${r.canEdit ? `<button class="link" data-a="restore" data-id="${id}" data-v="${v.id}">Restore</button>` : ''}</div>`).join('') : '<span class="mute">No earlier versions yet.</span>';
    } catch (err) { box.textContent = err.message; }
    return;
  }
  if (a === 'restore') {
    if (!confirm('Put this older version back? The current one is kept in the archive.')) return;
    try { const res = await api('api/menus/' + id + '/restore', { method: 'POST', body: JSON.stringify({ versionId: v }) }); const ix = S.restaurants.findIndex(x => x.id === id); S.restaurants[ix] = res.menu; S.carts[id] = {}; save(); render(); toast('Version restored'); }
    catch (err) { toast(err.message); }
    return;
  }
  if (a === 'add-branch') { const r = rest(); r.branches = [...(r.branches || []), { name: '', phone: '' }]; render(); const ins = document.querySelectorAll('[data-bf=name]'); if (ins.length) ins[ins.length - 1].focus(); return; }
  if (a === 'del-branch') { const r = rest(); r.branches.splice(i, 1); saveBranches(r); return render(); }
  if (a === 'copy-all') return copy(allOrdersText(), el);
  if (a === 'copy-order') return copy(orderText(S.restaurants.find(r => r.id === id)), el);
  if (a === 'go-url') { const u = $('#f-url').value.trim(); if (u) ingest({ url: u }); return; }
  if (a === 'go-text') { const t = $('#f-text').value.trim(); if (t.length >= 20) ingest({ text: t }); return; }
  // bill controls
  const c = curId && S.carts[curId] ? cart() : null;
  if (a === 'mode') { c.mode = v; save(); return keepScroll(); }
  if (a === 'n-') { c.n = Math.max(2, c.n - 1); save(); return keepScroll(); }
  if (a === 'n+') { c.n = Math.min(30, c.n + 1); save(); return keepScroll(); }
  if (a === 'add-person') { c.people.push('Person ' + (c.people.length + 1)); save(); return keepScroll(); }
  if (a === 'rm-person') {
    c.people.splice(i, 1); if (c.pids) c.pids.splice(i, 1);
    for (const k in c.assign) c.assign[k] = c.assign[k].filter(x => x !== i).map(x => x > i ? x - 1 : x);
    save(); return keepScroll();
  }
  if (a === 'assign') { const s = (c.assign[id] ||= []); const k = s.indexOf(i); k >= 0 ? s.splice(k, 1) : s.push(i); save(); return keepScroll(); }
});
async function copy(text, el) {
  const old = el.textContent;
  try { await navigator.clipboard.writeText(text); el.textContent = 'Copied ✓'; } catch (e) { el.textContent = 'Copy not available'; }
  setTimeout(() => el.textContent = old, 1800);
}
let brT; function saveBranches(r) { clearTimeout(brT); brT = setTimeout(() => api('api/menus/' + r.id, { method: 'PUT', body: JSON.stringify({ branches: r.branches }) }).catch(e => toast(e.message)), 700); }
let waT; function saveWa(r) { clearTimeout(waT); waT = setTimeout(() => api('api/menus/' + r.id, { method: 'PUT', body: JSON.stringify({ wa: r.wa }) }).catch(e => toast(e.message)), 700); }
let phT; function savePhone(r) { clearTimeout(phT); phT = setTimeout(() => api('api/menus/' + r.id, { method: 'PUT', body: JSON.stringify({ phone: r.phone }) }).catch(e => toast(e.message)), 700); }
function refreshBill() { const r = rest(), n = $('#bn'), s = $('#sp'); if (n) n.innerHTML = billNumsHTML(r); if (s) s.innerHTML = splitHTML(r); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'branch') { const c = cart(); delete c.branch; P.branch = P.branch || {}; P.branch[curId] = t.value; save(); return render(); }
  if (t.id === 'odate') { const c = cart(); c.date = t.value && t.value <= todayStr() ? t.value : todayStr(); save(); return render(); } if (!t.dataset || !t.dataset.rest) return;
  const cur = new Set(S.hidden || []);
  t.checked ? cur.delete(t.dataset.rest) : cur.add(t.dataset.rest);   // ticked = shown; unticked = hidden
  S.hidden = [...cur]; save();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { query = t.value; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  else if (t.dataset.bi != null) { const r = rest(); r.branches[+t.dataset.bi][t.dataset.bf] = t.value; saveBranches(r); }
  else if (t.id === 'cname') { cart().customName = t.value; save(); }
  else if (t.id === 'cphone') { cart().customPhone = t.value.trim(); save(); }
  else if (t.id === 'phone') { const r = rest(); r.phone = t.value.trim(); savePhone(r); }
  else if (t.id === 'rwa') { const r = rest(); r.wa = t.value.trim(); saveWa(r); }
  else if (t.id === 'addr') { cart().address = t.value; save(); }
  else if (t.id === 'fee' || t.id === 'dtip' || t.id === 'stip') {
    const c = cart(); if (t.value === '') delete c[t.id]; else c[t.id] = Math.max(0, parseFloat(t.value) || 0);   // what you type is kept exactly as typed
    save(); refreshBill();
  }
  else if (t.id === 'gen') { cart().instructions = t.value; save(); }
  else if (t.id === 'dtipc') { setDefTip(Math.max(0, Math.min(100, parseFloat(t.value) || 0))); }
  else if (t.dataset.note) { const l = cart().items[t.dataset.note]; if (l) { l.note = t.value; save(); } }
  else if (t.dataset.pname != null) { cart().people[+t.dataset.pname] = t.value; save(); refreshBill(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.id === 'f-logo' || t.id === 'f-logo-m') && t.files.length) { const id = t.id === 'f-logo' ? t.dataset.id : curId; setLogo(id, t.files[0]); return; }
  if (t.id === 'f-photo' && t.files.length) ingest({ images: [...t.files].slice(0, 6) });
  if (t.id === 'f-pdf' && t.files.length) ingest({ pdf: t.files[0] });
  if (t.dataset && t.dataset.plink != null) { const c = cart(); c.pids ||= []; c.pids[+t.dataset.plink] = t.value; save(); refreshBill(); }
  if (t.dataset && t.dataset.pname != null) render();   // refresh chip labels after editing a name
});

/* ---------- restaurant pictures ---------- */
// Cropped to a small square so the tile loads fast and the shared archive stays light.
async function logoFrom(file) {
  const bmp = await createImageBitmap(file), side = Math.min(bmp.width, bmp.height), cv = document.createElement('canvas');
  cv.width = cv.height = 360; cv.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 360, 360);
  return cv.toDataURL('image/jpeg', 0.82);
}
async function setLogo(id, file) {
  try {
    toast('Saving picture…');
    const res = await api('api/menus/' + id + '/logo', { method: 'POST', body: JSON.stringify({ logo: await logoFrom(file) }) });
    const ix = S.restaurants.findIndex(x => x.id === id); if (ix >= 0) S.restaurants[ix] = res.menu; render(); toast('Picture saved for everyone');
  } catch (err) { toast(err.message || 'Could not save that picture.'); }
}

/* ---------- tiles: hold to edit, drag to reorder ---------- */
let holdT = null, holdXY = [0, 0], drag = null;
const holdStop = () => { clearTimeout(holdT); holdT = null; };
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('#grid .rt:not(.add)'); if (!t || view !== 'home' || e.target.closest('.tb')) return;
  if (!editMode) { holdStop(); holdXY = [e.clientX, e.clientY]; holdT = setTimeout(() => { holdT = null; if (navigator.vibrate) navigator.vibrate(15); editMode = true; render(); }, 550); return; }
  if (query.trim()) return;   // drag to reorder only on the full list
  drag = { el: t, x: e.clientX, y: e.clientY, on: false, pid: e.pointerId };
  try { $('#grid').setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (holdT && Math.hypot(e.clientX - holdXY[0], e.clientY - holdXY[1]) > 10) holdStop();
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.on = true; drag.el.classList.add('drag'); }
  if (!drag.on) return;
  e.preventDefault();
  const under = document.elementsFromPoint(e.clientX, e.clientY).map(x => x.closest && x.closest('#grid .rt:not(.add)')).find(x => x && x !== drag.el);
  if (!under) return;
  const kids = [...$('#grid').children];
  if (kids.indexOf(under) > kids.indexOf(drag.el)) under.after(drag.el); else under.before(drag.el);
}, { passive: false });
const dragEnd = () => {
  holdStop(); if (!drag) return;
  const d = drag; drag = null; d.el.classList.remove('drag');
  if (d.on) { const ids = [...$('#grid').querySelectorAll('.rt[data-id]')].map(x => x.dataset.id); P.order = [...ids, ...(P.order || []).filter(x => !ids.includes(x))]; save(); }
};
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, dragEnd, true));
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#grid .rt')) e.preventDefault(); });

/* ---------- menu extraction ---------- */
const PROMPT = `You extract restaurant menus into JSON. Reply with ONLY one JSON object, no prose, no code fences:
{"name": string, "phone": string|null, "currency": string, "categories": [{"name": string, "items": [{"name": string, "description": string, "price": number|null}]}]}
Rules: include every dish and drink actually on the menu; never invent items or prices. "phone" is the restaurant's telephone number exactly as printed anywhere in the source, else null. "currency" is the symbol used for prices (e.g. "R", "$", "€"; default "R" if unclear). "price" is a plain number without symbol (use the base price if sizes vary). Keep the menu's own language. If the source contains no readable menu, reply {"error":"reason"}.`;

async function ingest(src) {
  error = '';
  try {
    let body;
    if (src.images || src.pdf) {
      busy = src.pdf ? 'Reading PDF…' : 'Preparing photos…'; render();
      let imgs = [], text = '';
      if (src.pdf) { const r = await readPdf(src.pdf); imgs = r.images; text = r.text; }
      else imgs = await Promise.all(src.images.map(shrink));
      body = text.length > 300 ? { text } : { images: await Promise.all(imgs.map(b64)) };
    } else if (src.url) body = { url: src.url };
    else body = { text: src.text };

    busy = body.images ? 'Reading the menu, then checking it…' : 'Reading the menu…'; render();
    const j = (await api('api/extract', { method: 'POST', body: JSON.stringify(body) })).menu;
    try { ai = await api('api/ai/status'); } catch (e) {}
    if (!j) throw new Error('Could not read a menu from that.');
    if (j.error) throw new Error(src.url ? 'Could not open that link (' + j.error + '). Try a screenshot, PDF, or the Paste tab.' : 'No readable menu found (' + j.error + ').');
    let n = 0; const stamp = Date.now().toString(36);   // new item ids per upload, so older baskets never point at the wrong dish
    const cats = (j.categories || []).map((c, ci) => ({ name: c.name || 'Menu', items: (c.items || []).filter(i => i && i.name).map((i, ii) => ({ id: `u${stamp}c${ci}i${ii}`, name: String(i.name), description: i.description || '', price: typeof i.price === 'number' ? i.price : (parseFloat(i.price) || null) })) })).filter(c => c.items.length);
    cats.forEach(c => n += c.items.length);
    if (!n) throw new Error('No menu items were found.');
    busy = 'Saving to the shared archive…'; render();
    const keep = body.images ? body.images.map((im, k) => ({ kind: 'image', type: im.type, data: im.data, name: (src.pdf ? 'Page ' : 'Photo ') + (k + 1) })) : body.url ? [{ kind: 'url', url: body.url }] : body.text ? [{ kind: 'text', text: body.text, name: src.pdf ? 'Text from the PDF' : 'Pasted text' }] : [];
    const res = await api('api/menus', { method: 'POST', body: JSON.stringify({ name: j.name || 'Restaurant', phone: j.phone || '', currency: j.currency || 'R', categories: cats }) });
    const r = res.menu, ix = S.restaurants.findIndex(x => x.id === r.id);
    if (keep.length) api('api/menus/' + r.id + '/sources', { method: 'POST', body: JSON.stringify({ items: keep }) }).catch(() => {});   // the original material is archived with the menu
    if (ix >= 0) { S.restaurants[ix] = r; S.carts[r.id] = {}; S.hidden = (S.hidden || []).filter(x => x !== r.id); } else S.restaurants.unshift(r);
    markSeen(r.id); busy = null; go('menu', r.id);
    toast(res.merged ? `${r.name} is already in the archive, so this is now its latest version` : body.images ? 'Menu added. Check the prices: stylised fonts can be misread (hold an item to fix it).' : 'Menu added to the shared archive');
  } catch (e) {
    busy = null; error = (e && e.message) || (e && e.code === 'not_granted' ? 'Permission to read menus was not granted.' : 'Something went wrong.'); render();
  }
}
const b64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res({ type: 'image/jpeg', data: String(f.result).split(',')[1] }); f.onerror = rej; f.readAsDataURL(blob); });
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF reader.')); document.head.appendChild(s); }); }
async function readPdf(file) {
  if (!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = Math.min(pdf.numPages, 6); let text = ''; const images = [];
  for (let p = 1; p <= pages; p++) { const pg = await pdf.getPage(p); const tc = await pg.getTextContent(); text += tc.items.map(i => i.str).join(' ') + '\n'; }
  if (text.length <= 300) {
    for (let p = 1; p <= pages; p++) {
      const pg = await pdf.getPage(p); const vp0 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: Math.min(3, 2400 / Math.max(vp0.width, vp0.height)) });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      images.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)));
    }
  }
  return { text, images };
}
render();
