<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E7A4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Jolly Grocer</title>
<script src="floatbar.js"></script>
<link rel="stylesheet" href="glass.css">
<style>
:root{--accent:#1E7A4C;--accent-2:#4FC083;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#4FC083;--accent-2:#7FD6A6;--accent-t:#06210F}}
:root[data-theme="dark"]{--accent:#4FC083;--accent-2:#7FD6A6;--accent-t:#06210F}
:root{--surface:var(--glass);--surface-2:var(--chip);--ink:var(--text);--line-strong:var(--glass-line);--accent-ink:var(--accent-t);--accent-text:var(--accent);--accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);--danger-ink:#fff;--toast-bg:var(--text);--toast-fg:var(--bg);--toast-accent:var(--accent);--font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-display:var(--font-body);--font-mono:ui-monospace,Menlo,Consolas,monospace}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px;display:grid;gap:12px}
.acct{display:flex;gap:6px;justify-content:flex-end;margin-top:-6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;margin:0;font-size:22px;letter-spacing:-.01em}
.brand b{color:var(--accent-text)}
.mark{width:30px;height:30px;flex:none}
.mark rect{fill:var(--accent)}.mark path{fill:none;stroke:var(--accent-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.totals{margin:0;color:var(--muted);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.card h2,.card h3{margin:0;font-size:17px}
.card h3{font-size:15px}
.muted{color:var(--muted);font-size:14px;margin:0}
button,input,select{font:inherit;color:inherit}
input,select{min-height:46px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:16px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:46px;min-width:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:44px;padding:6px 11px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg,.chipico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.grow>input{flex:1 1 160px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;min-height:44px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 13px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sug{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.title-in{flex:1 1 180px;font-size:19px;font-weight:700;border-color:transparent;background:transparent;padding-left:2px}
.title-in:hover,.title-in:focus{border-color:var(--line-strong);background:var(--surface)}
.group{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;background:var(--accent-soft);flex-wrap:wrap}
.ghead b{font-size:16px}
.ghead .n{color:var(--muted);font-size:13px}
.cat{padding:7px 12px 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.swipe-bg{position:absolute;inset:0;background:var(--danger);display:flex;justify-content:flex-end}
.swipe-del{width:88px;border:0;background:transparent;color:#fff;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.swipe-del svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item{position:relative;display:flex;align-items:center;gap:4px;min-height:52px;background:var(--solid);touch-action:pan-y;transition:transform .18s ease}
.item.drag{transition:none}
.tick{flex:none;width:52px;height:52px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-text)}
.tick i{width:24px;height:24px;border:2px solid var(--line-strong);border-radius:7px;display:grid;place-items:center}
.tick[aria-pressed=true] i{background:var(--accent);border-color:var(--accent)}
.tick svg{width:16px;height:16px;fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed=true] svg{opacity:1}
.itext{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:10px 8px 10px 0;cursor:pointer;font-size:16px;overflow-wrap:anywhere}
.item.done .itext{text-decoration:line-through;color:var(--muted)}
.edit{padding:10px 12px 12px;background:var(--surface-2);border-top:1px solid var(--line);display:grid;gap:8px}
.edit .row>*{flex:1 1 130px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.delta{font-size:13.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr 92px;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .full{grid-column:1/-1}
.line .row>*{flex:1 1 110px}
.pur{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.pur:first-of-type{border-top:0}
.pur summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:36px;align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700}
.warn{color:var(--warn);font-size:14px}
textarea{width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px;font:12px ui-monospace,Menlo,monospace}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:0}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;padding:0 14px}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---- Glass layer: shared look from glass.css ---- */
.card,.group{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.btn{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:var(--r-sm);color:var(--text)}
.btn:hover{background:var(--glass-strong);border-color:var(--accent)}
.btn.primary{background:linear-gradient(145deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-t);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);filter:none}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent)}
.btn.danger{background:var(--glass-strong);color:var(--danger);border-color:var(--glass-line)}
input,select,textarea{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:var(--r-sm);color:var(--text)}
.tabs{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabs button[aria-selected=true]{background:var(--glass-strong);color:var(--text);box-shadow:0 2px 8px rgba(31,42,68,.12)}
.chip{border-radius:var(--r-pill);background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--text)}
.chip[aria-pressed=true]{background:linear-gradient(145deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-t)}
.top{padding:6px 2px;justify-content:flex-end}
/* photo review rows: glass.css stacks every label in a column, so the row gets its own layout */
/* photo review: compact rows, no lines between items, a plain checkbox that shows an empty box when unticked */
.line.rv{grid-template-columns:minmax(0,1fr);gap:6px;padding:7px 0;border-top:0}
.rvlist{display:grid;gap:2px}
.rvhead{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center}
.rvhead input[type=text]{width:100%}
.rvhead select{min-width:0}
#view{display:grid;gap:12px}
.wrap .card{margin:0}
.rvrow{display:grid;grid-template-columns:26px minmax(0,1fr) 78px;gap:8px;align-items:center}
.rvrow input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;min-height:0;margin:0;padding:0;border-radius:7px;border:2px solid var(--line-strong);background:var(--glass-strong);cursor:pointer;display:grid;place-items:center}
.rvrow input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.rvrow input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-t);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rvrow input[type=text],.rvrow select,.line.rv .row select{width:100%;min-width:0;min-height:40px;padding:5px 10px}
.line.rv .row.full{gap:6px}
.tb-btn[aria-pressed=true]{background:var(--accent);color:var(--accent-t);border-color:transparent}
</style>

  ];
  const guessCat = (t) => { t = String(t).toLowerCase(); for (const g of GUESS) if (g[1].test(t)) return CATS.indexOf(g[0]) >= 0 ? g[0] : 'Other'; return 'Other'; };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const UNITS = /^(x|kg|g|l|ml|pk|pack|packs|each|ea)$/;

  const money = (n) => CUR + ' ' + (Math.round((+n || 0) * 100) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const dayKey = (d) => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const toLocalInput = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const fmtAt = (d) => new Date(d).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  }
  const NS = 'http://www.w3.org/2000/svg';

  }
  // A small name prompt that works in the installed app (no browser dialogs).
  function askName(title, hint, max, done) {
    const old = document.getElementById('ask-name'); if (old) old.remove();
    const inp = h('input', { type: 'text', maxlength: String(max), placeholder: hint, 'aria-label': title, style: 'width:100%' });
