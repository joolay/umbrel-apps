<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#be123c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kiosk">
<title>Kiosk Manager</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="floatbar.js"></script>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="floatbar.css">
</head>
<body>
  <header class="topbar"><div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Kiosk Manager</span></div><span class="tb-gap"></span><button class="tb-btn" data-theme-toggle><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button></header>

  <main class="wrap">
    <section class="card">
      <div class="srow"><span>Kiosk software<small>Cage + Chromium on the server</small></span><span id="sInst" class="chip">…</span></div>
      <div class="srow"><span>Kiosk browser<small>On the server's own screen now</small></span><span id="sRun" class="chip">…</span></div>
      <div class="srow"><span>Start at boot<small>Opens by itself when the server starts</small></span><span id="sBoot" class="chip">…</span></div>
    </section>

    <section class="card">
      <div class="acts">
        <button class="btn primary" id="bInst">Install kiosk</button>
        <button class="btn primary" id="bLoad">Load kiosk</button>
        <button class="btn" id="bUnload">Unload kiosk</button>
      </div>
      <div class="acts">
        <button class="btn" id="bBootOn">Add to boot</button>
        <button class="btn" id="bBootOff">Remove from boot</button>
        <button class="btn danger" id="bUninstall">Remove service</button>
      </div>
    </section>

    <section class="card">
      <label class="f">Page shown on the screen
        <input class="f" id="url" inputmode="url" autocomplete="off">
      </label>
      <div class="acts"><button class="btn primary" id="bSave">Save</button></div>
      <p class="note">Default is the Umbrel dashboard on this device (http://localhost).</p>
    </section>

    <section class="card">
      <div id="msg" class="note"></div>
      <pre class="log" id="logs"></pre>
    </section>
  </main>
  <script src="app.js"></script>
<script src="linkstatus.js" data-claude></script>
</body>
</html>
