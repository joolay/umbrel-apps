<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Pilot</title>
<meta name="theme-color" content="#b45309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Project Pilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="gate.css">
<style>
/* Brand tokens only (see templates/glass/README.md) */
:root{--accent:#b45309;--accent-2:#f59e0b;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#f59e0b;--accent-2:#fbbf24;--accent-t:#2a1500}}
:root[data-theme="dark"]{--accent:#f59e0b;--accent-2:#fbbf24;--accent-t:#2a1500}
</style>
<script src="theme-global.js"></script>
</head>
<body>
<main class="jz-card" id="card">
  <img class="jz-logo" src="icon.svg" alt="">
  <h1>Project Pilot</h1>
  <p class="jz-sub" id="sub">Sign in with your JoolzApp account</p>
  <div id="view"></div>
</main>
<script src="pwtoggle.js"></script>
<script src="quick-ui.js"></script>
<script src="gate.js"></script>
<script>
JZGate({ app: "project-tracker", name: "Project Pilot", tokenKey: "gd.token", tokenHeader: "x-gd-token", clear: ["gd_prefs"], tagline: "Every project, note and next step in one place" });
</script>
</body>
</html>
