<style>
:root{--accent:#b45309;--accent-2:#f59e0b;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#f59e0b;--accent-2:#fbbf24;--accent-t:#2a1500}}
:root[data-theme="dark"]{--accent:#f59e0b;--accent-2:#fbbf24;--accent-t:#2a1500}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px 90px}
.pick{margin:12px 0}.pick select{width:100%;max-width:340px;font-weight:600}
/* the list picker and the tabs stay under the top bar while the page scrolls */
.stick{position:sticky;top:calc(var(--safe-t,0px) + 56px);z-index:15;margin:4px -14px 8px;padding:8px 14px 6px;background:var(--solid);background:color-mix(in srgb,var(--solid) 94%,transparent);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid var(--glass-line)}
.stick .pick{margin:0 0 6px}.stick .st{margin-bottom:0}
.st.dd{flex-wrap:wrap;overflow:visible;align-items:center}.st.dd select{flex:1 1 150px;min-width:0;font-weight:600}
.tabpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 12px;margin:8px 0}.tabpick label{display:flex;gap:8px;align-items:center}
.st{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.st button{white-space:nowrap}
.st .n{opacity:.7;margin-left:4px}
.cat{margin:16px 2px 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;align-items:stretch}
.p{position:relative;overflow:hidden;margin:0;padding:0;border-left:4px solid var(--c,var(--line));-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.p>.swc{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;align-content:start;gap:0 2px;padding:10px 12px 10px 4px;touch-action:pan-y;transform:translateX(var(--sx,0px));transition:transform .2s ease}
.p.nolead>.swc{grid-template-columns:1fr;padding-left:12px}
/* swipe a tile to the left: Complete, Abandon (or Reopen) and Delete sit behind it */
.swa{position:absolute;right:0;top:0;bottom:0;display:flex;visibility:hidden;z-index:0}
.p.swiping>.swa,.p.sw-open>.swa{visibility:visible}
.p.swiping>.swc,.p.sw-open>.swc{background:var(--tile-open,var(--solid))}.p.swiping>.swc{transition:none}
.swb{width:76px;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:.74rem;font-weight:650;color:#fff;cursor:pointer}
.swb span{font-size:1.25rem;line-height:1}
.glist .gi{display:flex;align-items:center;gap:6px;padding:8px 10px;margin:4px 0;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
.swb.arc{background:#3b6fd4}.swb.ok{background:#1f9d63}.swb.warn{background:#d99a00}.swb.bad{background:#d64545}.swb.re{background:#64748b}
.p.done{--tile-open:color-mix(in srgb,#1f9d63 16%,var(--solid));background:color-mix(in srgb,#1f9d63 18%,var(--glass))}
.p.abn{--tile-open:color-mix(in srgb,#e0a100 18%,var(--solid));background:color-mix(in srgb,#e0a100 20%,var(--glass))}
.pb{display:grid;gap:7px;min-width:0}
.p .top{display:flex;gap:8px;align-items:center}
.p .nm{font-weight:650;flex:1;min-width:0;line-height:1.25}
.p .desc{color:var(--muted);font-size:.84rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .desc.open{-webkit-line-clamp:unset}
.p .meta{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--muted)}
.tbx{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.p.compact>.swc{display:flex;align-items:center;gap:6px;padding:0 8px 0 0}
.p.compact .nm{padding:12px 0}
.p.compact .chev{font-size:1.1rem;padding:10px 4px}
.chev{min-width:34px;min-height:34px}
.p.compact .nm{display:flex;gap:8px;align-items:center;min-width:0;flex:1}
.arrows.h{flex-direction:row;padding-left:8px}
.arrows.h button{width:34px;height:34px}
.p.prio .nm{display:flex;gap:8px;align-items:center;min-width:0}
.pn{color:var(--muted);font-size:.8rem;min-width:1.6em}
.p .nm[data-a=tog]{cursor:pointer}
.chev{background:none;border:0;color:var(--muted);font-size:.9rem;padding:0 4px;cursor:pointer;line-height:1}
.list{display:grid;gap:6px}
.p.row>.swc{padding:8px 12px 8px 4px}
.p.row .top{min-height:30px}
.arrows{display:flex;flex-direction:column;justify-content:center;gap:6px}
.arrows button{padding:0;width:34px;height:38px;line-height:1;font-size:.8rem}
.seg{display:flex;gap:4px}
.seg button{flex:1 1 auto;padding:6px 4px;font-size:.78rem;min-width:0;white-space:nowrap}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .sp{flex:1}
.btn.tiny{padding:5px 10px;font-size:.8rem;min-height:30px}
.chip.auto{background:var(--accent);color:var(--accent-t)}
.chip.note{background:var(--glass);border:1px solid var(--glass-line);color:var(--text)}
.nlist{display:grid;gap:8px;margin:8px 0}
.nrow{border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:8px 10px;display:grid;gap:6px}
.nrow.review{border-color:var(--warn)}
.nrow .t{white-space:pre-wrap;word-break:break-word}
.nrow .m{font-size:.76rem;color:var(--muted)}
.sheet{display:grid;gap:8px;margin-top:10px}
.sheet .btn{width:100%;justify-content:center}
.chat{display:grid;gap:8px;max-height:46vh;overflow:auto;margin:8px 0;padding:2px}
.bub{padding:8px 11px;border-radius:14px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:.9rem;line-height:1.4}
.bub.me{justify-self:end;background:var(--accent);color:var(--accent-t)}
.bub.ai{justify-self:start;border:1px solid var(--glass-line);background:var(--glass)}
.bub.sys{justify-self:center;font-size:.78rem;color:var(--muted);background:none}
.prop{border:1px dashed var(--accent);border-radius:12px;padding:8px 10px;margin:6px 0;display:grid;gap:6px;font-size:.86rem}
.sect{border-top:1px solid var(--glass-line);margin-top:12px;padding-top:6px}
dialog label.switch{display:flex;flex-direction:row;gap:10px;align-items:flex-start;margin:10px 0;color:inherit}
dialog label.switch input{margin-top:2px;flex:0 0 auto}
.banner{margin:0 0 10px;padding:10px 14px;border-radius:var(--r-sm);background:var(--glass-strong);border:1px solid var(--glass-line);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
dialog{border:1px solid var(--glass-line);border-radius:var(--r);background:var(--solid);color:var(--text);padding:18px;max-width:420px;width:calc(100% - 28px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,24,.45)}
dialog h2{margin:0 0 10px;font-size:1.1rem}
dialog label{display:grid;gap:4px;margin:8px 0;font-size:.85rem;color:var(--muted)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.qhead{padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}
.qlist{display:grid;gap:8px;margin-bottom:12px}
.qrow{padding:10px 12px;display:grid;gap:6px;border-left:4px solid var(--c)}
.qrow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .pn{min-width:1.2em;text-align:center;color:var(--muted);font-size:.8rem}
.qrow .nm{font-weight:600;cursor:pointer;min-width:0;flex:1 1 120px}
.qrow .meta{display:flex;gap:4px 6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.fab{position:fixed;right:max(16px,var(--safe-r));bottom:max(16px,var(--safe-b));z-index:5}
</style>

</head>
<body>
<header class="topbar">
  <button class="tb-btn" data-home aria-label="Home" title="Home" hidden><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
  <div class="brand"><span>Project Pilot</span></div>
  <span class="tb-gap"></span>

  <button class="tb-btn" id="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
</header>
<div class="wrap">
  <div class="stick" id="stick">
    <div class="pick"><select id="lists" aria-label="List"></select></div>
    <div class="st" id="tabs"></div>
  </div>
  <div id="banner"></div>
  <div id="main"><p class="empty">Loading…</p></div>
</div>
<button class="btn primary fab" id="add">+ Project</button>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var TOKEN = "gd.token", ST = { active: ["Active", "#2563eb"], maintenance: ["Queued", "#d97706"], hiatus: ["Hiatus", "#7c3aed"], closed: ["Closed", "#6b7280"] };
  var $ = function (s) { return document.querySelector(s); };
  var S = { lists: [], key: "", sha: "", list: null, worked: {}, readOnly: false, view: "all", collapsed: {}, layout: "grid", open: {}, user: null, busy: 0, lastOk: 0, err: "", auto: true, days: 3, owner: false, home: "", chat: "claude", tabs: ["all", "priority", "active", "maintenance", "hiatus", "complete", "abandoned", "archive", "bin", "schedule"] };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function tok() { try { return sessionStorage.getItem(TOKEN) || localStorage.getItem(TOKEN) || ""; } catch (e) { return ""; } }
  function api(path, method, body) {
    var h = { "content-type": "application/json" }; if (tok()) h["x-gd-token"] = tok();
    return fetch(path, { method: method || "GET", headers: h, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || "Something went wrong (" + r.status + ")"); e.status = r.status; e.code = j.code; throw e; } return j; });
    });
  }
  function toast(m) { var t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3500); }
  // Dates follow the account's regional format (DD/MM/YYYY unless the account says otherwise).
  function fmt(d) { if (!d) return ""; var p = String(d).slice(0, 10).split("-"); if (p.length < 3) return d; var us = S.user && /^M/i.test(String((S.user.prefs || {}).dateFormat || "")); return us ? p[1] + "/" + p[2] + "/" + p[0] : p[2] + "/" + p[1] + "/" + p[0]; }
  var today = function () { return new Date().toISOString().slice(0, 10); };
  var DAY = 864e5;
  function effective(p) {
    var w = S.worked[p.id] || "", last = [p.lastWorked, w].filter(Boolean).sort().pop() || "", now = Date.now();
    var recent = !!last && now - Date.parse(last + "T23:59:59Z") <= S.days * DAY, on = p.auto === "on" || (p.auto !== "off" && S.auto !== false);
    var later = !!p.statusAt && !!last && last > String(p.statusAt).slice(0, 10);
    var auto = on && recent && later && (p.status === "maintenance" || p.status === "hiatus");
    return { status: auto ? "active" : p.status, auto: auto, last: last };
  }
  // An abandoned project is reviewed every month (Keep or Delete); the bin never empties itself, you are asked to empty it every month.
  // A month after a project is finished it is reviewed: completed ones are offered the Archive, abandoned ones Keep / Archive / Delete. The bin never empties itself, you are asked monthly.
  var dueReview = function (p) { return p.state === "live" && p.status === "closed" && Date.now() - Date.parse(p.reviewedAt || p.closedAt) > 30 * DAY; };
  var dueOf = function (v) { return S.list.projects.filter(function (p) { return dueReview(p) && viewOf(p) === v; }).length; };
  var GROUPS = [["active", "Active"], ["maintenance", "Queued"], ["hiatus", "Hiatus"], ["complete", "Completed"], ["abandoned", "Abandoned"]];
  function groupList() { var o = (S.groups || []).filter(function (g) { return GROUPS.some(function (x) { return x[0] === g; }); }); GROUPS.forEach(function (x) { if (o.indexOf(x[0]) < 0) o.push(x[0]); }); return o.map(function (g) { return GROUPS.filter(function (x) { return x[0] === g; })[0]; }); }
  var daysIn = function (p) { return Math.max(0, Math.floor((Date.now() - Date.parse(p.binnedAt || new Date().toISOString())) / DAY)); };
  var binDue = function () { return S.list.projects.filter(function (p) { return p.state === "bin" && p.binnedAt && Date.now() - Date.parse(p.binnedAt) > 30 * DAY; }).length; };
  var CLR = { complete: "#1f9d63", abandoned: "#e0a100" };
  function viewOf(p) { return p.status === "closed" ? (p.closedAs === "abandoned" ? "abandoned" : "complete") : effective(p).status; }
  function look(p, s) {   // label, colour and tile class of a project
    if (p.status === "closed") { var ab = p.closedAs === "abandoned"; return { t: ab ? "Abandoned" : "Complete", c: ab ? CLR.abandoned : CLR.complete, cls: ab ? " abn" : " done" }; }
    return { t: ST[s][0], c: ST[s][1], cls: "" };
  }

  /* ---------- loading and live polling ---------- */
  function savePrefs() { clearTimeout(savePrefs.h); savePrefs.h = setTimeout(function () { api("api/prefs", "PUT", { list: S.key, view: S.view, auto: S.auto, days: S.days, chat: S.chat, layout: S.layout, tabs: S.tabs, tabsV: 2, groups: S.groups, collapsed: Object.keys(S.collapsed).filter(function (k) { return S.collapsed[k]; }) }).catch(function () {}); }, 600); }
  function loadLists(keep) {
    return api("api/lists").then(function (j) {
      S.lists = j.lists; S.owner = !!j.owner; var pr = (S.user.prefs || {})["project-tracker"] || {}; if (window.JZTheme && !S.themeSet) { S.themeSet = 1; var th = pr.theme || (S.user.prefs || {}).theme; if (th === "light" || th === "dark") JZTheme.set(th, true); }
      if (!S.key) { S.key = pr.list && j.lists.some(function (l) { return l.key === pr.list; }) ? pr.list : j.lists[0].key; if (pr.view) S.view = pr.view === "closed" ? "complete" : pr.view === "priority" ? "all" : pr.view; if (typeof pr.auto === "boolean") S.auto = pr.auto; if (pr.days >= 1 && pr.days <= 30) S.days = pr.days; if (pr.chat === "builtin") S.chat = "builtin"; if (pr.layout === "list") S.layout = "list"; if (Array.isArray(pr.groups)) S.groups = pr.groups; if (Array.isArray(pr.tabs)) { var tk = []; if (pr.tabsV !== 2) pr.tabs = pr.tabs.concat("schedule"); pr.tabs.forEach(function (x) { (x === "closed" ? ["complete", "abandoned"] : [x]).forEach(function (y) { if (tk.indexOf(y) < 0 && TABS.some(function (t) { return t[0] === y; })) tk.push(y); }); }); if (tk.length) S.tabs = tk; } (pr.collapsed || []).forEach(function (c) { S.collapsed[c] = true; }); }
      if (!j.lists.some(function (l) { return l.key === S.key; })) S.key = j.lists[0].key;
      $("#lists").innerHTML = j.lists.map(function (l) { return '<option value="' + esc(l.key) + '"' + (l.key === S.key ? " selected" : "") + ">" + esc(l.name) + " (" + l.count + ")" + (l.source === "shared" ? " · from " + esc(l.by || "someone") : "") + "</option>"; }).join("");
    });
  }
  function poll(force) {
    if (!S.key || S.busy || (document.hidden && !force)) return Promise.resolve();
    var key = S.key;
    return api("api/list/" + key + (!force && S.sha ? "?sha=" + encodeURIComponent(S.sha) : "")).then(function (j) {
      if (key !== S.key) return;
      S.lastOk = Date.now(); S.err = "";
      if (!j.unchanged) { S.sha = j.sha; S.list = j.list; S.worked = j.worked || {}; S.readOnly = !!j.readOnly; S.role = j.role || "owner"; S.shares = j.shares || []; S.by = j.by || ""; S.source = j.source || ""; render(); }
      status();
    }).catch(function (e) { S.err = e.message; if (e.status === 401) location.reload(); status(); });
  }
  function status() {
    $("#banner").innerHTML = S.err ? '<div class="banner">Can\'t sync right now: ' + esc(S.err) + '. Trying again…</div>' : S.readOnly && S.source === "shared" ? '<div class="banner">Shared with you' + (S.by ? " by <b>" + esc(S.by) + "</b>" : "") + " to view only. You can't change it.</div>" : S.readOnly && S.key === "appdev" ? '<div class="banner">This list is read-only until a GitHub token is added. Open <b>Settings</b> to add one.</div>' : "";
    if (S.list && !S.err) { var rc = dueOf("complete"), ra = dueOf("abandoned"), bd = binDue(), on = function (id) { return S.tabs.indexOf(id) >= 0; }, lk = function (id) { return on(id) ? ' <a href="#" data-go="' + id + '">open</a>' : ""; };
      if (rc || ra || bd) $("#banner").innerHTML += '<div class="banner">Monthly tidy-up: ' + [rc ? rc + " completed to move to the Archive" + lk("complete") : "", ra ? ra + " abandoned to review" + lk("abandoned") : "", bd ? bd + " in the bin to empty" + lk("bin") : ""].filter(Boolean).join(" · ") + "</div>"; }
  }
  function send(body) {
    S.busy++;
    return api("api/list/" + S.key + "/apply", "POST", body).then(function () { S.busy--; return poll(true); }).catch(function (e) { S.busy--; toast(e.message); return poll(true); });
  }
  var upsert = function (p, ch) { return send({ ops: { upsert: [Object.assign({}, p, ch)] } }); };

  /* ---------- Task schedule: projects queued for Claude's nightly run ---------- */
  var QS = { queued: ["Queued", "#d97706"], held: ["On hold", "#6b7280"], running: ["Running", "#2563eb"], done: ["Done", "#16a34a"], failed: ["Failed", "#dc2626"] };
  var Q = {
    active: function (p) { return !!p.queue && (p.queue.state === "queued" || p.queue.state === "held" || p.queue.state === "running"); },
    sched: function () { var c = (S.list && S.list.schedule) || {}, d = (c.days || []).filter(function (x) { return x >= 0 && x <= 6; }); return { days: d.length ? d : [1], time: /^\d\d:\d\d$/.test(c.time || "") ? c.time : "20:00", offsetMin: Number.isInteger(c.offsetMin) ? c.offsetMin : 120, lastRun: c.lastRun }; },
    DAYS: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
    when: function () { var sc = Q.sched(), n = sc.days.map(function (d) { return Q.DAYS[d]; }); return (sc.days.length === 7 ? "every day" : "every " + (n.length > 1 ? n.slice(0, -1).join(", ") + " and " + n[n.length - 1] : n[0])) + " at " + sc.time; },
    rows: function () {   // waiting in order (running first), then what finished in the last 14 days

    if (a === "tog" && p) { S.open[p.id] = !isOpen(p); return render(); }
    if (a === "empty") { var ids = S.list.projects.filter(function (x) { return x.state === "bin"; }).map(function (x) { return x.id; }); return dialog("<h2>Empty the bin?</h2><p class='small'>" + ids.length + " project(s) will be deleted for good.</p><div class='row'><button class='btn' data-close>Cancel</button><button class='btn danger' id='go'>Delete for good</button></div>", function (d) { d.querySelector("#go").onclick = function () { d.close(); send({ ops: { remove: ids } }); }; }); }
    if (!p) return;
    if (a === "up" || a === "down") { var sib = Array.prototype.map.call(card.parentNode.children, function (x) { return x.dataset.id; }), i = sib.indexOf(p.id), j = i + (a === "up" ? -1 : 1); if (j < 0 || j >= sib.length) return; var t = sib[i]; sib[i] = sib[j]; sib[j] = t; return applyOrder(sib); }
    if (a === "complete") return finish(p, "completed");
    if (a === "abandon") return finish(p, "abandoned");
    if (a === "reopen") { toast("Reopened"); return setStatus(p, "active"); }
    if (a === "del") { toast("Moved to the bin"); return upsert(p, { state: "bin" }); }
    if (a === "archive") { toast("Moved to Archive"); return upsert(p, { state: "archived" }); }
    if (a === "keep") { toast("Kept for another month"); return upsert(p, { reviewedAt: new Date().toISOString() }); }
    if (a === "status") return setStatus(p, b.dataset.s);
    if (a === "worked") return upsert(p, { lastWorked: today(), statusAt: "" });
    if (a === "remove") return p.state === "archived" ? upsert(p, { state: "bin" }) : removeDlg(p);
    if (a === "restore") return upsert(p, { state: "live" });
    if (a === "purge") return send({ ops: { remove: [p.id] } });
  };
  $("#tabs").onchange = function (ev) { if (ev.target.id === "tabsel") { S.view = ev.target.value; savePrefs(); render(); } };
  $("#tabs").onclick = function (ev) { var t = ev.target.closest("[data-tb]"); if (t) { if (t.dataset.tb === "layout") { S.layout = S.layout === "list" ? "grid" : "list"; S.open = {}; savePrefs(); return render(); } return setAll(!allOpen()); } var b = ev.target.closest("[data-v]"); if (b) { S.view = b.dataset.v; savePrefs(); render(); } };
  $("#add").onclick = function () { editDlg(null); };
  $("#settings").onclick = settingsDlg;
  // Press and hold a project (or right-click it) for Edit / Remove.
  // Drag by the ⋮⋮ handle (shared Glass template script draghandle.js): lists and grids, any direction.
  JZDrag.init($("#main"), { item: ".p", box: ".grid,.list", enabled: function () { return !S.readOnly; }, onStart: function () { holdStop(); }, onDrop: function (ids) { applyOrder(ids); } });
  var holdUntil = 0, holdT = 0, hx = 0, hy = 0;
  var holdStop = function () { clearTimeout(holdT); };
  $("#main").addEventListener("pointerdown", function (ev) {
    var tile = ev.target.closest(".p"); if (!tile || ev.target.closest("button") || S.readOnly || ev.button > 0) return;
    hx = ev.clientX; hy = ev.clientY; holdStop();
    holdT = setTimeout(function () { var p = byId(tile.dataset.id); if (p) { holdUntil = Date.now() + 700; sheetDlg(p); } }, 550);
  });
  $("#main").addEventListener("pointermove", function (ev) { if (Math.abs(ev.clientX - hx) > 8 || Math.abs(ev.clientY - hy) > 8) holdStop(); });
  ["pointerup", "pointercancel", "pointerleave", "scroll"].forEach(function (n) { $("#main").addEventListener(n, holdStop, true); });
  window.addEventListener("scroll", holdStop, { passive: true });
  $("#main").addEventListener("contextmenu", function (ev) { var tile = ev.target.closest(".p"); if (!tile) return; ev.preventDefault(); if (S.readOnly) return; var p = byId(tile.dataset.id); if (p) { holdStop(); holdUntil = Date.now() + 700; sheetDlg(p); } });
  // Swipe a tile to the left to reveal Complete / Abandon / Delete (Reopen for finished tiles). Vertical movement still scrolls the page.
  var sw = null, openSw = null, swipeUntil = 0;
  $("#banner").onclick = function (ev) { var go = ev.target.closest("[data-go]"); if (go) { ev.preventDefault(); S.view = go.dataset.go; savePrefs(); render(); } };
  function closeSw() { if (openSw) { openSw.classList.remove("sw-open"); openSw.style.removeProperty("--sx"); openSw = null; } }
  $("#main").addEventListener("pointerdown", function (ev) {
    var t = ev.target.closest(".p"); if (openSw && t !== openSw) closeSw();
    if (!t || S.readOnly || ev.button > 0 || ev.target.closest("button,.jz-handle,select,textarea,input,a")) return;
    var sa = t.querySelector(".swa"); if (!sa || !sa.children.length) return;
    sw = { t: t, w: sa.offsetWidth || 228, x0: ev.clientX, y0: ev.clientY, base: t === openSw ? -(sa.offsetWidth || 228) : 0, on: false, x: 0 };
  });
  $("#main").addEventListener("pointermove", function (ev) {
    if (!sw) return; var dx = ev.clientX - sw.x0, dy = ev.clientY - sw.y0;
    if (!sw.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (Math.abs(dx) < 10) return;
      sw.on = true; sw.t.classList.add("swiping"); holdStop(); try { sw.t.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    sw.x = Math.max(-sw.w - 16, Math.min(0, sw.base + dx)); sw.t.style.setProperty("--sx", sw.x + "px");
  });
  function endSwipe(cancel) {
    if (!sw) return; var d = sw; sw = null; if (!d.on) return;
    d.t.classList.remove("swiping"); swipeUntil = Date.now() + 350;
    if (!cancel && d.x < -d.w / 2) { if (openSw && openSw !== d.t) closeSw(); d.t.classList.add("sw-open"); d.t.style.setProperty("--sx", -d.w + "px"); openSw = d.t; }
    else { d.t.classList.remove("sw-open"); d.t.style.removeProperty("--sx"); if (openSw === d.t) openSw = null; }
  }
  ["pointerup"].forEach(function (n) { $("#main").addEventListener(n, function () { endSwipe(false); }); });
  $("#main").addEventListener("pointercancel", function () { endSwipe(true); });
  $("#lists").onchange = function () { S.key = this.value; S.sha = ""; S.list = null; $("#main").innerHTML = '<p class="empty">Loading…</p>'; savePrefs(); poll(true); };
  function newListDlg() {
    dialog("<h2>New list</h2><p class='muted small'>Kept privately on your account until you share it (Settings > Share this list).</p><form id='f'><label>Name<input name='name' required maxlength='80'></label><div class='row'><button type='button' class='btn' data-close>Cancel</button><button class='btn primary'>Create</button></div></form>", function (d) {
      d.querySelector("#f").onsubmit = function (ev) { ev.preventDefault(); api("api/lists", "POST", { name: ev.target.elements.name.value }).then(function (j) { d.close(); S.key = j.key; S.sha = ""; S.list = null; return loadLists().then(function () { return poll(true); }); }).catch(function (e) { toast(e.message); }); };
    });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(false); });
  setInterval(function () { poll(false); }, 4000); setInterval(status, 1000);

  fetch("api/app-config").then(function (r) { return r.json(); }).then(function (c) { if (c && c.portalUrl) { S.home = c.portalUrl; } }).catch(function () {});
  window.addEventListener("jz-theme", function (e) { api("api/prefs", "PUT", { theme: e.detail }).catch(function () {}); });   // the theme follows the person's account
  var QA = JZQuick({ app: "project-tracker", name: "Project Pilot", request: function (m, p, b) { return api(p, m, b); } });
  api("api/account/me").then(function (j) { S.user = j.user; return loadLists(); }).then(function () { return poll(true); }).then(function () { QA.offer(); }).catch(function (e) { if (e.status === 401 || e.status === 403) location.reload(); else { $("#main").innerHTML = '<p class="empty">' + esc(e.message) + "</p>"; } });
})();
</script>
