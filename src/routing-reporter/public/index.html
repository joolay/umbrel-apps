<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ports">
<title>Port Master</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="jz.js" data-claude></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="tb-btn" data-home hidden aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Port Master</span></div>
  <span class="tb-gap"></span>
  <button class="tb-btn" data-pwa-install hidden aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 17v2.5h14V17"/></svg></button>
  <button class="tb-btn" data-settings aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
</header>
<nav class="menubar" role="tablist" aria-label="Sections">
  <button type="button" class="mb-btn" role="tab" data-tab="all" aria-selected="true">All</button>
  <button type="button" class="mb-btn" role="tab" data-tab="joolz" aria-selected="false">JoolzApp</button>
  <button type="button" class="mb-btn" role="tab" data-tab="other" aria-selected="false">Other</button>
  <button type="button" class="mb-btn" role="tab" data-tab="down" aria-selected="false">Down</button>
</nav>
<div class="toolbar" role="toolbar" aria-label="Tools">
  <button type="button" class="mb-btn mb-select" data-menu="sort" aria-haspopup="listbox" aria-expanded="false"><span class="mb-label" id="sortlabel">Sort: Name</span></button>
  <span class="tool-gap"></span>
  <button type="button" class="tool" id="check" aria-label="Check now" title="Check now"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  <div class="mb-menu" data-menu-for="sort" role="listbox" hidden>
    <button type="button" class="mb-item" role="option" data-sort="name" aria-selected="true">Name</button>
    <button type="button" class="mb-item" role="option" data-sort="port" aria-selected="false">Port</button>
  </div>
</div>
<main>
  <section id="sum" class="card sum"></section>
  <section id="clash"></section>
  <div id="warn" class="card warn" hidden></div>
  <section id="list"></section>
  <p class="foot muted small">Checked from inside your Umbrel, so Public means the Funnel address answers from here. A break outside your network is not visible from the server.</p>
</main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
