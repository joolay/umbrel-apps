<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrubToGo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#241c15;--mute:#7a6d60;--line:#eadfd2;--accent:#d9480f;--accent2:#fff1e8;--ok:#2b8a3e;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#17130f;--card:#241e18;--ink:#f4ece3;--mute:#a69888;--line:#3a3128;--accent:#ff8a4c;--accent2:#33231a;--ok:#2f9e44}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:19px;border:1px solid var(--line);flex:none}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:block;text-align:center;border:0;background:var(--accent);color:#fff;font:600 16px system-ui;padding:13px 18px;border-radius:14px;width:100%}
.btn.sec{background:var(--accent2);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.mute{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--accent2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px system-ui;padding:9px 4px;border-radius:10px}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px #0002}
input[type=text],input[type=password],select,input[type=url],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:16px system-ui}
textarea{min-height:90px;resize:vertical}
label.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:28px 12px;text-align:center;color:var(--mute)}
label.drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.cat{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;font-weight:700}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0;font-size:16px}
.item p{margin:2px 0 0;font-size:13.5px;color:var(--mute)}
.price{font-weight:700;white-space:nowrap}
.step{display:flex;align-items:center;gap:2px;background:var(--accent2);border-radius:12px}
.step button{border:0;background:transparent;color:var(--accent);font:700 20px system-ui;width:38px;height:38px}
.step span{min-width:22px;text-align:center;font-weight:700}
.add{border:0;background:var(--accent2);color:var(--accent);font:700 14px system-ui;padding:9px 16px;border-radius:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.bar .inner{max-width:640px;margin:auto}
.badge{background:#fff3;border-radius:10px;padding:2px 9px;margin-right:8px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#e0313122;color:#c92a2a;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
@media (prefers-color-scheme:dark){.err{color:#ff8787}}
.call{display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;font:700 19px system-ui;padding:16px;border-radius:16px}
.call.sm{font-size:15px;padding:11px;border-radius:12px}
.sum-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sum-line:last-of-type{border-bottom:0}
.sum-line .q{font-weight:700;min-width:30px;color:var(--accent)}
.note{font-size:13.5px;color:var(--mute);font-style:italic}
.kv{display:flex;justify-content:space-between;padding:4px 0}
.kv.big{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.link{background:none;border:0;color:var(--accent);font:600 14px system-ui;padding:4px 0}
.search{margin-bottom:6px;position:sticky;top:var(--hh,60px);z-index:4;box-shadow:0 6px 0 var(--bg)}
.item[data-item]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pill.ed{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0 7px;font-size:11px;margin-left:4px;vertical-align:middle}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.modal label{display:block;margin-top:8px}
.pill.new{background:var(--accent);color:#fff;margin-left:4px;vertical-align:middle}
.pill{display:inline-block;background:var(--accent2);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 14px system-ui}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.h{font-weight:700;margin:0 0 8px}
.person{background:var(--accent2);border-radius:12px;padding:10px 12px;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:9;text-align:center;font-size:14px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 6px;font-weight:700}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="bar" class="bar" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- state & storage ---------- */
const KEY = 'takeout.v1';   // old local save: copied up to your account once, so menus from before sign-in carry over
let S = { restaurants: [], carts: {}, hidden: [], seen: null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}

let view = 'home';         // home | add | menu | summary | orders | history | spend | settings
let spendPeriod = 6, spendCur = '', scope = 'me';   // scope: me (personal orders) | family
let curId = null, addTab = 'photo', busy = null, error = '', query = '';
let sample = true, canImages = true;
let me = null, ai = { configured: true, isAdmin: false }, pushT = null;

async function api(path, opts) {
  opts = opts || {}; const h = { 'content-type': 'application/json' };
  try { const t = sessionStorage.getItem('gd.token') || localStorage.getItem('gd.token'); if (t) h['x-gd-token'] = t; } catch (e) {}
  const r = await fetch(path, { method: opts.method || 'GET', headers: h, body: opts.body, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || 'Something went wrong (' + r.status + ')'); e.status = r.status; throw e; }
  return j;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} clearTimeout(pushT); pushT = setTimeout(push, 800); }
async function push() {
  try { await api('api/state', { method: 'PUT', body: JSON.stringify({ carts: S.carts, hidden: S.hidden, seen: S.seen }) }); }
  catch (e) { if (e.status === 401 || e.status === 403) location.reload(); }
}
const myFamily = () => S.family && S.family.family;
async function loadFamily(withOrders) {
  try { S.family = await api('api/family'); } catch (e) { S.family = null; }
  if (myFamily() && withOrders !== false) { try { S.famOrders = (await api('api/family/orders')).orders || []; } catch (e) {} } else if (!myFamily()) S.famOrders = [];
}
async function famAct(body) { try { S.family = await api('api/family', { method: 'POST', body: JSON.stringify(body) }); if (!myFamily()) S.famOrders = []; else await loadFamily(); render(); } catch (err) { toast(err.message); } }
async function loadMenus() { S.restaurants = (await api('api/menus')).menus || []; }
(async () => {
  try { me = (await api('api/account/me')).user; } catch (e) {}
  try { ai = await api('api/ai/status'); } catch (e) {}
  // Menus now live in the shared archive on the server. Anything saved the old way (on this device, or in your account) is copied up once.
  let legacy = [], carts = Object.assign({}, S.carts || {}), hidden = Array.isArray(S.hidden) ? S.hidden : [], seen = Array.isArray(S.seen) ? S.seen : null;
  try { const { state } = await api('api/state'); if (state) { Object.assign(carts, state.carts || {}); if (Array.isArray(state.hidden)) hidden = state.hidden; if (Array.isArray(state.seen)) seen = state.seen; if (Array.isArray(state.restaurants)) legacy = state.restaurants; } } catch (e) {}
  let done = false; try { done = !!localStorage.getItem('grubtogo.migrated'); } catch (e) {}
  if (!done && !legacy.length) legacy = (S.restaurants || []).slice();
  S = { restaurants: [], carts, hidden, seen, history: [] };
  try { S.history = (await api('api/history')).orders || []; } catch (e) {}
  await loadFamily();
  let failed = 0;
  for (const r of legacy) {
    try { const m = (await api('api/menus', { method: 'POST', body: JSON.stringify(r) })).menu; if (S.carts[r.id]) { S.carts[m.id] = S.carts[r.id]; delete S.carts[r.id]; } }
    catch (e) { failed++; }
  }
  if (!failed) { try { localStorage.setItem('grubtogo.migrated', '1'); } catch (e) {} }
  if (legacy.length) push();
  try { await loadMenus(); } catch (e) { error = e.message; }
  // The first time on this account, everything already in the archive counts as seen; only menus added after that are NEW.
  if (!Array.isArray(S.seen) && !error) { S.seen = S.restaurants.map(r => r.id); push(); }
  render();
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rest = () => S.restaurants.find(r => r.id === curId);
// Default tip is a setting kept on this device only.
const SETKEY = 'grubtogo.settings';
const settings = () => { try { return JSON.parse(localStorage.getItem(SETKEY)) || {}; } catch (e) { return {}; } };
const defTip = () => { const t = settings().tip; return typeof t === 'number' && t >= 0 && t <= 100 ? t : 15; };
const setDefTip = t => { try { localStorage.setItem(SETKEY, JSON.stringify({ ...settings(), tip: t })); } catch (e) {} };
const tipOf = c => c.tip ?? defTip();
const D = c => { c.items ||= {}; c.instructions ||= ''; c.mode ||= 'none'; c.n ||= 2; c.people ||= ['Me', 'Person 2']; c.assign ||= {}; return c; };
const cartOf = id => D(S.carts[id] ||= {});
const cart = () => cartOf(curId);
const money = (r, n) => (r.currency || 'R') + (Math.round(n * 100) / 100).toFixed(2);
const itemsOf = r => r.categories.flatMap(c => c.items.map(i => ({ ...i, cat: c.name })));
function cartLines(r) {
  const c = S.carts[r.id]; if (!c || !c.items) return [];
  const all = itemsOf(r);
  return Object.entries(c.items).filter(([, v]) => v.qty > 0).map(([id, v]) => ({ item: all.find(i => i.id === id), ...v })).filter(l => l.item);
}
const cartCount = r => cartLines(r).reduce((a, l) => a + l.qty, 0);
const lineCost = l => (l.item.price || 0) * l.qty;
const hasPrices = r => cartLines(r).some(l => l.item.price != null);
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
// Every menu in the shared archive shows up for everyone (new ones with a NEW tag until opened), except those switched off in Settings.
const isShown = r => !(S.hidden || []).includes(r.id);
const isNew = r => Array.isArray(S.seen) && !S.seen.includes(r.id);
const markSeen = id => { if (Array.isArray(S.seen) && !S.seen.includes(id)) { S.seen.push(id); save(); } };
const visibleRests = () => S.restaurants.filter(isShown).sort((a, b) => (isNew(b) - isNew(a)) || a.name.localeCompare(b.name));
const activeRests = () => visibleRests().filter(r => cartCount(r) > 0);

function bill(r) {
  const c = cartOf(r.id), lines = cartLines(r), pct = tipOf(c) || 0;
  const sub = lines.reduce((a, l) => a + lineCost(l), 0), tip = sub * pct / 100, total = sub + tip;
  let people = null, unassigned = 0;
  if (c.mode === 'equal') people = Array.from({ length: c.n }, (_, i) => ({ name: 'Person ' + (i + 1), sub: sub / c.n, tip: tip / c.n, amt: total / c.n }));
  if (c.mode === 'items') {
    people = c.people.map(n => ({ name: n, sub: 0, tip: 0, amt: 0 }));
    lines.forEach(l => {
      const a = (c.assign[l.item.id] || []).filter(i => i < people.length);
      if (!a.length) unassigned += lineCost(l); else a.forEach(i => people[i].sub += lineCost(l) / a.length);
    });
    people.forEach(p => { p.tip = p.sub * pct / 100; p.amt = p.sub + p.tip; });
  }
  return { sub, tip, total, pct, people, unassigned };
}

/* ---------- navigation ---------- */
function go(v, id) { view = v; if (id !== undefined) curId = id; error = ''; query = ''; render(); window.scrollTo(0, 0); }
function keepScroll() { const y = scrollY; render(); scrollTo(0, y); }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

/* ---------- render ---------- */
function render() {
  const h = $('#hdr'), a = $('#app'), bar = $('#bar');
  setTimeout(() => document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'), 0);
  bar.hidden = true;
  const back = t => `<button class="icon-btn" data-a="${t}">‹</button>`;
  if (view === 'home') {
    h.innerHTML = `<h1>🍽️ GrubToGo</h1><button class="icon-btn" data-a="history" title="Previous orders and spending" aria-label="Previous orders and spending">🧾</button><button class="icon-btn" data-a="settings" title="Settings" aria-label="Settings">⚙️</button>${me ? `<button class="icon-btn" data-a="dashboard" title="Back to Dashboard" aria-label="Back to Dashboard">🏠</button>` : ''}${me ? `<button class="icon-btn" data-a="signout" title="Sign out ${esc(me.email)}">⎋</button>` : ''}`;
    a.innerHTML = homeHTML();
    const n = activeRests().length;
    if (n) { bar.hidden = false; bar.innerHTML = `<div class="inner"><button class="btn" data-a="orders">View all orders · ${n} restaurant${n > 1 ? 's' : ''}</button></div>`; }
  } else if (view === 'add') {
    h.innerHTML = back('home') + `<h1>Add a menu</h1>`; a.innerHTML = addHTML();
  } else if (view === 'menu') {
    const r = rest();
    h.innerHTML = back('home') + `<h1>${esc(r.name)}</h1>${r.canEdit ? `<button class="icon-btn" data-a="del" title="Remove">🗑</button>` : ''}`;
    a.innerHTML = menuHTML(r);
    const n = cartCount(r);
    if (n) { bar.hidden = false; bar.innerHTML = `<div class="inner"><button class="btn" data-a="summary"><span class="badge">${n}</span>View order${hasPrices(r) ? ' · ' + money(r, bill(r).sub) : ''}</button></div>`; }
  } else if (view === 'summary') {
    const r = rest();
    h.innerHTML = back('menu') + `<h1>${esc(r.name)} order</h1>`; a.innerHTML = summaryHTML(r);
  } else if (view === 'settings') {
    h.innerHTML = back('home') + `<h1>Settings</h1>`; a.innerHTML = settingsHTML();
  } else if (view === 'orders') {
    h.innerHTML = back('home') + `<h1>All orders</h1>`; a.innerHTML = ordersHTML();
  } else if (view === 'history') {
    h.innerHTML = back('home') + `<h1>Previous orders</h1>`; a.innerHTML = historyHTML();
  } else if (view === 'spend') {
    h.innerHTML = back('home') + `<h1>Spending</h1>`; a.innerHTML = spendHTML();
  }
}

function familyCardHTML() {
  const f = myFamily(), inv = (S.family && S.family.invites) || [];
  let out = `<div class="card"><div class="sub-h" style="margin-top:0">Family</div>`;
  out += inv.map(i => `<div class="card" style="background:var(--accent2)"><b>${esc(i.ownerName || 'Someone')}</b> invited you to the <b>${esc(i.name)}</b> family.<div class="row" style="gap:8px;margin-top:8px"><button class="btn" data-a="fam-yes" data-id="${i.id}">Join</button><button class="btn ghost" data-a="fam-no" data-id="${i.id}">Decline</button></div></div>`).join('');
  if (!S.family) return out + `<p class="mute">Couldn't load families right now.</p></div>`;
  if (!f) return out + `<p class="mute">Link up with other JoolzApp users so a joint order can be filed as a family expense. Personal orders stay private.</p>
    <form class="row" id="famnew" style="gap:6px"><input type="text" name="name" placeholder="Family name (e.g. The Joolays)" maxlength="60" required><button class="btn">Create</button></form></div>`;
  out += `<div class="h" style="margin:0 0 4px">${esc(f.name)}</div><p class="mute" style="margin-top:0">Orders you file as a family expense are visible to everyone below.</p>`
    + f.members.map(m => `<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><div>${esc(m.name)}${m.id === f.owner ? ' <span class="pill">creator</span>' : ''}${me && m.id === me.id ? ' <span class="mute">(you)</span>' : ''}</div>${f.isOwner && me && m.id !== me.id ? `<button class="link" data-a="fam-rm" data-id="${m.id}">Remove</button>` : ''}</div>`).join('')
    + f.invited.map(m => `<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><div class="mute">${esc(m.name)} · invited</div><button class="link" data-a="fam-rm" data-id="${m.id}">Cancel</button></div>`).join('');
  if (f.isOwner) out += `<form class="row" id="faminv" style="gap:6px;margin-top:10px"><input type="email" name="email" placeholder="Their JoolzApp email" required><button class="btn">Invite</button></form>`;
  return out + `<div style="margin-top:10px"><button class="link" data-a="fam-leave">Leave this family</button></div></div>`;
}
function settingsHTML() {
  const t = defTip(), chips = [0, 10, 12.5, 15, 18, 20].map(p => `<button class="chip ${t === p ? 'on' : ''}" data-a="dtip" data-v="${p}">${p}%</button>`).join('');
  return `<div class="card"><div class="sub-h" style="margin-top:0">Default tip</div>
    <p class="mute">Used for new orders on this device. You can still change the tip on any order.</p>
    <div class="chips">${chips}</div>
    <div class="row" style="margin-top:8px"><span class="mute">Custom %</span><input id="dtipc" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${t}" style="width:90px"></div></div>
    ${familyCardHTML()}
    <div class="card"><div class="sub-h" style="margin-top:0">Restaurants in my app</div>
      <p class="mute">Every menu anyone adds appears for you automatically, marked NEW until you open it. Untick the ones you don't want to see.</p>
      <div class="row" style="gap:8px;margin-bottom:8px"><button class="btn sec" data-a="rest-all">Select all</button><button class="btn sec" data-a="rest-none">Select none</button></div>
      <input class="search" id="q" type="text" placeholder="Search restaurants…" value="${esc(query)}">
      ${S.restaurants.filter(r => !query.trim() || r.name.toLowerCase().includes(query.trim().toLowerCase())).map(r => `<label class="row" style="gap:10px;padding:8px 0;border-top:1px solid #0001;cursor:pointer"><input type="checkbox" data-rest="${r.id}" ${isShown(r) ? 'checked' : ''} style="width:auto"><span class="grow"><b>${esc(r.name)}</b> ${isNew(r) ? '<span class="pill new">NEW</span>' : ''}<span class="mute" style="display:block;font-size:13px">${itemsOf(r).length} items${r.ownerName ? ' · by ' + esc(r.ownerName) : ''}</span></span></label>`).join('') || '<p class="mute">No menus in the archive yet.</p>'}
    </div>`;
}

function aiNote() {
  if (ai.configured) return ai.trial ? `<div class="card" style="font-size:14px">🎁 Free trial: ${Math.max(0, ai.trial.limit - ai.trial.used)} of ${ai.trial.limit} menu reads left. After that, add your own AI key in Portal Admin (My settings).</div>` : '';
  if (ai.trialOver) return `<div class="err">You've used your free menu reads. Add your own AI key in Portal Admin (My settings) to keep adding menus.</div>`;
  if (!ai.isAdmin) return `<div class="err">Menu reading isn't set up yet. Add your own AI key in Portal Admin (My settings), or ask the admin.</div>`;
  return `<div class="card"><div style="font-weight:700">Set up menu reading</div><p class="mute">Add an AI key so GrubToGo can read menus from photos, PDFs and links. Only admins see this.</p>
    <select id="ai-prov"><option value="anthropic">Anthropic (Claude)</option><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select><div style="height:8px"></div>
    <input id="ai-key" type="password" placeholder="API key" autocomplete="off"><div style="height:8px"></div>
    <input id="ai-model" type="text" placeholder="Model (optional)" autocomplete="off"><div style="height:8px"></div>
    <button class="btn" data-a="ai-save">Save key</button></div>`;
}
const phoneLine = r => (r.branches || []).length ? `${r.branches.length} branch${r.branches.length > 1 ? 'es' : ''}` : (r.phone ? esc(r.phone) : 'no phone yet');
function homeHTML() {
  const sq = query.trim().toLowerCase(), shown = visibleRests().filter(r => !sq || r.name.toLowerCase().includes(sq));
  const list = shown.map(r => `
    <div class="card row" data-a="open" data-id="${r.id}" style="cursor:pointer">
      <div class="grow"><div style="font-weight:700;font-size:17px">${esc(r.name)} ${isNew(r) ? '<span class="pill new">NEW</span>' : ''}</div>

  const empty = sq && !shown.length ? `<div class="card" style="text-align:center">No restaurant matches “${esc(query)}”.</div>` : '';
  return `${aiNote()}<input class="search" id="q" type="text" placeholder="Search restaurants…" value="${esc(query)}">${empty || list || `<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:42px">📋</div><h2 style="margin:6px 0">${S.restaurants.length ? 'No restaurants showing' : 'No menus yet'}</h2><p class="mute">${S.restaurants.length ? 'Every restaurant is switched off. Turn some back on in Settings, or add a new menu.' : 'Upload a photo, PDF or link of a restaurant menu. It joins the shared archive for everyone.'}</p></div>`}
    <button class="btn" data-a="add">＋ Add a menu</button><div style="height:8px"></div><button class="btn sec" data-a="settings">☰ Choose which restaurants show${S.restaurants.length > visibleRests().length ? ` · ${S.restaurants.length - visibleRests().length} hidden` : ''}</button><div style="height:8px"></div>

function addHTML() {
  const T = (k, l) => `<button class="${addTab === k ? 'on' : ''}" data-a="tab" data-k="${k}">${l}</button>`;
  let body = '';
  if (addTab === 'photo') body = `<label class="drop"><b>📷 Take or choose photos</b>Multiple pages are fine<input id="f-photo" type="file" accept="image/*" multiple hidden></label>`;
  if (addTab === 'pdf') body = `<label class="drop"><b>📄 Choose a PDF menu</b>Up to 6 pages are read<input id="f-pdf" type="file" accept="application/pdf" hidden></label>`;
  if (addTab === 'url') body = `<input id="f-url" type="url" placeholder="https://restaurant.com/menu" inputmode="url"><p class="mute">Not every site can be read. If this fails, screenshot the menu page or use the Paste tab.</p><button class="btn" data-a="go-url">Read menu</button>`;
  if (addTab === 'text') body = `<textarea id="f-text" placeholder="Paste the menu text here…" style="min-height:160px"></textarea><div style="height:10px"></div><button class="btn" data-a="go-text">Read menu</button>`;

}

  let out = (lastO && !cartCount(r) ? `<button class="btn sec" data-a="repeat" data-id="${lastO.id}">🔁 Repeat last order · ${esc(dOf(lastO).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }))}${lastO.total ? ' · ' + cm(lastO.currency, lastO.total) : ''}</button><div style="height:10px"></div>` : '') + `<div class="card"><div class="mute" style="margin-bottom:6px">Restaurant phone${r.ownerName ? ' · added by ' + esc(r.ownerName) : ''}${r.canEdit ? '' : ' · view only'}</div>

    <div class="mute" style="margin:10px 0 2px">Branches${r.canEdit ? '' : ' · anyone can add one'}</div>${branchRows}</div>
    <input class="search" id="q" type="text" placeholder="Search menu…" value="${esc(query)}">`;
  for (const cat of r.categories) {
    const items = cat.items.filter(i => !q || (i.name + ' ' + (i.description || '')).toLowerCase().includes(q));
    if (!items.length) continue;
    out += `<div class="cat">${esc(cat.name)}</div><div class="card" style="padding:2px 14px">` + items.map(i => {
      const qty = c.items[i.id]?.qty || 0;
      return `<div class="item" data-item="${esc(i.id)}"><div class="grow"><h3>${esc(i.name)}${i.edit ? ' <span class="pill ed" title="Edited by ' + esc(i.edit.byName) + '">✎ edited</span>' : ''}</h3>${i.description ? `<p>${esc(i.description)}</p>` : ''}${i.price != null ? `<div class="price" style="margin-top:4px">${money(r, i.price)}</div>` : ''}</div>
        ${qty ? `<div class="step"><button data-a="dec" data-id="${i.id}">−</button><span>${qty}</span><button data-a="inc" data-id="${i.id}">+</button></div>` : `<button class="add" data-a="inc" data-id="${i.id}">Add</button>`}</div>`;
    }).join('') + `</div>`;
  }
  out += `<p class="mute" style="text-align:center;margin:14px 0 4px">Hold an item to edit it. Anyone can fix a price or a name; your name is shown on the item.</p>
    <div class="card"><div class="mute">Version ${esc(fmtDate(r.version))}${r.versionByName ? ' · uploaded by ' + esc(r.versionByName) : ''}</div>
      <button class="link" data-a="versions" data-id="${r.id}">Previous versions</button><div id="vers"></div></div>`;
  return out;
}
const fmtDate = v => { const d = new Date(String(v || '').replace(' ', 'T')); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };

/* ----- per-restaurant summary + bill ----- */
// Franchises: which branch's number to call. Each person picks their own branch for an order (or types another number).
function contactOf(r) {
  const c = cartOf(r.id), bs = (r.branches || []).filter(b => b.phone);
  if (c.branch === 'custom') return { branch: c.customName || 'My branch', phone: c.customPhone || '' };
  const b = bs.find(x => x.name === c.branch);
  if (b) return { branch: b.name, phone: b.phone };
  if (r.phone) return { branch: '', phone: r.phone };
  return bs.length ? { branch: bs[0].name, phone: bs[0].phone } : { branch: '', phone: '' };
}
function branchPickerHTML(r) {
  const c = cartOf(r.id), bs = (r.branches || []).filter(b => b.phone), cur = contactOf(r);
  if (!bs.length && c.branch !== 'custom') return `<div style="text-align:center"><button class="link" data-a="branch-custom" data-id="${r.id}">Different branch? Use another number</button></div>`;
  const sel = c.branch === 'custom' ? 'custom' : cur.branch;
  const opts = (r.phone ? `<option value="" ${sel === '' ? 'selected' : ''}>Main number · ${esc(r.phone)}</option>` : '')
    + bs.map(b => `<option value="${esc(b.name)}" ${sel === b.name ? 'selected' : ''}>${esc(b.name || 'Branch')} · ${esc(b.phone)}</option>`).join('')
    + `<option value="custom" ${sel === 'custom' ? 'selected' : ''}>Another number…</option>`;
  return `<div class="card"><div class="mute" style="margin-bottom:6px">Which branch are you ordering from?</div><select id="branch">${opts}</select>
    ${c.branch === 'custom' ? `<div class="row" style="gap:8px;margin-top:8px"><input id="cname" type="text" placeholder="Branch name" value="${esc(c.customName || '')}"><input id="cphone" type="tel" placeholder="Phone number" value="${esc(c.customPhone || '')}"></div>` : ''}</div>`;
}
function callHTML(r, small) {
  const ct = contactOf(r);
  return ct.phone ? `<a class="call ${small ? 'sm' : ''}" href="${telHref(ct.phone)}">📞 Call ${esc(r.name)}${ct.branch ? ' (' + esc(ct.branch) + ')' : ''} · ${esc(ct.phone)}</a>${small ? '' : `<div class="row" style="justify-content:center;margin-top:6px"><button class="link" data-a="copy-phone" data-id="${r.id}">Copy number</button></div>`}`
    : `<div class="mute">No phone number saved – add one on the menu page.</div>`;
}

function summaryHTML(r) {
  const lines = cartLines(r), c = cart();
  if (!lines.length) return `<div class="card" style="text-align:center">Your order is empty.</div><button class="btn" data-a="menu">Back to menu</button>`;
  const rows = lines.map(l => `<div class="sum-line"><div class="q">${l.qty}×</div><div class="grow"><div>${esc(l.item.name)}</div>
      <textarea data-note="${l.item.id}" placeholder="Special instructions (e.g. no onions)" style="min-height:48px;margin-top:6px;font-size:14px">${esc(l.note || '')}</textarea></div>
      <div class="price">${l.item.price != null ? money(r, lineCost(l)) : ''}</div></div>`).join('');
  return `<div class="card"><div class="h">${esc(r.name)}</div>${rows}</div>
    <div class="card"><div class="mute" style="margin-bottom:6px">Notes for the whole order</div>
      <textarea id="gen" placeholder="Allergies, collection time, name for the order…">${esc(c.instructions)}</textarea></div>
    ${branchPickerHTML(r)}
    ${callHTML(r)}
    <div style="height:14px"></div>
    ${hasPrices(r) ? billCardHTML(r) : ''}
    <button class="btn" data-a="placed" data-id="${r.id}">✅ Mark as ordered</button>
    <div style="height:8px"></div><button class="btn sec" data-a="copy-order" data-id="${r.id}">📋 Copy this order</button>
    <div style="height:8px"></div><button class="btn ghost" data-a="clear">Clear this order</button>`;
}

function billCardHTML(r) {
  const c = cart();
  const tipChips = [0, 10, 12.5, 15, 18, 20].map(p => `<button class="chip ${tipOf(c) === p ? 'on' : ''}" data-a="tip" data-v="${p}">${p}%</button>`).join('');
  const modes = [['none', 'No split'], ['equal', 'Equally'], ['items', 'By items']].map(([k, l]) => `<button class="${c.mode === k ? 'on' : ''}" data-a="mode" data-v="${k}">${l}</button>`).join('');
  let splitCfg = '';
  if (c.mode === 'equal') splitCfg = `<div class="row" style="justify-content:space-between"><div>Number of people</div><div class="step"><button data-a="n-" >−</button><span>${c.n}</span><button data-a="n+">+</button></div></div>`;
  if (c.mode === 'items') {
    const lines = cartLines(r);
    splitCfg = `<div class="sub-h">People</div>` + c.people.map((n, i) => `<div class="row" style="margin-bottom:6px"><input type="text" data-pname="${i}" value="${esc(n)}" class="grow">${c.people.length > 2 ? `<button class="icon-btn" data-a="rm-person" data-i="${i}">×</button>` : ''}</div>`).join('')
      + `<button class="link" data-a="add-person">＋ Add person</button>
      <div class="sub-h">Who had what? (tap to share a dish)</div>` +
      lines.filter(l => l.item.price != null).map(l => {
        const a = c.assign[l.item.id] || [];
        return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><div>${l.qty}× ${esc(l.item.name)}</div><div class="price">${money(r, lineCost(l))}</div></div>
          <div class="chips" style="margin-top:6px">${c.people.map((n, i) => `<button class="chip ${a.includes(i) ? 'on' : ''}" data-a="assign" data-id="${l.item.id}" data-i="${i}">${esc(n || 'Person ' + (i + 1))}</button>`).join('')}</div></div>`;
      }).join('') + `<div class="mute">Dishes with several people are split evenly between them.</div>`;
  }
  return `<div class="card"><div class="h">Bill</div>
    <div class="sub-h" style="margin-top:0">Tip</div>
    <div class="chips">${tipChips}</div>
    <div class="row" style="margin-top:8px"><span class="mute">Custom %</span><input id="tipc" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${tipOf(c)}" style="width:100px"></div>
    <div id="bn">${billNumsHTML(r)}</div></div>
    <div class="card"><div class="h">Split the bill</div><div class="tabs">${modes}</div>${splitCfg}<div id="sp">${splitHTML(r)}</div></div>`;
}
function billNumsHTML(r) {
  const b = bill(r);
  return `<div style="margin-top:10px"><div class="kv"><span>Subtotal</span><span>${money(r, b.sub)}</span></div>
    <div class="kv"><span>Tip (${b.pct}%)</span><span>${money(r, b.tip)}</span></div>
    <div class="kv big"><span>Total</span><span>${money(r, b.total)}</span></div></div>`;
}
function splitHTML(r) {
  const c = cartOf(r.id), b = bill(r);
  if (c.mode === 'none') return '';
  if (c.mode === 'equal') return `<div class="person" style="margin-top:12px;text-align:center"><div class="mute">Each of ${c.n} people pays</div><div style="font-size:26px;font-weight:800">${money(r, b.people[0].amt)}</div></div>`;
  return `<div class="sub-h">Each person pays</div>` + b.people.map(p => `<div class="person row" style="justify-content:space-between"><div><b>${esc(p.name || 'Person')}</b><div class="mute">${money(r, p.sub)} + ${money(r, p.tip)} tip</div></div><div style="font-size:19px;font-weight:800">${money(r, p.amt)}</div></div>`).join('')
    + (b.unassigned > 0.004 ? `<div class="err">${money(r, b.unassigned)} of food isn't assigned to anyone yet.</div>` : '');
}

/* ----- all orders (multiple restaurants) ----- */
/* ---------- previous orders, spending ---------- */
const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
const cm = (cur, n) => (cur || 'R') + (Math.round(n * 100) / 100).toFixed(2);
const dOf = o => new Date(o.at);
const dayFmt = o => dOf(o).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + dOf(o).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const monthLbl = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString(undefined, { month: 'short' }) + ' ' + String(y).slice(2); };
const restOfOrder = o => S.restaurants.find(x => x.id === o.restId) || S.restaurants.find(x => normName(x.name) === normName(o.restName));
const scopeOrders = () => scope === 'family' && myFamily() ? (S.famOrders || []) : (S.history || []);
const scopeChips = () => myFamily() ? `<div class="chips" style="margin-bottom:10px"><button class="chip ${scope === 'me' ? 'on' : ''}" data-a="scope" data-v="me">Personal</button><button class="chip ${scope === 'family' ? 'on' : ''}" data-a="scope" data-v="family">👨‍👩‍👧 ${esc(myFamily().name)}</button></div>` : '';
const histTabs = on => `<div class="tabs"><button class="${on === 'history' ? 'on' : ''}" data-a="history">Orders</button><button class="${on === 'spend' ? 'on' : ''}" data-a="spend">Spending</button></div>`;

function snapshotOf(r) {
  const b = bill(r), c = cartOf(r.id), ct = contactOf(r);
  return { restId: r.id, restName: r.name, branch: ct.branch || '', phone: ct.phone || '', currency: r.currency || 'R', instructions: c.instructions || '',
    lines: cartLines(r).map(l => ({ itemId: l.item.id, name: l.item.name, qty: l.qty, price: l.item.price == null ? null : l.item.price, note: l.note || '' })),
    sub: b.sub, tip: b.tip, pct: b.pct, total: b.total };
}
async function markOrdered(r, as) {
  if (!cartCount(r)) return;
  if (as === 'family') {
    const res = await api('api/family/orders', { method: 'POST', body: JSON.stringify({ order: snapshotOf(r) }) });
    (S.famOrders ||= []).unshift(res.order); scope = 'family'; toast('Saved as a family expense');
  } else {
    const res = await api('api/history', { method: 'POST', body: JSON.stringify({ order: snapshotOf(r) }) });
    (S.history ||= []).unshift(res.order); scope = 'me'; toast('Saved to your previous orders');
  }
  S.carts[r.id] = {}; save(); go('history');
}
function askPlaced(r) {
  if (!cartCount(r)) return;
  const f = myFamily(), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h2 style="margin:0 0 8px">Who is this order for?</h2>
    <button class="btn" data-x="me">👤 Personal order<br><small>Only you can see it</small></button><div style="height:8px"></div>
    ${f ? `<button class="btn sec" data-x="family">👨‍👩‍👧 Family expense · ${esc(f.name)}<br><small>Everyone in the family can see it and it counts in the family spending</small></button>`
        : `<p class="mute">Want to share it as a family expense? Create or join a family in Settings first.</p><button class="btn sec" data-x="settings">Open Settings</button>`}
    <div style="height:8px"></div><button class="btn ghost" data-x="cancel">Cancel</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', async ev => {
    const x = ev.target === m ? 'cancel' : ev.target.closest('[data-x]') && ev.target.closest('[data-x]').dataset.x; if (!x) return;
    m.remove(); if (x === 'cancel') return; if (x === 'settings') return go('settings');
    try { await markOrdered(r, x); } catch (err) { toast(err.message); }
  });
}
function repeatOrder(o) {
  const r = restOfOrder(o); if (!r) return toast('That restaurant is no longer in the shared archive.');
  const all = itemsOf(r), items = {}, missing = [];
  o.lines.forEach(l => { const it = all.find(i => i.id === l.itemId) || all.find(i => normName(i.name) === normName(l.name)); if (!it) missing.push(l.name); else items[it.id] = { qty: l.qty, note: l.note || '' }; });
  if (!Object.keys(items).length) return toast('None of those dishes are on the menu any more.');
  if (cartCount(r) && !confirm('Replace your current ' + r.name + ' order with this one?')) return;
  S.carts[r.id] = D({ items, instructions: o.instructions || '' }); S.hidden = (S.hidden || []).filter(x => x !== r.id); save();
  go('summary', r.id);
  if (missing.length) toast('Not on the menu any more: ' + missing.join(', '));
}
function historyHTML() {
  const fam = scope === 'family' && myFamily(), hs = scopeOrders().slice().sort((a, b) => b.at.localeCompare(a.at)), sq = query.trim().toLowerCase();
  const list = hs.filter(o => !sq || o.restName.toLowerCase().includes(sq) || o.lines.some(l => l.name.toLowerCase().includes(sq)));
  let out = histTabs('history') + scopeChips() + `<input class="search" id="q" type="text" placeholder="Search restaurants or dishes…" value="${esc(query)}">`;
  if (!hs.length) return out + `<div class="card" style="text-align:center">${fam ? 'No family orders yet. Choose <b>Family expense</b> when you mark an order as ordered.<br><br>' : ''}No previous orders yet. When you've phoned an order in, tap <b>Mark as ordered</b> on its summary and it is saved here with the date.</div>`;
  if (!list.length) return out + `<div class="card" style="text-align:center">Nothing matches “${esc(query)}”.</div>`;
  let last = '';
  list.forEach(o => {
    const k = monthKey(dOf(o));
    if (k !== last) { last = k; out += `<div class="sub-h">${esc(dOf(o).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</div>`; }
    out += `<div class="card"><div class="row" style="justify-content:space-between;gap:8px"><div class="h" style="margin:0">${esc(o.restName)}${o.branch ? ' <span class="mute">(' + esc(o.branch) + ')</span>' : ''}</div><div class="price">${o.total ? cm(o.currency, o.total) : ''}</div></div>
      <div class="mute" style="margin-bottom:6px">${esc(dayFmt(o))}${fam ? ' · by ' + esc(o.byName || 'someone') : ''}</div>
      ${o.lines.map(l => `<div class="sum-line"><div class="q">${l.qty}×</div><div class="grow">${esc(l.name)}${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</div></div>`).join('')}
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn sec" data-a="repeat" data-id="${o.id}">🔁 Repeat this order</button>${!fam || (me && (o.byId === me.id || myFamily().isOwner)) ? `<button class="icon-btn" data-a="del-order" data-id="${o.id}" title="Delete from history">🗑</button>` : ''}</div></div>`;
  });
  return out;
}
function spendHTML() {
  const all = scopeOrders().filter(o => o.total > 0), famView = scope === 'family' && myFamily();
  let out = histTabs('spend') + scopeChips();
  if (!all.length) return out + `<div class="card" style="text-align:center">Spending appears here once you've marked priced orders as ordered${scope === 'family' ? ' as a family expense' : ''}.</div>`;
  const curs = [...new Set(all.map(o => o.currency))];
  if (!curs.includes(spendCur)) spendCur = curs.sort((a, b) => all.filter(o => o.currency === b).length - all.filter(o => o.currency === a).length)[0];
  const now = new Date(), cut = spendPeriod ? new Date(now.getFullYear(), now.getMonth() - spendPeriod + 1, 1) : null;
  const os = all.filter(o => o.currency === spendCur && (!cut || dOf(o) >= cut));
  const chips = [[3, '3 months'], [6, '6 months'], [12, '12 months'], [0, 'Lifetime']].map(([n, l]) => `<button class="chip ${spendPeriod === n ? 'on' : ''}" data-a="period" data-v="${n}">${l}</button>`).join('');
  out += `<div class="chips" style="margin-bottom:10px">${chips}</div>` + (curs.length > 1 ? `<div class="chips" style="margin-bottom:10px">${curs.map(c => `<button class="chip ${spendCur === c ? 'on' : ''}" data-a="cur" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : '');
  if (!os.length) return out + `<div class="card" style="text-align:center">No orders in this period.</div>`;
  const total = os.reduce((a, o) => a + o.total, 0), first = os.reduce((m, o) => dOf(o) < m ? dOf(o) : m, new Date());
  const months = Math.max(1, spendPeriod || ((now.getFullYear() - first.getFullYear()) * 12 + now.getMonth() - first.getMonth() + 1));
  // monthly buckets (yearly when lifetime runs past two years)
  const byYear = !spendPeriod && months > 24, buckets = new Map();
  for (let n = months - 1; n >= 0; n--) { const d = new Date(now.getFullYear(), now.getMonth() - n, 1); buckets.set(byYear ? String(d.getFullYear()) : monthKey(d), 0); }
  os.forEach(o => { const k = byYear ? String(dOf(o).getFullYear()) : monthKey(dOf(o)); buckets.set(k, (buckets.get(k) || 0) + o.total); });
  const data = [...buckets.entries()], max = Math.max(...data.map(d => d[1]), 1), W = 320, H = 150, bw = W / data.length;
  const bars = data.map(([k, v], ix) => { const bh = Math.round(v / max * (H - 34)); return `<g><rect x="${(ix * bw + bw * .15).toFixed(1)}" y="${H - 18 - bh}" width="${(bw * .7).toFixed(1)}" height="${bh}" rx="3" fill="var(--accent)"><title>${esc(byYear ? k : monthLbl(k))}: ${cm(spendCur, v)}</title></rect>`
    + (data.length <= 13 || ix % Math.ceil(data.length / 12) === 0 ? `<text x="${(ix * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".65">${esc(byYear ? k : monthLbl(k).split(' ')[0])}</text>` : '')
    + (v && data.length <= 13 ? `<text x="${(ix * bw + bw / 2).toFixed(1)}" y="${H - 21 - bh}" text-anchor="middle" font-size="8" fill="currentColor" opacity=".8">${Math.round(v)}</text>` : '') + `</g>`; }).join('');
  out += `<div class="card"><div class="row" style="justify-content:space-around;text-align:center">
      <div><div class="mute">Spent</div><div class="h" style="margin:0">${cm(spendCur, total)}</div></div>
      <div><div class="mute">Orders</div><div class="h" style="margin:0">${os.length}</div></div>
      <div><div class="mute">Avg / order</div><div class="h" style="margin:0">${cm(spendCur, total / os.length)}</div></div>
      <div><div class="mute">Avg / ${byYear ? 'year' : 'month'}</div><div class="h" style="margin:0">${cm(spendCur, total / data.length)}</div></div></div></div>
    <div class="card"><div class="h">${byYear ? 'Yearly' : 'Monthly'} expenditure</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${byYear ? 'Yearly' : 'Monthly'} spending">${bars}</svg></div>`;
  const by = new Map();
  os.forEach(o => { const k = normName(o.restName), e = by.get(k) || { name: o.restName, spent: 0, n: 0 }; e.spent += o.total; e.n++; e.name = o.restName; by.set(k, e); });
  const rows = [...by.values()].sort((a, b) => b.spent - a.spent), top = rows[0].spent;
  if (famView) {
    const who = new Map(); os.forEach(o => { const e = who.get(o.byId) || { name: o.byName || 'Someone', spent: 0, n: 0 }; e.spent += o.total; e.n++; who.set(o.byId, e); });
    const wr = [...who.values()].sort((a, b) => b.spent - a.spent);
    out += `<div class="card"><div class="h">Who placed the orders</div>` + wr.map(e => `<div class="kv"><span>${esc(e.name)} · ${e.n} order${e.n > 1 ? 's' : ''}</span><span>${cm(spendCur, e.spent)}</span></div>`).join('') + `</div>`;
  }
  out += `<div class="card"><div class="h">Where you order from</div>` + rows.map(e => `<div style="margin:10px 0"><div class="row" style="justify-content:space-between;gap:8px"><div>${esc(e.name)}</div><div class="price">${cm(spendCur, e.spent)}</div></div>
      <div style="background:var(--line);border-radius:99px;height:8px;margin:4px 0"><div style="width:${Math.max(2, Math.round(e.spent / top * 100))}%;height:8px;border-radius:99px;background:var(--accent)"></div></div>
      <div class="mute">${e.n} order${e.n > 1 ? 's' : ''} · ${Math.round(e.spent / total * 100)}% of spend · avg ${cm(spendCur, e.spent / e.n)}</div></div>`).join('') + `</div>`;
  return out;
}

function ordersHTML() {
  const rs = activeRests();
  if (!rs.length) return `<div class="card" style="text-align:center">No items in any order yet.</div><button class="btn" data-a="home">Pick a restaurant</button>`;
  const cur = new Set(rs.map(r => r.currency)); let grand = 0;
  const blocks = rs.map(r => {
    const b = bill(r); grand += b.total;
    const lines = cartLines(r).map(l => `<div class="sum-line"><div class="q">${l.qty}×</div><div class="grow">${esc(l.item.name)}${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</div><div class="price">${l.item.price != null ? money(r, lineCost(l)) : ''}</div></div>`).join('');
    const c = cartOf(r.id);
    return `<div class="card"><div class="h">${esc(r.name)}</div>${lines}
      ${c.instructions ? `<div class="note" style="margin-top:6px">Notes: ${esc(c.instructions)}</div>` : ''}
      ${hasPrices(r) ? `<div class="kv"><span>Subtotal</span><span>${money(r, b.sub)}</span></div><div class="kv"><span>Tip (${b.pct}%)</span><span>${money(r, b.tip)}</span></div><div class="kv big"><span>Total</span><span>${money(r, b.total)}</span></div>` : ''}
      <div style="height:10px"></div>${callHTML(r, true)}
      <div style="height:8px"></div><div class="row" style="gap:8px"><button class="btn sec" data-a="open-sum" data-id="${r.id}">Tip & split bill</button><button class="btn sec" data-a="copy-order" data-id="${r.id}">📋 Copy order</button></div>
      <div style="height:8px"></div><button class="btn" data-a="placed" data-id="${r.id}">✅ Mark as ordered</button></div>`;
  }).join('');
  return blocks + (cur.size === 1 ? `<div class="card"><div class="kv big" style="border:0;margin:0;padding:0"><span>Grand total (${rs.length} restaurants)</span><span>${money(rs[0], grand)}</span></div></div>` : '')
    + `<button class="btn" data-a="copy-all">📋 Copy whole basket</button>`;
}

// Every restaurant's order in one text, with a grand total when they all use the same currency.
function allOrdersText() {
  const rs = activeRests(); let t = rs.map(orderText).join('\n\n──────────\n\n');
  if (rs.length > 1 && new Set(rs.map(r => r.currency)).size === 1 && rs.every(hasPrices)) t += `\n\n══════════\nGrand total (${rs.length} restaurants): ${money(rs[0], rs.reduce((a, r) => a + bill(r).total, 0))}`;
  return t;
}
function orderText(r) {
  const c = cartOf(r.id), b = bill(r);
  const ct = contactOf(r);
  let t = `Order for ${r.name}${ct.branch ? ' (' + ct.branch + ')' : ''}${ct.phone ? ' · ' + ct.phone : ''}\n\n` + cartLines(r).map(l => `${l.qty}× ${l.item.name}` + (l.note ? `\n   – ${l.note}` : '')).join('\n');
  if (c.instructions) t += `\n\nNotes: ${c.instructions}`;
  if (hasPrices(r)) {
    t += `\n\nSubtotal: ${money(r, b.sub)}\nTip (${b.pct}%): ${money(r, b.tip)}\nTotal: ${money(r, b.total)}`;
    if (b.people && c.mode === 'equal') t += `\nSplit ${c.n} ways: ${money(r, b.people[0].amt)} each`;
    if (b.people && c.mode === 'items') t += `\n\nSplit:\n` + b.people.map(p => `${p.name}: ${money(r, p.amt)}`).join('\n');
  }
  return t;
}

/* ---------- menu extraction ---------- */
const PROMPT = `You extract restaurant menus into JSON. Reply with ONLY one JSON object, no prose, no code fences:
{"name": string, "phone": string|null, "currency": string, "categories": [{"name": string, "items": [{"name": string, "description": string, "price": number|null}]}]}
Rules: include every dish and drink actually on the menu; never invent items or prices. "phone" is the restaurant's telephone number exactly as printed anywhere in the source, else null. "currency" is the symbol used for prices (e.g. "R", "$", "€"; default "R" if unclear). "price" is a plain number without symbol (use the base price if sizes vary). Keep the menu's own language. If the source contains no readable menu, reply {"error":"reason"}.`;

async function ingest(src) {
  error = '';
  try {
    let body;
    if (src.images || src.pdf) {
      busy = src.pdf ? 'Reading PDF…' : 'Preparing photos…'; render();
      let imgs = [], text = '';
      if (src.pdf) { const r = await readPdf(src.pdf); imgs = r.images; text = r.text; }
      else imgs = await Promise.all(src.images.map(shrink));
      body = text.length > 300 ? { text } : { images: await Promise.all(imgs.map(b64)) };
    } else if (src.url) body = { url: src.url };
    else body = { text: src.text };

    busy = 'Reading the menu…'; render();
    const j = (await api('api/extract', { method: 'POST', body: JSON.stringify(body) })).menu;

const b64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res({ type: 'image/jpeg', data: String(f.result).split(',')[1] }); f.onerror = rej; f.readAsDataURL(blob); });
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF reader.')); document.head.appendChild(s); }); }
async function readPdf(file) {

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;

  if (text.length <= 300) {
    for (let p = 1; p <= pages; p++) {
      const pg = await pdf.getPage(p); const vp0 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: Math.min(2, 1600 / Math.max(vp0.width, vp0.height)) });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;

}
