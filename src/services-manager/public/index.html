<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
<meta name="theme-color" content="#5b7cf5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Services">
<title>Services Manager</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="jz.js" data-claude></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top topbar">
    <button class="tb-btn" data-home hidden aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
    <div class="brand">
      <h1>Services Manager</h1>
    </div>
    <span class="tb-gap"></span>
    <div class="conn">
      <span id="connPill" class="pill">umbrelOS</span>
      <button id="connBtn" class="btn small">Connect</button>
    </div>
    <button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
  <button class="tb-btn" data-pwa-install hidden aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 17v2.5h14V17"/></svg></button><button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button></header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="svc-toolbar">
      <input id="search" type="search" placeholder="Search services" autocomplete="off">
      <div class="seg" id="filter">
        <button data-f="all" class="on">All</button>
        <button data-f="umbrel">Umbrel apps</button>
        <button data-f="docker">Custom Docker</button>
      </div>
    </section>

    <div id="banner" class="banner" hidden></div>
    <section id="list" class="list" aria-live="polite"></section>
    <p class="foot" id="foot"></p>
  </main>

  <dialog id="connDlg">
    <form method="dialog" id="connForm">
      <h2>Connect to umbrelOS</h2>
      <p class="muted">Needed to start and stop Umbrel apps so the choice survives reboots. Your password is sent to umbrelOS once and is not stored; only the session token is kept.</p>
      <label>Umbrel password<input id="pw" type="password" autocomplete="current-password" required></label>
      <label>2FA code <span class="muted">(only if enabled)</span><input id="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
      <p id="connErr" class="err" hidden></p>
      <div class="actions">
        <button type="button" class="btn" id="connCancel">Cancel</button>
        <button type="submit" class="btn primary" id="connGo">Connect</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="pwtoggle.js"></script>
  <script src="app.js"></script>
</body>
</html>
