<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="18" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="7" r="1.1" fill="currentColor"/><circle cx="7" cy="17" r="1.1" fill="currentColor"/></svg>
      <h1>Services Manager</h1>
    </div>
    <div class="conn">
      <span id="connPill" class="pill">umbrelOS</span>
      <button id="connBtn" class="btn small">Connect</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search services" autocomplete="off">
      <div class="seg" id="filter">
        <button data-f="all" class="on">All</button>
        <button data-f="umbrel">Umbrel apps</button>
        <button data-f="docker">Custom Docker</button>
      </div>
    </section>

    <div id="banner" class="banner" hidden></div>
    <section id="list" class="list" aria-live="polite"></section>
    <p class="foot" id="foot"></p>
  </main>

  <dialog id="connDlg">
    <form method="dialog" id="connForm">
      <h2>Connect to umbrelOS</h2>
      <p class="muted">Needed to start and stop Umbrel apps so the choice survives reboots. Your password is sent to umbrelOS once and is not stored; only the session token is kept.</p>
      <label>Umbrel password<input id="pw" type="password" autocomplete="current-password" required></label>
      <label>2FA code <span class="muted">(only if enabled)</span><input id="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
      <p id="connErr" class="err" hidden></p>
      <div class="actions">
        <button type="button" class="btn" id="connCancel">Cancel</button>
        <button type="submit" class="btn primary" id="connGo">Connect</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
