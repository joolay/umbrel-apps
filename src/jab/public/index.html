<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoolzApp Biz</title>
<meta name="theme-color" content="#7e22ce">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JAB">
<script src="jz.js"></script>
<style>
/* Brand tokens (see templates/glass/README.md) */
:root{--accent:#7e22ce;--accent-2:#e879f9;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#c084fc;--accent-2:#e9d5ff;--accent-t:#2e0a4a}}
:root[data-theme="dark"]{--accent:#c084fc;--accent-2:#e9d5ff;--accent-t:#2e0a4a}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 120px}
.hero{padding:6px 2px 14px}
.hero h1{margin:0;font-size:clamp(1.5rem,4.6vw,2.2rem);letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted)}
.find{display:block;width:100%;max-width:420px;margin:0 0 14px}
.grp{margin:0 0 22px}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;min-height:34px}
.grp-h button.name{all:unset;cursor:pointer;font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.grp-h button.name svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.grp.closed .grp-h button.name svg{transform:rotate(-90deg)}
.grp.closed .grid{display:none}
.grp-h .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}}
.appwrap{position:relative}
.app{display:flex;flex-direction:column;gap:10px;padding:14px;margin:0;height:100%;width:100%;text-align:left;font:inherit;color:var(--text);text-decoration:none;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (hover:hover){.app:hover{transform:translateY(-3px)}}
.app:active{transform:scale(.97)}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:56px;height:56px;border-radius:22%;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.ico svg,.gp svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.app b{font-size:1rem;line-height:1.2}
.app .d{color:var(--muted);font-size:.85rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.badges{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--muted)}
.chip.warn{color:var(--warn)}
.ctl{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2}
.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.ctl button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ctl button.x{color:var(--danger)}
.ctl button[disabled]{opacity:.35}
.editing .app{padding-top:50px}
.editing .ctl button{width:30px;height:30px}
.editing .appwrap{animation:jig .28s ease-in-out infinite alternate}
.editing .appwrap:nth-child(2n){animation-delay:-.14s}
@keyframes jig{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
@media (prefers-reduced-motion:reduce){.editing .appwrap{animation:none}}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--glass-line);border-radius:var(--r);background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;width:100%}
.add svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.bar{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b,env(safe-area-inset-bottom,0px)));display:flex;justify-content:center;gap:10px;z-index:40;pointer-events:none}
.bar>*{pointer-events:auto}
.pill{font:inherit;font-weight:700;border:0;border-radius:99px;padding:12px 22px;cursor:pointer;color:var(--accent-t);background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.pill.alt{color:var(--text);background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
/* settings */
.set{max-width:640px;margin:0 auto}
.set h2{margin:0 0 4px;font-size:1.05rem}
.set label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);margin:10px 0}
.set input[type=text],.set input[type=email],.set input[type=url]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:160px}
.team{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.team li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;border:1px solid var(--glass-line);border-radius:12px;background:var(--glass-strong);word-break:break-all}
.team button{flex:none}
/* dialog */
dialog{max-width:460px;width:calc(100% - 28px);padding:18px;color:var(--text)}
dialog::backdrop{background:rgba(10,10,20,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px}
dialog label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);margin:10px 0}
dialog input[type=text],dialog input[type=url],dialog input[type=password],dialog select{width:100%}
.glyphs{display:flex;gap:6px;flex-wrap:wrap}
.glyphs button{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:var(--glass-strong);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--text)}
.glyphs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glyphs button[aria-pressed="true"]{border-color:var(--accent)}
.cols{display:flex;gap:12px;align-items:center}
.cols input[type=color]{width:52px;height:38px;padding:2px;border-radius:10px;border:1px solid var(--glass-line);background:var(--glass-strong)}
.chk{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px!important;color:var(--text)!important}
.chk input{width:auto}
.dl-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:60;max-width:90vw}
.toast.err{background:var(--danger);color:#fff}
</style>
</head>
<body>
<header class="topbar">
  <button class="tb-btn" data-home hidden aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
  <div class="brand"><span>JoolzApp Biz</span></div>
  <span class="tb-gap"></span>
  <button class="tb-btn" data-pwa-install hidden aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 17v2.5h14V17"/></svg></button>
  <button class="tb-btn" data-settings id="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
  <button id="logout" data-logout hidden>Sign out</button>
</header>
<main class="wrap" id="main" aria-live="polite"><p class="empty">Loading…</p></main>
<div class="bar" id="bar" hidden></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  "use strict";
  var TOKEN = "gd.token", HEAD = "x-gd-token";
  var S = { cfg: null, me: null, prefs: {}, edit: false, view: "apps", q: "" };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function tok() { try { return sessionStorage.getItem(TOKEN) || localStorage.getItem(TOKEN) || ""; } catch (e) { return ""; } }
  function api(path, method, body) {
    var h = { "content-type": "application/json" }; if (tok()) h[HEAD] = tok();
    return fetch(path, { method: method || "GET", headers: h, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || "Something went wrong (" + r.status + ")"); e.status = r.status; throw e; } return j; });
    });
  }
  function toast(m, bad) { var t = $("#toast"); t.textContent = m; t.className = "toast" + (bad ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3200); }
  var ROLE = { admin: "Admin", editor: "Editor", member: "Member", viewonly: "View-only" };
  var isAdmin = function () { return !!(S.me && S.me.isAdmin); };

  /* ---------- icons (24px line glyphs) ---------- */
  var G = {
    tooth: '<path d="M7.6 3.6C5.2 3.6 3.7 5.5 4 7.7c.2 1.9 1.2 3.1 1.6 5 .4 2 .5 4.5 1.2 6.4.3.8 1.2.8 1.6 0 .6-1.7.8-3.7 1.7-4.7.5-.5 1.1-.6 1.9-.6s1.4.1 1.9.6c.9 1 1.1 3 1.7 4.7.4.8 1.3.8 1.6 0 .7-1.9.8-4.4 1.2-6.4.4-1.9 1.4-3.1 1.6-5 .3-2.2-1.2-4.1-3.6-4.1-1.7 0-2.5.9-4.4.9s-2.7-.9-4.4-.9z"/>',
    users: '<path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M21 19v-1a4 4 0 0 0-3-3.9M15.5 4.2a3.5 3.5 0 0 1 0 6.6"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    file: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    chart: '<path d="M4 4v16h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
    shield: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    wallet: '<path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 7V6a2 2 0 0 1 2-2h11M16 14h2"/>',
    box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>'
  };
  var GL = Object.keys(G);
  var svg = function (k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (G[k] || G.tooth) + "</svg>"; };
  var I = {
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    pen: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    l: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
    r: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    chev: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
  };

  /* ---------- apps view ---------- */
  function appTile(a) {
    var pick = isAdmin() && S.edit && !a.virtual, bg = "linear-gradient(145deg," + esc(a.c1) + "," + esc(a.c2) + ")";
    var inner = '<span class="ico" style="background:' + bg + '">' + svg(a.glyph) + '</span><b>' + esc(a.name) + '</b><span class="d">' + esc(a.desc || (a.url ? "" : "Not linked yet")) + '</span><span class="badges">' +
      (a.url ? "" : '<span class="chip warn">Not linked yet</span>') + (a.adminOnly ? '<span class="chip">Admin only</span>' : "") + "</span>";
    var tip = esc(a.desc ? a.name + ": " + a.desc : a.name);
    var hit = a.url && !(isAdmin() && S.edit)
      ? '<a class="app card" data-id="' + a.id + '" href="' + esc(a.url) + '" target="_blank" rel="noopener" title="' + tip + '">' + inner + "</a>"
      : '<button type="button" class="app card" data-id="' + a.id + '" title="' + tip + '">' + inner + "</button>";
    var ctl = pick ? '<div class="ctl"><button type="button" data-act="left" data-id="' + a.id + '" aria-label="Move earlier" title="Move earlier">' + I.l + '</button><button type="button" data-act="right" data-id="' + a.id + '" aria-label="Move later" title="Move later">' + I.r + '</button><button type="button" data-act="edit" data-id="' + a.id + '" aria-label="Edit" title="Edit">' + I.pen + '</button><button type="button" class="x" data-act="del" data-id="' + a.id + '" aria-label="Remove" title="Remove">' + I.x + "</button></div>" : "";
    return '<div class="appwrap">' + hit + ctl + "</div>";
  }
  function renderApps() {
    var c = S.cfg, q = S.q.trim().toLowerCase(), pick = isAdmin() && S.edit;
    var apps = c.apps.filter(function (a) { return !q || (a.name + " " + a.desc).toLowerCase().indexOf(q) >= 0; });
    var shared = apps.filter(function (a) { return !a.adminOnly; });
    var sections = c.groups.map(function (g) { return { g: g, apps: shared.filter(function (a) { return a.group === g.id; }) }; });
    var loose = shared.filter(function (a) { return !a.group; });
    if (loose.length || (pick && !c.groups.length)) sections.push({ g: null, apps: loose });
    // Admins also get the Admin folder: JAB Admin itself and every app marked admin only. It is built here, never saved as a group.
    if (isAdmin()) sections.push({ g: { id: "__admin", name: "Admin" }, apps: apps.filter(function (a) { return a.adminOnly; }).concat(q && "jab admin".indexOf(q) < 0 ? [] : [adminTile()]), admin: true });
    var h = '<section class="hero"><h1>' + esc(c.practice.name) + "</h1>" + (c.practice.tagline ? "<p>" + esc(c.practice.tagline) + "</p>" : "") + "</section>";
    if (c.apps.length > 8) h += '<input class="find" id="find" type="search" placeholder="Find an app" value="' + esc(S.q) + '" aria-label="Find an app">';
    if (pick) h += '<p class="hint">Editing: tap an app to change it, use the arrows to reorder. Tap Done when finished.</p>';
    var shown = 0;
    sections.forEach(function (s) {
      if (!s.apps.length && !pick) return;
      shown++;
      var gid = s.g ? s.g.id : "";
      var closed = s.g && S.prefs.collapsed && S.prefs.collapsed[gid] && !q;
      h += '<section class="grp' + (closed ? " closed" : "") + '">';
      if (s.g) h += '<div class="grp-h"><button type="button" class="name" data-act="fold" data-g="' + esc(gid) + '" aria-expanded="' + !closed + '">' + I.chev + esc(s.g.name) + "</button><span class=\"sp\"></span>" +
        (pick && !s.admin ? '<span class="ctl" style="position:static"><button type="button" data-act="gedit" data-g="' + esc(gid) + '" aria-label="Rename group" title="Rename group">' + I.pen + '</button><button type="button" class="x" data-act="gdel" data-g="' + esc(gid) + '" aria-label="Remove group" title="Remove group">' + I.x + "</button></span>" : "") + "</div>";
      else if (sections.length > 1) h += '<div class="grp-h"><span class="name" style="font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">Other</span></div>';
      h += '<div class="grid">' + s.apps.map(appTile).join("") + (pick ? '<button type="button" class="add" data-act="add" data-g="' + esc(gid) + '">' + I.plus + "Add app</button>" : "") + "</div></section>";
    });
    if (!shown) h += '<p class="empty">' + (q ? "No app matches that." : isAdmin() ? "Nothing here yet. Press and hold, then add your first app." : "No apps have been added yet.") + "</p>";
    $("#main").className = "wrap" + (pick ? " editing" : "");
    $("#main").innerHTML = h;
    var bar = $("#bar");
    if (pick) { bar.innerHTML = '<button type="button" class="pill alt" data-act="gadd">+ Add group</button><button type="button" class="pill" data-act="done">Done</button>'; bar.hidden = false; } else bar.hidden = true;
  }

  /* ---------- settings view ---------- */
  function renderSettings() {
    var h = '<div class="set">';
    if (isAdmin()) h += '<div class="card"><h2>People and practice</h2><p class="hint">People, roles, passwords and the practice name are managed in JAB Admin, which is separate from your JoolzApp accounts.</p>' + (S.me.adminUrl ? '<a class="btn primary" href="' + esc(S.me.adminUrl) + '" target="_blank" rel="noopener">Open JAB Admin</a>' : '<p class="hint">Open JAB Admin once from its own address and a link will appear here.</p>') + "</div>";
    h += '<div class="card"><h2>Account</h2><p class="hint">Signed in as ' + esc((S.me && (S.me.name || S.me.email)) || "") + " (" + esc(ROLE[S.me.role] || "") + ').</p><div class="row"><button type="button" class="btn" data-act="qa">Quick Access (PIN or pattern)</button><button type="button" class="btn" data-act="pwchange">Change password</button><button type="button" class="btn danger" data-act="out">Sign out</button></div></div></div>';
    $("#main").className = "wrap"; $("#main").innerHTML = h; $("#bar").hidden = true;
  }
  function render() {
    if (!S.cfg) return;
    $("#settings").setAttribute("aria-pressed", String(S.view === "settings"));
    if (S.view === "settings") renderSettings(); else renderApps();
  }

  /* ---------- saving (the admin's changes go to the server in one piece) ---------- */
  function reload() { return api("api/jab").then(function (j) { S.cfg = j.config; S.me = j.me; render(); }); }
  function save(msg) {
    return api("api/jab", "PUT", { config: S.cfg }).then(function (j) { S.cfg = j.config; render(); if (msg) toast(msg); }).catch(function (e) { toast(e.message, true); reload().catch(function () {}); });
  }
  function setPref(o) { Object.keys(o).forEach(function (k) { S.prefs[k] = o[k]; }); return api("api/prefs", "PUT", o).catch(function () {}); }
  function adminTile() { return { id: "__jab-admin", virtual: true, name: "JAB Admin", desc: "People, roles and practice settings", url: (S.me && S.me.adminUrl) || "", glyph: "shield", c1: "#5b21b6", c2: "#a78bfa", group: "", adminOnly: true }; }
  var byId = function (id) { if (id === "__jab-admin") return adminTile(); for (var i = 0; i < S.cfg.apps.length; i++) if (S.cfg.apps[i].id === id) return S.cfg.apps[i]; return null; };
  var uid = function (name, taken) { var b = String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "item", id = b, n = 2; while (taken.indexOf(id) >= 0) id = b + "-" + n++; return id; };

  /* ---------- dialogs ---------- */
  function open(html, onSubmit) {
    var d = $("#dlg"); d.innerHTML = html;
    d.onsubmit = function (e) { e.preventDefault(); if (e.submitter && e.submitter.value === "cancel") { d.close(); return; } if (onSubmit(d) !== false) d.close(); };
    d.onclick = function (e) { if (e.target === d) d.close(); };
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
    var f = d.querySelector("input[type=text]"); if (f) f.focus();
    return d;
  }
  function appDialog(a, groupId) {
    var isNew = !a; a = a || { id: "", name: "", desc: "", url: "", glyph: "tooth", c1: "#7e22ce", c2: "#e879f9", group: groupId === "__admin" ? "" : groupId || "", adminOnly: groupId === "__admin" };
    var opts = '<option value="">No group</option>' + S.cfg.groups.map(function (g) { return '<option value="' + esc(g.id) + '"' + (g.id === a.group ? " selected" : "") + ">" + esc(g.name) + "</option>"; }).join("");
    var gl = GL.map(function (k) { return '<button type="button" data-glyph="' + k + '" aria-pressed="' + (k === a.glyph) + '" aria-label="' + k + '" title="' + k + '">' + svg(k) + "</button>"; }).join("");
    var d = open('<form method="dialog"><h2>' + (isNew ? "Add an app" : "Edit app") + '</h2><label>Name<input type="text" name="name" maxlength="40" required value="' + esc(a.name) + '"></label><label>Description<input type="text" name="desc" maxlength="140" value="' + esc(a.desc) + '"></label>' +
      '<label>Address (where it opens)<input type="url" name="url" placeholder="https://..." autocapitalize="none" value="' + esc(a.url) + '"></label><label>Group<select name="group">' + opts + '</select></label>' +
      '<label>Icon</label><div class="glyphs">' + gl + '</div><label>Colours</label><div class="cols"><input type="color" name="c1" value="' + esc(a.c1) + '" aria-label="Colour one"><input type="color" name="c2" value="' + esc(a.c2) + '" aria-label="Colour two"></div>' +
      '<label class="chk"><input type="checkbox" name="adminOnly"' + (a.adminOnly ? " checked" : "") + '> Admin only (shown in the Admin folder)</label><div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div></form>', function (dd) {
      var f = dd.querySelector("form"), x = isNew ? { id: uid(f.name.value, S.cfg.apps.map(function (z) { return z.id; })) } : a;
      x.name = f.name.value.trim(); x.desc = f.desc.value.trim(); x.url = f.url.value.trim(); x.group = f.group.value; x.c1 = f.c1.value; x.c2 = f.c2.value; x.adminOnly = f.adminOnly.checked; x.glyph = a.glyph;
      if (isNew) S.cfg.apps.push(x);
      save(isNew ? "App added." : "Saved.");
    });
    d.querySelector(".glyphs").onclick = function (e) { var b = e.target.closest("[data-glyph]"); if (!b) return; a.glyph = b.dataset.glyph; [].forEach.call(d.querySelectorAll(".glyphs button"), function (z) { z.setAttribute("aria-pressed", String(z === b)); }); };
  }
  function groupDialog(g) {
    open('<form method="dialog"><h2>' + (g ? "Rename group" : "Add a group") + '</h2><label>Name<input type="text" name="name" maxlength="40" required value="' + esc(g ? g.name : "") + '"></label><div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div></form>', function (dd) {
      var n = dd.querySelector("input").value.trim(); if (!n) return false;
      if (g) g.name = n; else S.cfg.groups.push({ id: uid(n, S.cfg.groups.map(function (z) { return z.id; })), name: n });
      save(g ? "Saved." : "Group added.");
    });
  }

  function setTok(t) { try { var inLocal = localStorage.getItem(TOKEN) !== null; (inLocal ? localStorage : sessionStorage).setItem(TOKEN, t); if (inLocal) sessionStorage.removeItem(TOKEN); } catch (e) {} }
  function pwDialog() {
    open('<form method="dialog"><h2>Change your password</h2><label>Current password<input type="password" name="cur" autocomplete="current-password" required></label><label>New password (at least 8 characters)<input type="password" name="pw" minlength="8" autocomplete="new-password" required></label><label>New password again<input type="password" name="pw2" minlength="8" autocomplete="new-password" required></label><p class="hint">Your other devices are signed out and their PIN or pattern is forgotten. This one stays signed in.</p><div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Change</button></div></form>', function (dd) {
      var f = dd.querySelector("form"); if (f.pw.value !== f.pw2.value) { toast("The two new passwords do not match.", true); return false; }
      api("api/account/password", "POST", { current: f.cur.value, password: f.pw.value }).then(function (j) { if (j.token) setTok(j.token); toast("Password changed."); }).catch(function (e) { toast(e.message, true); });
    });
  }

  /* ---------- actions ---------- */
  function move(id, dir) {
    var apps = S.cfg.apps, i = apps.map(function (z) { return z.id; }).indexOf(id); if (i < 0) return;
    for (var j = i + dir; j >= 0 && j < apps.length; j += dir) if (apps[j].group === apps[i].group) { var t = apps[i]; apps[i] = apps[j]; apps[j] = t; return save(); }
  }
  var QA = null;
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t) {
      var act = t.dataset.act, id = t.dataset.id, g = t.dataset.g;
      if (act === "done") { S.edit = false; return render(); }
      if (act === "add") return appDialog(null, g);
      if (act === "edit") return appDialog(byId(id));
      if (act === "left") return move(id, -1);
      if (act === "right") return move(id, 1);
      if (act === "del") { var a = byId(id); if (a && confirm("Remove " + a.name + " from the dashboard? The app itself is not deleted.")) { S.cfg.apps = S.cfg.apps.filter(function (z) { return z.id !== id; }); save("Removed."); } return; }
      if (act === "gadd") return groupDialog(null);
      if (act === "gedit") return groupDialog(S.cfg.groups.filter(function (z) { return z.id === g; })[0]);
      if (act === "gdel") { var gg = S.cfg.groups.filter(function (z) { return z.id === g; })[0]; if (gg && confirm("Remove the group " + gg.name + "? Its apps stay, without a group.")) { S.cfg.groups = S.cfg.groups.filter(function (z) { return z.id !== g; }); save("Group removed."); } return; }
      if (act === "fold") { var cur = Object.assign({}, S.prefs.collapsed || {}); cur[g] = !cur[g]; setPref({ collapsed: cur }); return render(); }
      if (act === "pwchange") return pwDialog();
      if (act === "qa") return QA && QA.manage();
      if (act === "out") return signOut();
      return;
    }
    var app = e.target.closest(".app");
    if (app) {
      var a2 = byId(app.dataset.id); if (!a2) return;
      if (a2.virtual) { if (!a2.url) { e.preventDefault(); toast("Open JAB Admin once from its own address and this link will work."); } else if (S.edit) e.preventDefault(); return; }
      if (isAdmin() && S.edit) { e.preventDefault(); return appDialog(a2); }
      if (!a2.url) { e.preventDefault(); if (isAdmin()) appDialog(a2); else toast(a2.name + " is not linked yet."); }
    }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "find") { S.q = e.target.value; var p = e.target.selectionStart; render(); var f = $("#find"); if (f) { f.focus(); try { f.setSelectionRange(p, p); } catch (x) {} } } });
  $("#settings").addEventListener("click", function () { S.view = S.view === "settings" ? "apps" : "settings"; S.edit = false; render(); window.scrollTo(0, 0); });
  function signOut() { api("api/account/logout", "POST").catch(function () {}).then(function () { try { sessionStorage.removeItem(TOKEN); localStorage.removeItem(TOKEN); } catch (e) {} location.reload(); }); }
  $("#logout").addEventListener("click", signOut);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.edit && !$("#dlg").open) { S.edit = false; render(); } });
  window.addEventListener("jz-theme", function (e) { setPref({ theme: e.detail }); });   // the theme follows the person's account

  /* ---------- press and hold on an app (admin): edit mode, like the home screen ---------- */
  (function () {
    var timer = null, sx = 0, sy = 0, fired = false;
    var stop = function () { clearTimeout(timer); timer = null; };
    document.addEventListener("pointerdown", function (e) {
      if (!isAdmin() || S.edit || S.view !== "apps" || !e.target.closest(".app")) return;
      sx = e.clientX; sy = e.clientY; fired = false;
      timer = setTimeout(function () { fired = true; S.edit = true; if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {} render(); }, 550);
    });
    document.addEventListener("pointermove", function (e) { if (timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) stop(); });
    ["pointerup", "pointercancel", "scroll"].forEach(function (n) { document.addEventListener(n, stop, true); });
    document.addEventListener("click", function (e) { if (fired) { fired = false; e.preventDefault(); e.stopPropagation(); } }, true);
    document.addEventListener("contextmenu", function (e) { if (isAdmin() && e.target.closest(".app")) e.preventDefault(); });
  })();

  /* ---------- start ---------- */
  QA = window.JZQuick ? JZQuick({ app: "jab", name: "JoolzApp Biz", request: function (m, p, b) { return api(p, m, b); } }) : null;
  api("api/jab").then(function (j) {
    S.cfg = j.config; S.me = j.me; S.prefs = Object.assign({}, j.me.prefs || {});
    if (window.JZBar) JZBar.setUser({ name: j.me.name || j.me.email || "" });
    var th = S.prefs.theme; if (window.JZTheme && (th === "light" || th === "dark")) JZTheme.set(th, true);
    render(); if (QA) QA.offer();
  }).catch(function (e) { if (e.status === 401 || e.status === 403) location.reload(); else { $("#main").innerHTML = '<p class="empty">' + esc(e.message) + "</p>"; } });
})();
</script>
</body>
</html>
