<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAB Admin</title>
<meta name="theme-color" content="#5b21b6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JAB Admin">
<script src="jz.js"></script>
<style>
/* Brand tokens (see templates/glass/README.md) */
:root{--accent:#5b21b6;--accent-2:#a78bfa;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#a78bfa;--accent-2:#ddd6fe;--accent-t:#1e0b3d}}
:root[data-theme="dark"]{--accent:#a78bfa;--accent-2:#ddd6fe;--accent-t:#1e0b3d}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 90px}
h1{margin:6px 0 2px;font-size:clamp(1.4rem,4.4vw,2rem);letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--muted)}
.chip.admin{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.off{color:var(--danger)}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:14px;margin:0}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--accent-t);background:linear-gradient(145deg,var(--accent),var(--accent-2));grid-row:span 2}
.person.off .av{filter:grayscale(1);opacity:.6}
.who b{font-size:1rem}.who .em{color:var(--muted);font-size:.85rem;word-break:break-all}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--glass-line)}
@media (min-width:700px){.person{grid-template-columns:auto 1fr auto}.acts{grid-column:auto;border:0;padding:0;justify-content:flex-end}.av{grid-row:auto}}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.set{display:grid;gap:14px}
.set h2{margin:0 0 4px;font-size:1.05rem}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);margin:10px 0}
label input,label select{width:100%}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.roles{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}
.roles li{padding:8px 12px;border:1px solid var(--glass-line);border-radius:12px;background:var(--glass-strong);font-size:.9rem}
.roles b{color:var(--text)}
dialog{max-width:460px;width:calc(100% - 28px);padding:18px;color:var(--text)}
dialog::backdrop{background:rgba(10,10,20,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px}
.dl-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.chk{display:flex!important;align-items:center;gap:8px!important;color:var(--text)!important}
.chk input{width:auto}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.pill{font:inherit;font-weight:700;border:0;border-radius:99px;padding:13px 22px;cursor:pointer;color:var(--accent-t);background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:60;max-width:90vw}
.toast.err{background:var(--danger);color:#fff}
.copy{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--glass-strong);border:1px solid var(--glass-line);padding:8px 12px;border-radius:10px;word-break:break-all;margin:8px 0}
</style>
</head>
<body>
<header class="topbar">
  <button class="tb-btn" data-home hidden aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
  <div class="brand"><span>JAB Admin</span></div>
  <span class="tb-gap"></span>
  <button class="tb-btn" data-pwa-install hidden aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 17v2.5h14V17"/></svg></button>
  <button class="tb-btn" data-settings id="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="tb-btn" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
</header>
<main class="wrap" id="main" aria-live="polite"><p class="empty">Loading…</p></main>
<div class="fab" id="fab" hidden><button class="pill" type="button" data-act="add">+ Add person</button></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  "use strict";
  var S = { d: null, view: "people" };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ROLE = { admin: "Admin", editor: "Editor", member: "Member", viewonly: "View-only" };
  var ROLE_HELP = {
    admin: "Everything: manages people, the dashboard and its apps.",
    editor: "Can edit and confirm shared things in the practice apps.",
    member: "Uses the apps; small edits are tagged for an editor to confirm.",
    viewonly: "Can look at everything but change nothing shared."
  };
  function api(path, method, body) {
    return fetch(path, { method: method || "GET", headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || "Something went wrong (" + r.status + ")"); e.status = r.status; throw e; } return j; });
    });
  }
  function toast(m, bad) { var t = $("#toast"); t.textContent = m; t.className = "toast" + (bad ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3400); }
  // Dates follow the region's usual style (South Africa: dd/mm/yyyy, 24 hour).
  function when(ms) { if (!ms) return "never"; var d = new Date(ms), p = function (n) { return (n < 10 ? "0" : "") + n; }; return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
  function genPassword() { var a = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", o = "", r = new Uint32Array(12); (window.crypto || window.msCrypto).getRandomValues(r); for (var i = 0; i < 12; i++) o += a[r[i] % a.length]; return o; }
  var byId = function (id) { return (S.d.users || []).filter(function (u) { return u.id === id; })[0]; };

  function person(u) {
    var init = esc((u.name || u.email || "?").trim().charAt(0).toUpperCase());
    return '<div class="card person' + (u.disabled ? " off" : "") + '"><div class="av" aria-hidden="true">' + init + '</div><div class="who"><b>' + esc(u.name || u.email) + '</b><div class="em">' + esc(u.email) + '</div>' +
      '<div class="meta"><span class="chip ' + (u.role === "admin" ? "admin" : "") + '">' + ROLE[u.role] + "</span>" + (u.disabled ? '<span class="chip off">Switched off</span>' : "") + (u.quick ? '<span class="chip" title="Signs in with a PIN or pattern on ' + u.devices + ' device(s)">PIN / pattern</span>' : "") + '<span class="chip">Last active ' + when(u.lastActive) + "</span></div></div>" +
      '<div class="acts"><button type="button" class="btn small" data-act="edit" data-id="' + u.id + '">Edit</button><button type="button" class="btn small" data-act="pw" data-id="' + u.id + '">New password</button><button type="button" class="btn small" data-act="out" data-id="' + u.id + '" title="Ends every sign-in and PIN or pattern this person has">Sign out everywhere</button><button type="button" class="btn small danger" data-act="del" data-id="' + u.id + '">Remove</button></div></div>';
  }
  function renderPeople() {
    var d = S.d, h = '<div class="head"><div><h1>People</h1><p class="sub" style="margin:0">Everyone who can open ' + esc(d.practice.name) + "'s JoolzApp Biz.</p></div></div>";
    if (!d.users.length) {
      h += '<div class="card set"><div><h2>Create the first admin</h2><p class="hint">This is your own JAB account. It is separate from your JoolzApp account and nothing is shared between the two.</p></div>' +
        '<form id="first"><label>Name<input type="text" name="name" maxlength="60" autocomplete="name" required></label><label>Email (you sign in with this)<input type="email" name="email" autocapitalize="none" autocomplete="username" required></label>' +
        '<label>Password (at least 8 characters)<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><button class="btn primary" type="submit">Create admin</button></form></div>';
      $("#fab").hidden = true;
    } else {
      var n = {}; d.users.forEach(function (u) { n[u.role] = (n[u.role] || 0) + 1; });
      h += '<div class="stats">' + d.roles.filter(function (r) { return n[r]; }).map(function (r) { return '<span class="chip">' + n[r] + " " + ROLE[r] + "</span>"; }).join("") + "</div>";
      h += '<div class="people">' + d.users.map(person).join("") + "</div>";
      $("#fab").hidden = false;
    }
    $("#main").innerHTML = h;
  }
  function renderSettings() {
    var d = S.d, n = d.users.length;
    $("#fab").hidden = true;
    $("#main").innerHTML = '<div class="set"><h1>Settings</h1>' +
      '<div class="card"><h2>Practice</h2><p class="hint">Shown at the top of the JoolzApp Biz dashboard.</p><label>Name<input type="text" id="p-name" maxlength="60" value="' + esc(d.practice.name) + '"></label><label>Tagline<input type="text" id="p-tag" maxlength="100" value="' + esc(d.practice.tagline) + '"></label><button type="button" class="btn primary" data-act="psave">Save</button></div>' +
      '<div class="card"><h2>Roles</h2><ul class="roles">' + d.roles.map(function (r) { return "<li><b>" + ROLE[r] + ":</b> " + esc(ROLE_HELP[r]) + "</li>"; }).join("") + '</ul></div>' +
      '<div class="card"><h2>Admin folder</h2><p class="hint">Admins see an Admin folder on the JoolzApp Biz dashboard with JAB Admin and every app marked admin only. ' + (d.adminUrl ? 'JAB Admin is linked from the dashboard at:' : 'The dashboard will link here once this page has been opened from the address you normally use.') + "</p>" + (d.adminUrl ? '<div class="copy">' + esc(d.adminUrl) + "</div>" : "") + '</div>' +
      '<div class="card"><h2>About</h2><p class="hint">JAB Admin ' + esc(d.version) + ". " + n + (n === 1 ? " person" : " people") + ", " + d.appCount + " app" + (d.appCount === 1 ? "" : "s") + " on the dashboard. Sign-ins last until 90 days after the last use. Passwords and PIN or pattern codes are stored scrambled (hashed) in the data folder of JAB itself. JAB shares nothing with your JoolzApp accounts.</p></div></div>";
  }
  function render() { $("#settings").setAttribute("aria-pressed", String(S.view === "settings")); if (S.view === "settings") renderSettings(); else renderPeople(); }
  function apply(d, msg) { S.d = d; render(); if (msg) toast(msg); }
  function failed(e) { toast(e.message, true); }

  /* ---------- dialogs ---------- */
  function open(html, onSubmit) {
    var d = $("#dlg"); d.innerHTML = html;
    d.onsubmit = function (e) { e.preventDefault(); if (e.submitter && e.submitter.value === "cancel") { d.close(); return; } var r = onSubmit(d); if (r && r.then) r.then(function (ok) { if (ok !== false) d.close(); }); else if (r !== false) d.close(); };
    d.onclick = function (e) { if (e.target === d) d.close(); };
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
    var f = d.querySelector("input[type=text],input[type=email]"); if (f) f.focus();
    return d;
  }
  var roleOpts = function (cur) { return S.d.roles.map(function (r) { return '<option value="' + r + '"' + (r === cur ? " selected" : "") + ">" + ROLE[r] + "</option>"; }).join(""); };
  function pwField(id) { return '<label>Password (at least 8 characters)<div class="pw"><input type="text" name="password" id="' + id + '" minlength="8" autocomplete="off" autocapitalize="none" required><button type="button" class="btn" data-gen="' + id + '">Make one</button></div></label>'; }
  function wireGen(d) { [].forEach.call(d.querySelectorAll("[data-gen]"), function (b) { b.onclick = function () { d.querySelector("#" + b.dataset.gen).value = genPassword(); }; }); }
  function help(d) { var s = d.querySelector("select[name=role]"), p = d.querySelector(".rh"); function f() { p.textContent = ROLE_HELP[s.value]; } s.onchange = f; f(); }
  function addDialog() {
    var d = open('<form method="dialog"><h2>Add a person</h2><label>Name<input type="text" name="name" maxlength="60" required></label><label>Email (they sign in with this)<input type="email" name="email" autocapitalize="none" required></label>' +
      '<label>Role<select name="role">' + roleOpts("member") + '</select></label><p class="hint rh"></p>' + pwField("n-pw") + '<p class="hint">Give them this password. They can change it themselves under Settings in JoolzApp Biz.</p><div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add</button></div></form>', function (dd) {
      var f = dd.querySelector("form");
      return api("api/users", "POST", { name: f.name.value, email: f.email.value, role: f.role.value, password: f.password.value }).then(function (j) { apply(j, "Added " + (f.name.value || f.email.value) + "."); }).catch(function (e) { failed(e); return false; });
    });
    wireGen(d); help(d); d.querySelector("#n-pw").value = genPassword();
  }
  function editDialog(u) {
    var d = open('<form method="dialog"><h2>Edit ' + esc(u.name || u.email) + '</h2><label>Name<input type="text" name="name" maxlength="60" value="' + esc(u.name) + '"></label><label>Email<input type="email" name="email" autocapitalize="none" required value="' + esc(u.email) + '"></label>' +
      '<label>Role<select name="role">' + roleOpts(u.role) + '</select></label><p class="hint rh"></p><label class="chk"><input type="checkbox" name="disabled"' + (u.disabled ? " checked" : "") + '> Switched off (cannot sign in)</label><div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div></form>', function (dd) {
      var f = dd.querySelector("form");
      return api("api/users/" + u.id, "PATCH", { name: f.name.value, email: f.email.value, role: f.role.value, disabled: f.disabled.checked }).then(function (j) { apply(j, "Saved."); }).catch(function (e) { failed(e); return false; });
    });
    help(d);
  }
  function pwDialog(u) {
    var d = open('<form method="dialog"><h2>New password for ' + esc(u.name || u.email) + '</h2><p class="hint">They are signed out everywhere and their PIN or pattern is forgotten, so they sign in with this password.</p>' + pwField("r-pw") + '<div class="dl-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Set password</button></div></form>', function (dd) {
      return api("api/users/" + u.id + "/password", "POST", { password: dd.querySelector("#r-pw").value }).then(function (j) { apply(j, "Password changed. Give it to " + (u.name || u.email) + "."); }).catch(function (e) { failed(e); return false; });
    });
    wireGen(d); d.querySelector("#r-pw").value = genPassword();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.dataset.act, u = t.dataset.id && byId(t.dataset.id);
    if (act === "add") return addDialog();
    if (act === "edit" && u) return editDialog(u);
    if (act === "pw" && u) return pwDialog(u);
    if (act === "out" && u) { if (confirm("Sign " + (u.name || u.email) + " out everywhere? They will need their password again.")) api("api/users/" + u.id + "/signout", "POST").then(function (j) { apply(j, "Signed out everywhere."); }).catch(failed); return; }
    if (act === "del" && u) { if (confirm("Remove " + (u.name || u.email) + " from JoolzApp Biz? This cannot be undone.")) api("api/users/" + u.id, "DELETE").then(function (j) { apply(j, "Removed."); }).catch(failed); return; }
    if (act === "psave") return api("api/practice", "PUT", { name: $("#p-name").value, tagline: $("#p-tag").value }).then(function (j) { apply(j, "Saved."); }).catch(failed);
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "first") return; e.preventDefault(); var f = e.target;
    api("api/users", "POST", { name: f.name.value, email: f.email.value, role: "admin", password: f.password.value }).then(function (j) { apply(j, "Admin created. Open JoolzApp Biz and sign in."); }).catch(failed);
  });
  $("#settings").addEventListener("click", function () { S.view = S.view === "settings" ? "people" : "settings"; render(); window.scrollTo(0, 0); });

  if (window.JZBar) JZBar.setUser({ name: "Admin" });
  api("api/overview").then(function (d) { S.d = d; render(); try { api("api/register-url", "POST", { url: location.origin + "/" }); } catch (e) {} }).catch(function (e) { $("#main").innerHTML = '<p class="empty">' + esc(e.message) + "</p>"; });
})();
</script>
</body>
</html>
