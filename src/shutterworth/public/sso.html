<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Signing in…</title></head>
<body style="font:16px system-ui,sans-serif;padding:2rem;text-align:center">
<p>Signing you in…</p>
<noscript><p>JavaScript is needed to sign in.</p></noscript>
<script>
// Opened from the JoolzApp dashboard (Portal Admin) with the person's sign-in in the address fragment, which never reaches a server.
// The token is checked by the app, kept for this browser session only, removed from the address bar, and then the app opens.
(function () {
  var m = location.hash.match(/[#&]t=([^&]+)/), t = ""; try { t = m ? decodeURIComponent(m[1]) : ""; } catch (e) {}
  history.replaceState(null, "", location.pathname);
  function go() { location.replace("./"); }
  if (!t) return go();
  fetch("api/account/me", { headers: { "x-sw-token": t }, cache: "no-store" }).then(function (r) {
    if (r.ok) { try { localStorage.removeItem("sw.token"); sessionStorage.setItem("sw.token", t); } catch (e) {} }
    go();
  }).catch(go);
})();
</script></body></html>
