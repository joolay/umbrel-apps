<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShutterWorth</title>
<meta name="theme-color" content="#145f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="stylesheet" href="glass.css">
<style>
:root{--accent:#145f4f;--accent-2:#2f8571;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#3FBF9F;--accent-2:#7FD6BD;--accent-t:#04221B}}
:root[data-theme="dark"]{--accent:#3FBF9F;--accent-2:#7FD6BD;--accent-t:#04221B}
*{box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:380px;text-align:center;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-line);border-radius:var(--r);padding:28px 22px 24px;box-shadow:var(--shadow)}
.logo{width:84px;height:84px;border-radius:22px;box-shadow:var(--shadow)}
h1{margin:14px 0 4px;font-size:1.6rem;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted)}
form{display:grid;gap:10px;text-align:left}
label{display:grid;gap:4px;margin:0;font-size:.85rem;color:var(--muted)}
input{width:100%}
.opts{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.9rem}.opts a{color:var(--accent)}.opts label.inline{display:flex;gap:6px;align-items:center;margin:0;color:var(--text)}.opts input{width:auto;margin:0}
.go{font:inherit;font-weight:700;border:0;border-radius:var(--r-pill);padding:13px;margin-top:4px;color:var(--accent-t);background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer;transition:transform .12s ease}
.go:active{transform:scale(.97)}.go:disabled{opacity:.6}
.alt{font:inherit;background:none;border:0;color:var(--accent);text-decoration:underline;margin-top:14px;cursor:pointer;padding:6px}
.e{min-height:1.3em;margin:2px 0 0;color:var(--danger);font-size:.9rem}
.ok{min-height:1.3em;margin:2px 0 0;color:var(--ok);font-size:.9rem}
.note{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:14px 16px;margin:0 0 16px}
.row{display:flex;gap:10px;justify-content:center}
.row button{font:inherit;font-weight:600;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 16px;cursor:pointer}
details.ai{margin:10px 0;font-size:14px}details.ai summary{cursor:pointer;color:var(--accent)}details.ai label{margin-top:8px;display:block}details.ai select,details.ai input{width:100%;box-sizing:border-box;margin-top:4px}
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.svg?v=3" alt="">
  <h1>ShutterWorth</h1>
  <p class="sub" id="sub">Sign in with your JoolzApp account</p>
  <div id="view"></div>
</main>
<script src="pwtoggle.js"></script>
<script>
(function () {
  "use strict";
  var TOKEN = "sw.token", mode = "in", cfg = {}, view = document.getElementById("view"), sub = document.getElementById("sub");
  function tok() { try { return localStorage.getItem(TOKEN) || ""; } catch (e) { return ""; } }
  function setTok(t) { try { t ? localStorage.setItem(TOKEN, t) : localStorage.removeItem(TOKEN); } catch (e) {} }
  function api(path, opts) {
    opts = opts || {}; var h = { "content-type": "application/json" }; if (tok()) h["x-sw-token"] = tok();
    return fetch(path, { method: opts.method || "GET", headers: h, body: opts.body, cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || "Something went wrong (" + r.status + ")"); e.status = r.status; throw e; } return j; });
    });
  }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function field(label, type, auto) { var l = el("label", "", label), i = el("input"); i.type = type; i.autocomplete = auto; l.appendChild(i); return { l: l, i: i }; }

  function form() {
    var reg = mode === "up"; view.textContent = "";
    sub.textContent = reg ? "Create your JoolzApp account. One account works in all JoolzApp apps." : "Sign in with your JoolzApp account";
    var f = el("form"), name = field("Name", "text", "name"), email = field("Email", "email", "email"), pass = field("Password", "password", reg ? "new-password" : "current-password");
    email.i.required = true; pass.i.required = true; if (reg) pass.i.minLength = 8;
    if (reg) f.appendChild(name.l); f.append(email.l, pass.l);
    var err = el("p", "e"); err.setAttribute("role", "alert");
    var go = el("button", "go", reg ? "Create account" : "Sign in"); go.type = "submit";
    f.append(err, go);
    f.onsubmit = function (ev) {
      ev.preventDefault(); err.textContent = ""; go.disabled = true;
      api(reg ? "api/account/register" : "api/account/login", { method: "POST", body: JSON.stringify({ email: email.i.value, password: pass.i.value, name: name.i.value }) })
        .then(function (j) { setTok(j.token); j.user.canOpen ? location.reload() : waiting(j.user); })
        .catch(function (e) { err.textContent = e.message; go.disabled = false; });
    };
    view.appendChild(f);
    if (reg || cfg.signups !== false) {
      var alt = el("button", "alt", reg ? "I already have a JoolzApp account" : "Create a JoolzApp account"); alt.type = "button";
      // There is one JoolzApp sign-up page, in Portal Admin. It sends you back here when the account is made.
      alt.onclick = function () { if (cfg.portalUrl) location.href = cfg.portalUrl.replace(/\/+$/, "") + "/?signup=1&app=shutterworth"; else err.textContent = "Sign-up lives in Portal Admin, but its address isn't set yet. Ask the admin."; }; view.appendChild(alt);
    }
  }
  function waiting(u) {
    view.textContent = ""; sub.textContent = "Almost there";
    view.appendChild(el("p", "note", "You're signed in as " + (u.name || u.email) + ". " + ((u.gate && u.gate.message) || "The admin hasn't opened this inventory to you yet. Ask them to give you access, then check again.")));
    var row = el("div", "row"), again = el("button", "", "Check again"), out = el("button", "", "Sign out");
    again.onclick = function () { start(); }; out.onclick = signOut; row.append(again, out); view.appendChild(row);
  }
  function signOut() { setTok(""); try { localStorage.removeItem("sw_prefs"); } catch (e) {} fetch("api/account/logout", { method: "POST" }).catch(function () {}).then(function () { location.reload(); }); }
  function problem(msg) {
    view.textContent = ""; sub.textContent = "Can't reach the account server";
    view.appendChild(el("p", "note", msg));
    var row = el("div", "row"), b = el("button", "", "Try again"); b.onclick = start; row.appendChild(b); view.appendChild(row);
  }
  function start() {
    api("api/app-config").then(function (c) { cfg = c; })
      .catch(function () {})
      .then(function () { return api("api/account/me"); })
      .then(function (j) { if (j.user.canOpen) location.reload(); else waiting(j.user); })
      .catch(function (e) { if (e.status === 401 || e.status === 404) { setTok(""); form(); } else problem(e.message); });
  }
  start();
})();
</script>
</body>
</html>
