<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Listify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D151B; --surface: #141E26; --surface-2: #1A2630; --ink: #E5EDF2; --muted: #94A6B3;

    --accent-soft: #16313E; --danger: #F28B82; --danger-ink: #2B0B09; --toast-bg: #E5EDF2; --toast-fg: #0D151B; --toast-accent: #0A6C8F;

}

  --line: #263540; --line-strong: #38495A; --accent: #4DB6DD; --accent-ink: #04222E; --accent-text: #6CC7E8;
  --accent-soft: #16313E; --danger: #F28B82; --danger-ink: #2B0B09; --toast-bg: #E5EDF2; --toast-fg: #0D151B; --toast-accent: #0A6C8F;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px));

.datechip.empty { color: var(--muted); border-style: dashed; }
.datechip svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.empty { color: var(--muted); padding: 6px 0 2px; border-top: 1px solid var(--line); padding-top: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .meta { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.btn svg, .toast-btn svg, .seg button svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn svg { width: 22px; height: 22px; }
.btn.ico { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; padding: 0 10px; }
.btn.sm.ico { min-width: 34px; padding: 0 8px; }
.btn .n { font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.btn .n:empty { display: none; }
.toast-btn { display: inline-flex; align-items: center; gap: 6px; }
.bt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, label, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.add .btn { min-width: 56px; }
#save-btn { min-height: 56px; min-width: 72px; }

.toast-btn svg { width: 20px; height: 20px; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 20px; height: 20px; }
.seg button { min-height: 44px; }
.picker { position: relative; flex: 1; min-width: 0; }
.picker-btn { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 15px; min-height: 44px; }
.picker-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.menu { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 6px; list-style: none; max-height: min(60vh, 360px); overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.2); }
.menu-item { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.menu-item:hover { background: var(--surface-2); }
.menu-item.on { color: var(--accent-text); font-weight: 600; }
.menu-item .n { font: 500 12px var(--font-mono); opacity: .75; }

.picker-btn .n { font: 500 12px var(--font-mono); opacity: .75; }

.dp-title { font-weight: 600; }
.dp-list { margin: 0; padding-left: 18px; max-height: 160px; overflow: auto; overflow-wrap: anywhere; }

.chk.sel::after { border-color: var(--danger-ink); }
.item.picked .txt { font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); }
.lab { font: 500 11.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

<div class="wrap">
  <header class="top">
    <h1 class="brand">
      <svg class="mark" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="8"></rect>
        <path class="fold" d="M19 1h2a8 8 0 0 1 8 8v2z"></path>
        <path class="tick" d="M8.5 15.5l4.5 4.5 8.5-9.5" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>List<b>ify</b></span>
    </h1>
    <div class="acct">
      <p class="totals mono" id="totals"></p>
      <button type="button" class="btn quiet sm" id="dash-btn" hidden>JoolzApp</button>
      <button type="button" class="btn quiet sm" id="out-btn" hidden>Sign out</button>
    </div>
  </header>

  <div class="tabs-row">
    <div class="picker" id="picker"></div>
    <button type="button" class="btn sm new-list ico" id="new-list-btn" data-icon="plus" aria-label="New list" title="New list"><span class="bt">New</span></button>
  </div>
  <form class="new-list-form" id="new-list-form" hidden>
    <label class="sr" for="new-list-name">List name</label>
    <input type="text" id="new-list-name" maxlength="60" placeholder="Name your list" autocomplete="off" enterkeyhint="done">
    <button type="submit" class="btn primary sm ico" data-icon="check" aria-label="Create list" title="Create list"><span class="bt">Create</span></button>
    <button type="button" class="btn sm ico" id="new-list-cancel" data-icon="x" aria-label="Cancel" title="Cancel"><span class="bt">Cancel</span></button>
  </form>

  <div class="grid">
    <main class="card" id="list-card">
      <div class="card-head">
        <div class="title-slot" id="title-slot"></div>
        <div class="head-actions" id="head-actions"></div>
      </div>
      <div class="date-row" id="date-row"></div>
      <div class="progress" id="progress"></div>
      <form class="add" id="add-form">
        <label class="sr" for="add-input">Add an item</label>
        <input type="text" id="add-input" maxlength="300" placeholder="Add an item" autocomplete="off" enterkeyhint="done">
        <button type="button" class="btn ico" id="photo-btn" data-icon="camera" aria-label="Add items from a photo" title="Add items from a photo"><span class="bt">Photo</span></button>
        <button type="submit" class="btn primary ico" data-icon="plus" aria-label="Add item" title="Add item"><span class="bt">Add</span></button>
      </form>
      <input type="file" id="photo-input" accept="image/*" hidden>
      <div class="read-panel" id="read-panel" hidden></div>
      <div class="toolbar">
        <div class="seg" id="filters" role="group" aria-label="Show items"></div>
        <div class="tools" id="tools"></div>
      </div>
      <div class="delete-panel" id="delete-panel" hidden></div>
      <div>
        <ul class="items" id="items"></ul>
        <p class="empty" id="empty" hidden></p>
      </div>
    </main>

    <aside class="card export" id="export-card">
      <h2>Reminders</h2>
      <div class="actions">
        <button type="button" class="btn primary ico" id="save-btn" data-icon="copy" aria-label="Copy open items" title="Copy open items"><span class="bt">Copy for Reminders</span><span class="n"></span></button>
        <span class="meta mono" id="export-meta"></span>
      </div>
      <p class="hint">Copies the open items. Then run your “Save to Shopping” shortcut. Add it to your Home Screen for one tap.</p>
    </aside>
  </div>

  <datalist id="tag-options"><option value="Groceries"><option value="Household"><option value="Pharmacy"><option value="Hardware"><option value="Gifts"><option value="Tasks"><option value="Other"></datalist>
  <p class="foot" id="foot"></p>
</div>

<div class="toast-wrap" id="toast-wrap" hidden>
  <div class="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button type="button" class="toast-btn" id="toast-undo" hidden data-icon="undo" aria-label="Undo" title="Undo"><span class="bt">Undo</span></button>
  </div>
</div>

<script>

    camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/>',
    uncheck: '<rect x="5" y="5" width="14" height="14" rx="3"/>',
    reorder: '<path d="M8 5v14M8 5L5 8M8 5l3 3M16 19V5M16 19l-3-3M16 19l3-3"/>',
    list: '<path d="M5 7h14M5 12h14M5 17h14"/>',
    circle: '<circle cx="12" cy="12" r="7"/>',
    checkcircle: '<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
    selectall: '<path d="M4 7l2 2 3-3M4 15l2 2 3-3"/><path d="M12 8h8M12 16h8"/>',
    copy: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>'
  };
  function icon(name) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[name];
    return s;
  }
  const bt = (t) => h('span', { class: 'bt', text: t });

  /* ---------- dates (list date, stored as YYYY-MM-DD) ---------- */
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const dateKey = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const todayKey = () => dateKey(new Date());
  const parseKey = (k) => { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  function dayDiff(k) { return Math.round((parseKey(k) - parseKey(todayKey())) / 86400000); }
  function longDate(k) {
    const n = dayDiff(k);
    const base = parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    if (n === 0) return 'Today · ' + base;
    if (n === 1) return 'Tomorrow · ' + base;
    if (n === -1) return 'Yesterday · ' + base;
    return base;
  }
  function shortDate(k) {
    const d = parseKey(k);
    const o = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = '2-digit';
    return d.toLocaleDateString(undefined, o);
  }

  /* ---------- data ---------- */
  const DEFAULT_TAG = 'Groceries';
  const cleanTag = (v) => (typeof v === 'string' && v.trim() ? v.trim().slice(0, 30) : DEFAULT_TAG);
  const mkItem = (text, done) => ({ id: uid(), text: text, done: !!done });

  function seed() {
    const mk = (name, items) => ({ id: uid(), name: name, sample: true, tag: DEFAULT_TAG, items: items.map((p) => mkItem(p[0], p[1])) });
    const lists = [
      mk('Braai on Saturday', [
        ['Boerewors, 2 kg', true], ['Charcoal and firelighters', true], ['Mielies for the coals', false],
        ['Pap and chakalaka', false], ['Chill the drinks', false], ['Scrub the grid', false]
      ]),
      mk('Moving day', [
        ['Book the bakkie', true], ['Pack the kitchen last', false], ['Move the electricity account', false],
        ['Redirect the post', false], ['Hand the keys to the landlord', false]
      ])
    ];
    return { lists: lists, activeId: lists[0].id };
  }

  function clean(d) {
    if (!d || !Array.isArray(d.lists)) return null;
    const lists = d.lists.slice(0, 100)
      .filter((l) => l && typeof l.name === 'string' && Array.isArray(l.items))
      .map((l) => ({
        id: String(l.id || uid()),
        name: l.name.slice(0, 60) || 'Untitled list',
        sample: !!l.sample,
        tag: cleanTag(l.tag),
        date: typeof l.date === 'string' && DATE_RE.test(l.date) ? l.date : '',
        items: l.items
          .filter((i) => i && typeof i.text === 'string' && i.text.trim())
          .slice(0, 2000)
          .map((i) => ({ id: String(i.id || uid()), text: i.text.slice(0, 300), done: !!i.done }))
      }));
    if (!lists.length) return null;
    return { lists: lists, activeId: lists.some((l) => l.id === d.activeId) ? d.activeId : lists[0].id };
  }

  /* ---------- storage: this browser (a cache) and your JoolzApp account (the real copy) ---------- */
  let storageOk = true;
  try { localStorage.setItem(KEY + '.t', '1'); localStorage.removeItem(KEY + '.t'); } catch (e) { storageOk = false; }

  let state = (function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const c = clean(JSON.parse(raw)); if (c) return c; }
    } catch (e) { /* fall through to sample data */ }
    return seed();
  })();

  const ui = {
    filter: 'all', reorder: false, editingId: null, renaming: false, confirmDelete: false,
    pop: null, focusKeys: null, deleting: false, sel: new Set(), menuOpen: false
  };
  const sync = { on: false, timer: null, status: '' };

  const active = () => state.lists.find((l) => l.id === state.activeId) || state.lists[0];

  function ensureActive() {
    if (!state.lists.length) state.lists.push({ id: uid(), name: 'My list', sample: false, tag: DEFAULT_TAG, items: [] });
    if (!state.lists.some((l) => l.id === state.activeId)) state.activeId = state.lists[0].id;
  }

  const tok = () => { try { return sessionStorage.getItem('gd.token') || localStorage.getItem('gd.token') || ''; } catch (e) { return ''; } };
  function api(path, opts) {
    opts = opts || {};
    const hd = { 'content-type': 'application/json' }; if (tok()) hd['x-gd-token'] = tok();
    return fetch(path, { method: opts.method || 'GET', headers: hd, body: opts.body, cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401 || r.status === 403) { location.reload(); throw new Error('signed out'); }
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.message || 'Request failed'); return j; });
    });
  }
  function setSync(s) {
    sync.status = s;
    $('foot').textContent = !sync.on
      ? (storageOk ? 'Lists are saved in this browser only.' : 'Saving is switched off in this view, so lists are lost when the page closes.')
      : (s === 'saving' ? 'Saving to your JoolzApp account…' : s === 'error' ? 'Could not reach your account. Changes are kept on this device and will save when it is back.' : 'Saved to your JoolzApp account. Your lists follow you to every device.');
  }
  function pushNow() {
    clearTimeout(sync.timer); sync.timer = null;
    if (!sync.on) return Promise.resolve();
    setSync('saving');
    return api('api/state', { method: 'PUT', body: JSON.stringify({ lists: state.lists, activeId: state.activeId }) })
      .then(function () { setSync('saved'); }).catch(function () { setSync('error'); });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ lists: state.lists, activeId: state.activeId })); } catch (e) { /* storage unavailable */ }
    if (sync.on) { clearTimeout(sync.timer); sync.timer = setTimeout(pushNow, 600); }
  }
  window.addEventListener('pagehide', function () {
    if (sync.on && sync.timer) pushNow();
  });

  /* ---------- toast ---------- */
  let toastTimer = null;
  let toastHasUndo = false;
  function showToast(msg, undo) {
    $('toast-msg').textContent = msg;
    const b = $('toast-undo');
    b.hidden = !undo;
    b.onclick = undo || null;
    toastHasUndo = !!undo;
    $('toast-wrap').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast-wrap').hidden = true; toastHasUndo = false; }, undo ? 6000 : Math.max(2200, msg.length * 60));
  }
  function hideToast(onlyUndo) {
    if (onlyUndo && !toastHasUndo) return;
    clearTimeout(toastTimer);
    $('toast-wrap').hidden = true;
    toastHasUndo = false;
  }

  /* ---------- state changes ---------- */
  function mutate(fn, undoMsg) {
    const prev = JSON.stringify({ lists: state.lists, activeId: state.activeId });
    fn();
    ensureActive();
    save();
    renderAll();
    if (undoMsg) {
      showToast(undoMsg, function () {
        const p = JSON.parse(prev);
        state.lists = p.lists;
        state.activeId = p.activeId;
        ensureActive();
        save();
        renderAll();
        hideToast();
      });
    } else {
      hideToast(true);
    }
  }

  function selectList(id) {
    state.activeId = id;
    ui.editingId = null; ui.renaming = false; ui.confirmDelete = false; ui.reorder = false;
    ui.deleting = false; ui.sel = new Set(); ui.menuOpen = false;
    save();
    renderAll();
  }

  /* ---------- swipe left to reveal delete ---------- */
  const SWIPE_W = 88;
  let openSwipe = null;
  function setSwipe(s, open) {
    s.fg.style.transform = open ? 'translateX(' + (-SWIPE_W) + 'px)' : '';
    s.fg.classList.toggle('open', open);
    if (open) { s.act.removeAttribute('tabindex'); s.act.removeAttribute('aria-hidden'); }
    else { s.act.setAttribute('tabindex', '-1'); s.act.setAttribute('aria-hidden', 'true'); }
    openSwipe = open ? s : (openSwipe === s ? null : openSwipe);
  }
  function closeSwipe() { if (openSwipe) setSwipe(openSwipe, false); }

  function makeSwipe(host, fg, onDelete, label) {
    host.classList.add('swipe');
    const act = h('button', {
      type: 'button', class: 'swipe-act', tabindex: '-1', 'aria-hidden': 'true', 'aria-label': label,
      onclick: function (e) { e.stopPropagation(); e.preventDefault(); closeSwipe(); onDelete(); }
    }, icon('trash'));
    host.insertBefore(act, fg);
    const s = { fg: fg, act: act };

    let sx = 0, sy = 0, base = 0, cur = 0, pid = null, tracking = false, horiz = false, decided = false, lastDrag = 0;
    fg.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest && e.target.closest('input[type="text"]')) return;
      if (openSwipe && openSwipe !== s) closeSwipe();
      sx = e.clientX; sy = e.clientY; pid = e.pointerId;
      base = fg.classList.contains('open') ? -SWIPE_W : 0; cur = base;
      tracking = true; decided = false; horiz = false;
    });
    fg.addEventListener('pointermove', function (e) {
      if (!tracking || e.pointerId !== pid) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!decided) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true;
        horiz = Math.abs(dx) > Math.abs(dy);
        if (!horiz) { tracking = false; return; }
        try { fg.setPointerCapture(pid); } catch (err) { /* ignore */ }
        fg.classList.add('drag');
      }
      cur = Math.max(-SWIPE_W * 1.25, Math.min(0, base + dx));
      fg.style.transform = 'translateX(' + cur + 'px)';
    });
    function finish(e) {
      if (!tracking || e.pointerId !== pid) return;
      tracking = false;
      fg.classList.remove('drag');
      if (!horiz) return;
      lastDrag = Date.now();
      setSwipe(s, cur < -SWIPE_W * 0.45);
    }
    fg.addEventListener('pointerup', finish);
    fg.addEventListener('pointercancel', finish);
    fg.addEventListener('click', function (e) {
      if (Date.now() - lastDrag < 400) { e.preventDefault(); e.stopPropagation(); return; }
      if (fg.classList.contains('open')) { e.preventDefault(); e.stopPropagation(); closeSwipe(); }
    }, true);
    return s;
  }
  document.addEventListener('pointerdown', function (e) {
    if (openSwipe && !openSwipe.fg.parentNode.contains(e.target)) closeSwipe();
  });

  /* ---------- rendering ---------- */
  function renderTotals() {
    const items = state.lists.reduce((s, l) => s + l.items.length, 0);
    const done = state.lists.reduce((s, l) => s + l.items.filter((i) => i.done).length, 0);
    $('totals').textContent = plural(state.lists.length, 'list') + ' · ' + plural(items, 'item') + ' · ' + done + ' done';
  }

  function renderTabs() {
    const box = $('picker');
    box.replaceChildren();
    if (openSwipe && !openSwipe.fg.isConnected) openSwipe = null;
    const l = active();
    const d = l.items.filter((i) => i.done).length;
    box.appendChild(h('button', {
      type: 'button', class: 'btn picker-btn', id: 'list-btn', 'aria-haspopup': 'listbox',
      'aria-expanded': String(ui.menuOpen), 'aria-label': 'Choose list. Current list: ' + l.name,
      onclick: function (e) { e.stopPropagation(); ui.menuOpen = !ui.menuOpen; renderTabs(); }
    }, icon('list'), h('span', { class: 'picker-name', text: l.name }),
       h('span', { class: 'mono n', text: d + '/' + l.items.length }), icon(ui.menuOpen ? 'up' : 'down')));
    if (ui.menuOpen) {
      const ul = h('ul', { class: 'menu', role: 'listbox', 'aria-label': 'Lists' });
      state.lists.forEach(function (x) {
        const on = x.id === state.activeId;
        const dn = x.items.filter((i) => i.done).length;
        const fg = h('div', { class: 'swipe-fg' }, h('button', {
          type: 'button', role: 'option', class: 'menu-item' + (on ? ' on' : ''), 'aria-selected': String(on),
          onclick: function (e) { e.stopPropagation(); selectList(x.id); }
        }, h('span', { class: 'picker-name', text: x.name }),
           x.date ? h('span', { class: 'mono n', text: shortDate(x.date) }) : null,
           h('span', { class: 'mono n', text: dn + '/' + x.items.length }),
           on ? icon('check') : null));
        const row = h('li', { role: 'presentation', class: 'menu-row' }, fg);
        makeSwipe(row, fg, function () {
          if (x.id === state.activeId) {
            ui.editingId = null; ui.renaming = false; ui.confirmDelete = false; ui.reorder = false;
            ui.deleting = false; ui.sel = new Set();
          }
          mutate(function () { state.lists = state.lists.filter((y) => y.id !== x.id); }, 'Deleted “' + clip(x.name, 28) + '”');
        }, 'Delete list “' + clip(x.name, 40) + '”');
        ul.appendChild(row);
      });
      box.appendChild(ul);
    }
  }

  function renderHead() {
    const l = active();
    const slot = $('title-slot');
    const act = $('head-actions');
    slot.replaceChildren();
    act.replaceChildren();

    if (ui.renaming) {
      const input = h('input', { type: 'text', id: 'rename-input', value: l.name, maxlength: '60', 'aria-label': 'List name', autocomplete: 'off', enterkeyhint: 'done' });
      const form = h('form', { class: 'rename' }, input,
        h('button', { class: 'btn primary sm ico', type: 'submit', icon: 'check', label: 'Save name' }, bt('Save')),
        h('button', { class: 'btn sm ico', type: 'button', icon: 'x', label: 'Cancel', onclick: function () { ui.renaming = false; renderHead(); } }, bt('Cancel')));
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const v = input.value.trim().slice(0, 60);
        ui.renaming = false;
        if (v && v !== l.name) mutate(function () { l.name = v; l.sample = false; });
        else renderHead();
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { ui.renaming = false; renderHead(); } });
      slot.appendChild(form);
      requestAnimationFrame(function () { input.focus(); input.select(); });
      return;
    }

    slot.appendChild(h('h2', { text: l.name }));
    if (l.sample) slot.appendChild(h('span', { class: 'badge', text: 'Sample' }));

    if (ui.confirmDelete) {
      act.appendChild(h('div', { class: 'confirm' },
        h('span', { text: l.items.length ? 'Delete this list and its ' + plural(l.items.length, 'item') + '?' : 'Delete this list?' }),
        h('button', {
          type: 'button', class: 'btn danger sm ico', icon: 'trash', label: 'Confirm delete',
          onclick: function () {
            ui.confirmDelete = false;
            mutate(function () { state.lists = state.lists.filter((x) => x.id !== l.id); }, 'Deleted “' + clip(l.name, 28) + '”');
          }
        }, bt('Delete')),
        h('button', { type: 'button', class: 'btn sm ico', icon: 'x', label: 'Keep list', onclick: function () { ui.confirmDelete = false; renderHead(); } }, bt('Keep'))));
    } else {
      act.appendChild(h('button', { type: 'button', class: 'btn quiet sm ico', icon: 'edit', label: 'Rename list', onclick: function () { ui.renaming = true; renderHead(); } }, bt('Rename')));
      act.appendChild(h('button', { type: 'button', class: 'btn quiet sm ico', icon: 'trash', label: 'Delete list', onclick: function () { ui.confirmDelete = true; renderHead(); } }, bt('Delete')));
    }
  }

  function renderDate() {
    const l = active();
    const box = $('date-row');
    box.replaceChildren();
    const input = h('input', { type: 'date', class: 'date-in', 'aria-label': 'List date', value: l.date || '' });
    input.addEventListener('change', function () {
      const v = DATE_RE.test(input.value) ? input.value : '';
      if (v !== (l.date || '')) mutate(function () { l.date = v; l.sample = false; });
    });
    box.appendChild(h('label', { class: 'datechip' + (l.date ? '' : ' empty') }, icon('calendar'), l.date ? h('span', { text: longDate(l.date) }) : null, input));
    const tagIn = h('input', { type: 'text', list: 'tag-options', value: l.tag || DEFAULT_TAG, maxlength: '30', 'aria-label': 'List tag', autocomplete: 'off', enterkeyhint: 'done' });
    tagIn.addEventListener('change', function () {
      const v = cleanTag(tagIn.value);
      tagIn.value = v;
      if (v !== l.tag) mutate(function () { l.tag = v; l.sample = false; });
    });
    box.appendChild(h('label', { class: 'tagchip', title: 'Tag, used to group lists for analysis' }, icon('tag'), tagIn));
    if (l.date) {
      box.appendChild(h('button', { type: 'button', class: 'btn quiet sm ico', icon: 'x', label: 'Clear date', onclick: function () { mutate(function () { l.date = ''; }); } }, bt('Clear')));
    }
  }

  function renderProgress() {
    const l = active();
    const t = l.items.length;
    const d = l.items.filter((i) => i.done).length;
    const pct = t ? Math.round((d / t) * 100) : 0;
    const box = $('progress');
    box.replaceChildren();
    let vis;
    if (t === 0) {
      vis = h('div', { class: 'strip' }, h('i'));
    } else if (t <= 40) {
      vis = h('div', { class: 'strip' });
      for (let i = 0; i < t; i++) vis.appendChild(h('i', { class: i < d ? 'on' : null }));
    } else {
      const b = h('b');
      b.style.width = pct + '%';
      vis = h('div', { class: 'bar' }, b);
    }
    vis.setAttribute('role', 'img');
    vis.setAttribute('aria-label', d + ' of ' + t + ' done');
    box.appendChild(vis);
    box.appendChild(h('div', { class: 'prog-text' },
      h('span', { text: t === 0 ? 'No items yet' : (d === t ? 'All done' : d + ' of ' + t + ' done') }),
      h('span', { class: 'mono', text: pct + '%' })));
  }

  function renderFilters() {
    const l = active();
    const all = l.items.length;
    const done = l.items.filter((i) => i.done).length;
    const box = $('filters');
    box.replaceChildren();
    [['all', 'All', all, 'list'], ['open', 'Open', all - done, 'circle'], ['done', 'Done', done, 'checkcircle']].forEach(function (f) {
      box.appendChild(h('button', {
        type: 'button', label: f[1] + ' (' + f[2] + ')', icon: f[3], 'aria-pressed': String(ui.filter === f[0]),
        onclick: function () {
          ui.filter = f[0];
          if (f[0] !== 'all') ui.reorder = false;
          ui.editingId = null;
          renderFilters(); renderTools(); renderItems();
        }
      }, bt(f[1]), h('span', { class: 'mono n', text: String(f[2]) })));
    });
  }

  const shown = (l) => l.items.filter((i) => ui.filter === 'all' || (ui.filter === 'open' ? !i.done : i.done));

  function enterDelete() {
    ui.deleting = true; ui.sel = new Set(); ui.reorder = false; ui.editingId = null;
    renderTools(); renderDeletePanel(); renderItems();
  }
  function exitDelete() {
    ui.deleting = false; ui.sel = new Set();
    renderTools(); renderDeletePanel(); renderItems();
  }

  function renderTools() {
    const l = active();
    const done = l.items.filter((i) => i.done).length;
    const box = $('tools');
    box.replaceChildren();
    if (ui.deleting) {
      const vis = shown(l);
      const all = vis.length > 0 && vis.every((i) => ui.sel.has(i.id));
      box.appendChild(h('button', {
        type: 'button', class: 'btn quiet sm ico', 'aria-pressed': String(all), icon: 'selectall',
        label: all ? 'Clear selection' : 'Select all shown',
        onclick: function () {
          vis.forEach((i) => { if (all) ui.sel.delete(i.id); else ui.sel.add(i.id); });
          renderTools(); renderDeletePanel(); renderItems();
        }
      }, bt(all ? 'Clear' : 'Select all')));
      return;
    }
    if (l.items.length > 1 && ui.filter === 'all') {
      box.appendChild(h('button', {
        type: 'button', class: 'btn quiet sm ico', 'aria-pressed': String(ui.reorder),
        icon: ui.reorder ? 'check' : 'reorder', label: ui.reorder ? 'Finish reordering' : 'Reorder',
        onclick: function () { ui.reorder = !ui.reorder; ui.editingId = null; renderTools(); renderItems(); }
      }, bt(ui.reorder ? 'Done' : 'Reorder')));
    }
    if (done) {
      box.appendChild(h('button', {
        type: 'button', class: 'btn quiet sm ico', icon: 'uncheck', label: 'Uncheck all',
        onclick: function () { mutate(function () { l.items.forEach((i) => { i.done = false; }); }, 'Unchecked ' + plural(done, 'item')); }
      }, bt('Uncheck all')));
    }
    if (l.items.length) {
      box.appendChild(h('button', { type: 'button', class: 'btn quiet sm ico', icon: 'trash', label: 'Choose items to delete', onclick: enterDelete }, bt('Select')));
    }
  }

  function renderDeletePanel() {
    const box = $('delete-panel');
    box.replaceChildren();
    if (!ui.deleting) { box.hidden = true; return; }
    const l = active();
    const picked = l.items.filter((i) => ui.sel.has(i.id));
    box.hidden = false;
    box.appendChild(h('p', { class: 'dp-title', text: picked.length ? 'Delete ' + plural(picked.length, 'item') + '?' : 'Tick the items you want to delete.' }));
    if (picked.length) {
      const ul = h('ul', { class: 'dp-list' });
      picked.forEach((i) => ul.appendChild(h('li', { text: clip(i.text, 80) })));
      box.appendChild(ul);
    }
    box.appendChild(h('div', { class: 'actions' },
      h('button', {
        type: 'button', class: 'btn danger sm ico', icon: 'trash', disabled: !picked.length,
        label: picked.length ? 'Delete ' + plural(picked.length, 'selected item') : 'Delete',
        onclick: function () {
          const ids = new Set(picked.map((i) => i.id));
          ui.deleting = false; ui.sel = new Set();
          mutate(function () { l.items = l.items.filter((i) => !ids.has(i.id)); }, 'Deleted ' + plural(ids.size, 'item'));
        }
      }, h('span', { class: 'n', text: picked.length ? String(picked.length) : '' })),
      h('button', { type: 'button', class: 'btn sm ico', icon: 'x', label: 'Cancel', onclick: exitDelete }, bt('Cancel'))));
  }

  function itemEl(l, it, idx, count) {
    const li = h('li', { class: 'item' + (it.done ? ' done' : '') });

    if (ui.editingId === it.id) {
      const input = h('input', { type: 'text', value: it.text, maxlength: '300', 'aria-label': 'Edit item', autocomplete: 'off', enterkeyhint: 'done' });
      let finished = false;
      const finish = function (keep) {
        if (finished) return;
        finished = true;
        const v = input.value.trim().slice(0, 300);
        ui.editingId = null;
        if (keep && v && v !== it.text) mutate(function () { it.text = v; });
        else renderItems();
      };
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { finish(false); }
      });
      input.addEventListener('blur', function () { finish(true); });
      li.appendChild(h('div', { class: 'row-main' }, input));
      requestAnimationFrame(function () { input.focus(); input.select(); });
      return li;
    }

    if (ui.deleting) {
      const sc = h('input', { type: 'checkbox', class: 'chk sel', id: 'c-' + it.id, 'data-k': 'chk-' + it.id });
      sc.checked = ui.sel.has(it.id);
      li.classList.toggle('picked', sc.checked);
      sc.addEventListener('change', function () {
        if (sc.checked) ui.sel.add(it.id); else ui.sel.delete(it.id);
        li.classList.toggle('picked', sc.checked);
        renderDeletePanel(); renderTools();
      });
      li.appendChild(h('label', { class: 'row-main', for: 'c-' + it.id }, sc, h('span', { class: 'txt', text: it.text })));
      return li;
    }

    const cb = h('input', { type: 'checkbox', class: 'chk', id: 'c-' + it.id, 'data-k': 'chk-' + it.id });
    cb.checked = it.done;
    if (ui.pop === it.id) { cb.classList.add('pop'); ui.pop = null; }
    cb.addEventListener('change', function () {
      ui.pop = it.id;
      ui.focusKeys = ['chk-' + it.id];
      mutate(function () { it.done = cb.checked; });
    });
    const fg = h('div', { class: 'swipe-fg' });
    li.appendChild(fg);
    fg.appendChild(h('label', { class: 'row-main', for: 'c-' + it.id }, cb, h('span', { class: 'txt', text: it.text })));

    const label = clip(it.text, 40);
    if (!(ui.reorder && ui.filter === 'all')) {
      makeSwipe(li, fg, function () {
        mutate(function () { l.items = l.items.filter((x) => x.id !== it.id); }, 'Deleted “' + clip(it.text, 28) + '”');
      }, 'Delete “' + label + '”');
    } else {
      li.classList.add('swipe');
    }
    if (ui.reorder && ui.filter === 'all') {
      const move = function (dir) {
        ui.focusKeys = [(dir < 0 ? 'up-' : 'down-') + it.id, (dir < 0 ? 'down-' : 'up-') + it.id];
        mutate(function () {
          const a = l.items;
          const i = a.indexOf(it);
          const j = i + dir;
          if (j < 0 || j >= a.length) return;
          a.splice(i, 1);
          a.splice(j, 0, it);
        });
      };
      fg.appendChild(h('button', { type: 'button', class: 'ib', 'data-k': 'up-' + it.id, 'aria-label': 'Move “' + label + '” up', disabled: idx === 0, onclick: function () { move(-1); } }, icon('up')));
      fg.appendChild(h('button', { type: 'button', class: 'ib', 'data-k': 'down-' + it.id, 'aria-label': 'Move “' + label + '” down', disabled: idx === count - 1, onclick: function () { move(1); } }, icon('down')));
    } else {
      fg.appendChild(h('button', { type: 'button', class: 'ib', 'aria-label': 'Edit “' + label + '”', onclick: function () { ui.editingId = it.id; renderItems(); } }, icon('edit')));
    }
    return li;
  }

  function renderItems() {
    const l = active();
    const ul = $('items');
    openSwipe = null;
    ul.replaceChildren();
    const list = shown(l);
    list.forEach(function (it, idx) { ul.appendChild(itemEl(l, it, idx, list.length)); });
    const e = $('empty');
    if (!list.length) {
      e.hidden = false;
      e.textContent = l.items.length
        ? (ui.filter === 'open' ? 'Everything is checked off.' : 'Nothing is checked off yet.')
        : 'This list is empty. Add an item above.';
    } else {
      e.hidden = true;
    }
    if (ui.focusKeys) {
      for (let i = 0; i < ui.focusKeys.length; i++) {
        const el = ul.querySelector('[data-k="' + ui.focusKeys[i] + '"]');
        if (el && !el.disabled) { el.focus(); break; }
      }
      ui.focusKeys = null;
    }
  }

  /* ---------- copy for Reminders ---------- */
  function renderExport() {
    const open = active().items.filter((i) => !i.done);
    $('export-meta').textContent = plural(open.length, 'open item');
    const a = $('save-btn');
    const lab = open.length ? 'Copy ' + plural(open.length, 'open item') : 'Copy open items';
    a.querySelector('.n').textContent = open.length ? String(open.length) : '';
    a.setAttribute('aria-label', lab);
    a.setAttribute('title', lab);
    a.disabled = !open.length;
  }

  function copyText(text) {
    let ok = false;
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (!ok) { try { navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; } }
    return ok;
  }

  function renderAll() {
    renderTotals();
    renderTabs();
    renderHead();
    renderDate();
    renderProgress();
    renderFilters();
    renderTools();
    renderDeletePanel();
    renderItems();
    renderExport();
  }

  /* ---------- wiring ---------- */
  $('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const input = $('add-input');
    const v = input.value.trim().slice(0, 300);
    if (!v) return;
    const l = active();
    if (ui.filter === 'done') { ui.filter = 'all'; }
    mutate(function () { l.items.push(mkItem(v, false)); });
    input.value = '';
    input.focus();
  });

  /* ---------- add items from a photo ---------- */
  function downscale(file) {
    return new Promise(function (ok, bad) {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok({ type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('Could not open that photo.')); };
      img.src = url;
    });
  }
  function closeReadPanel() { const rp = $('read-panel'); rp.hidden = true; rp.textContent = ''; }
  function showReadResult(items) {
    const rp = $('read-panel'); rp.textContent = ''; rp.hidden = false;
    if (!items.length) {
      rp.appendChild(h('p', { text: 'No list items found in that photo. Try a closer, well-lit shot.' }));
      rp.appendChild(h('div', { class: 'rp-actions' }, h('button', { type: 'button', class: 'btn sm ico', icon: 'x', label: 'Close', onclick: closeReadPanel }, bt('Close'))));
      return;
    }
    const boxes = [];
    rp.appendChild(h('p', { text: 'Found ' + items.length + (items.length === 1 ? ' item' : ' items') + '. Untick any you do not want.' }));
    items.forEach(function (txt, i) {
      const cb = h('input', { type: 'checkbox', id: 'rp-' + i, checked: true });
      cb.checked = true; boxes.push(cb);
      rp.appendChild(h('label', { class: 'rp-row', for: 'rp-' + i }, cb, h('span', { text: txt })));
    });
    const addBtn = h('button', { type: 'button', class: 'btn primary sm ico', icon: 'check', label: 'Add selected items', onclick: function () {
      const picked = items.filter(function (_, i) { return boxes[i].checked; });
      closeReadPanel();
      if (!picked.length) return;
      const l = active();
      if (ui.filter === 'done') ui.filter = 'all';
      mutate(function () { picked.forEach(function (v) { l.items.push(mkItem(v, false)); }); });
      showToast('Added ' + picked.length + (picked.length === 1 ? ' item' : ' items') + '.');
    } }, bt('Add selected'));
    rp.appendChild(h('div', { class: 'rp-actions' }, addBtn, h('button', { type: 'button', class: 'btn sm ico', icon: 'x', label: 'Cancel', onclick: closeReadPanel }, bt('Cancel'))));
  }
  $('photo-btn').addEventListener('click', function () {
    if (!sync.on) { showToast('Reading a photo needs you to be signed in.'); return; }
    $('photo-input').click();
  });
  $('photo-input').addEventListener('change', function () {
    const f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    const rp = $('read-panel'); rp.hidden = false; rp.textContent = 'Reading your photo…';
    downscale(f).then(function (im) { return api('api/extract', { method: 'POST', body: JSON.stringify({ images: [im] }) }); })
      .then(function (j) { showReadResult(j.items || []); })
      .catch(function (e) { closeReadPanel(); showToast(e.message || 'Could not read that photo.'); });
  });

  $('new-list-btn').addEventListener('click', function () {
    ui.menuOpen = false; renderTabs();
    $('new-list-form').hidden = false;
    $('new-list-name').focus();
  });
  function closeNewList() { $('new-list-form').hidden = true; $('new-list-name').value = ''; }
  $('new-list-cancel').addEventListener('click', closeNewList);
  $('new-list-name').addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNewList(); });
  $('new-list-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = $('new-list-name').value.trim().slice(0, 60) || 'New list';
    const l = { id: uid(), name: name, sample: false, tag: DEFAULT_TAG, date: todayKey(), items: [] };
    closeNewList();
    ui.editingId = null; ui.renaming = false; ui.confirmDelete = false; ui.reorder = false; ui.filter = 'all';
    ui.deleting = false; ui.sel = new Set(); ui.menuOpen = false;
    mutate(function () { state.lists.push(l); state.activeId = l.id; });
    $('add-input').focus();
  });

  let copiedTimer = null;
  $('save-btn').addEventListener('click', function () {
    const open = active().items.filter((i) => !i.done);
    if (!open.length) { showToast('No open items to copy'); return; }
    if (copyText(open.map((i) => i.text).join('\n'))) {
      const btn = $('save-btn');
      const old = btn.querySelector('svg');
      if (old) old.replaceWith(icon('check'));
      clearTimeout(copiedTimer);
      copiedTimer = setTimeout(function () { const s = btn.querySelector('svg'); if (s) s.replaceWith(icon('copy')); }, 3000);
      showToast('Copied ' + plural(open.length, 'item') + '. Now run Save to Shopping.');
    } else {
      showToast('Could not copy automatically. Select the items and copy them yourself.');
    }
  });

  document.addEventListener('click', function (e) {
    if (ui.menuOpen && !$('picker').contains(e.target)) { ui.menuOpen = false; renderTabs(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.menuOpen) { ui.menuOpen = false; renderTabs(); $('list-btn').focus(); }
  });
  document.querySelectorAll('[data-icon]').forEach((el) => el.prepend(icon(el.dataset.icon)));

  /* ---------- account: sign-out, JoolzApp dashboard, and loading your saved lists ---------- */
  function signOut() {
    try { localStorage.removeItem('gd.token'); sessionStorage.removeItem('gd.token'); } catch (e) {}
    fetch('api/account/logout', { method: 'POST' }).catch(function () {}).then(function () { location.reload(); });
  }
  function openDashboard(base) {
    base = (base || (location.protocol + '//' + location.hostname + ':3892/')).replace(/\/+$/, '') + '/';
    location.href = base + (tok() ? '#sso=' + encodeURIComponent(tok()) : '');
  }

  ensureActive();
  renderAll();
  setSync('');

  fetch('api/app-config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg.accounts) return;     // no accounts: lists stay in this browser
    sync.on = true;
    $('out-btn').hidden = false; $('out-btn').onclick = signOut;
    $('dash-btn').hidden = false; $('dash-btn').onclick = function () { openDashboard(cfg.portalUrl); };
    setSync('saving');
    return api('api/state').then(function (j) {
      const server = clean(j.state);
      if (server) {          // your account has lists: they win over what this browser had
        state = server; ensureActive();
        try { localStorage.setItem(KEY, JSON.stringify({ lists: state.lists, activeId: state.activeId })); } catch (e) {}
        renderAll(); setSync('saved');
      } else {               // first time on this account: keep this browser's lists and save them
        pushNow();
      }
    }).catch(function () { setSync('error'); });
  }).catch(function () { /* offline: keep working from this browser */ });
})();
</script>
</body></html>
