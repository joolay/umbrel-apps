<!doctype html>
<html lang="en">
<head>

<title>Gym Guru</title>
<meta name="theme-color" content="#be123c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Guru">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="glass.css">

<style>
/* Brand tokens only (see templates/glass/README.md) */
:root{--accent:#be123c;--accent-2:#f97316;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#f97316;--accent-2:#fdba74;--accent-t:#2b0a12}}
:root[data-theme="dark"]{--accent:#f97316;--accent-2:#fdba74;--accent-t:#2b0a12}
</style>
<script src="theme-global.js"></script>
</head>
<body>
<main class="jz-card" id="card">
  <img class="jz-logo" src="icon.svg" alt="">
  <h1>Gym Guru</h1>
  <p class="jz-sub" id="sub">Sign in with your JoolzApp account</p>
  <div id="view"></div>
</main>
<script src="pwtoggle.js"></script>
<script src="quick-ui.js"></script>
<script src="gate.js"></script>
<script>
JZGate({ app: "gym-guru", name: "Gym Guru", tokenKey: "gd.token", tokenHeader: "x-gd-token", clear: ["gg_prefs"], tagline: "Your camera counts your reps" });
</script>
</body>
