port: 3893
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Stays signed in: Remember me now starts ticked (so an installed app keeps you signed in), and signing in from the dashboard is kept on this device. Added Continue with Google on the sign-in screen (public address only).
