manifestVersion: 1
id: joolay-diner-bell
category: files
name: Diner Bell
version: "2.2.0"
tagline: Tile your favourite restaurants, order by phone or WhatsApp, split the bill
description: >-
  Diner Bell reads a restaurant menu from a photo, PDF, link or pasted text, lets you build an order from one or more
  restaurants with special instructions, adds a tip, splits the bill equally or by item, and gives you the
  restaurant's phone number with a tap-to-call link. Sign in with your JoolzApp account; your saved menus follow you across devices.
