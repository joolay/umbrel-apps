gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "GrubToGo is now Diner Bell. Restaurants are picture tiles you can search, reorder and edit; choose Collection, Delivery or Sit Down; call or send the order on WhatsApp; backdate orders; and your settings now live on your JoolzApp account. Install this as a new app and remove the old GrubToGo."
