# Stremio runs here as an Umbrel app: the community image (https://github.com/tsaridas/stremio-docker), unmodified, behind a small
# JoolzApp sign-in gate (src/stremio, built by .github/workflows/build-images.yml). Keep the gate image tag equal to `version` in umbrel-app.yml.
# `web` is the gate: it checks the person's JoolzApp account (and Portal Admin access) and then proxies to the `stremio` service.
# Sign-in settings go in <app data>/data/pocketbase.env (POCKETBASE_SUPERUSER_EMAIL, POCKETBASE_SUPERUSER_PASSWORD; POCKETBASE_URL defaults to http://host.docker.internal:5400), never in this public repo.
# Without them the gate refuses to serve anything (fails closed).
# Stremio's own config and cache live in <app data>/stremio and survive updates.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-stremio_web_1
      APP_PORT: 3897
      # No Umbrel login for this app: it locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/stremio:1.0.1
    restart: on-failure
    depends_on:
      - stremio
    # Lets the gate reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POCKETBASE_APP_ID=stremio
      - POCKETBASE_APP_NAME=Stremio
      - UPSTREAM=http://stremio:8080
    volumes:
      - ${APP_DATA_DIR}/data:/data

  stremio:
    image: tsaridas/stremio-docker:latest
    restart: on-failure
    environment:
      # Web UI derives the streaming server URL (host:11470) from the browser's address.
      AUTO_SERVER_URL: "1"
      NO_CORS: "1"
      # Avoids SSDP errors inside Docker.
      CASTING_DISABLED: "1"
    ports:
      # Streaming server. NOT behind the sign-in gate (the browser and Stremio apps call it directly), so keep it on your home network only.
      - "11470:11470"
    volumes:
      - ${APP_DATA_DIR}/stremio:/root/.stremio-server
