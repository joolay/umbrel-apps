# Stremio runs here as an Umbrel app: the community image (https://github.com/tsaridas/stremio-docker), unmodified, behind a small
# soft-sync layer (src/stremio, built by .github/workflows/build-images.yml). Keep the `web` image tag equal to `version` in umbrel-app.yml.
# `web` NEVER gates Stremio: Umbrel's own login protects the app, and `web` only injects a script that saves the Stremio login on the
# person's JoolzApp account (pocketbase.env in <app data>/data, written by Portal Admin) and restores it when the browser forgets it.
# No PocketBase lookups sit on the proxy path, and without pocketbase.env sync is simply off.
# Stremio's own config and cache live in <app data>/stremio and survive updates.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-stremio_web_1
      APP_PORT: 3897

  web:
    image: ghcr.io/joolay/stremio:1.1.4
    restart: on-failure
    # Lets the sync layer reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POCKETBASE_APP_ID=stremio
      - POCKETBASE_APP_NAME=Stremio
      - UPSTREAM=http://stremio:8080
    volumes:
      - ${APP_DATA_DIR}/data:/data

  stremio:
    image: tsaridas/stremio-docker:latest
    restart: on-failure
    environment:
      # Web UI derives the streaming server URL (host:11470) from the browser's address.
      AUTO_SERVER_URL: "1"
      NO_CORS: "1"
      # Avoids SSDP errors inside Docker.
      CASTING_DISABLED: "1"
    ports:
      # Streaming server. NOT behind Umbrel's login (the browser and Stremio apps call it directly), so keep it on your home network only.
      - "11470:11470"
    # Intel iGPU passthrough so the streaming server can offer hardware (VAAPI) transcode profiles.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/stremio:/root/.stremio-server
