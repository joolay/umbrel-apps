# Stremio runs here as an Umbrel app: the community image (https://github.com/tsaridas/stremio-docker), unmodified.
# Umbrel's own login protects the web UI (no JoolzApp sign-in any more).
# Stremio's own config and cache live in <app data>/stremio and survive updates.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-stremio_stremio_1
      APP_PORT: 8080

  stremio:
    image: tsaridas/stremio-docker:latest
    restart: on-failure
    environment:
      # Web UI derives the streaming server URL (host:11470) from the browser's address.
      AUTO_SERVER_URL: "1"
      NO_CORS: "1"
      # Avoids SSDP errors inside Docker.
      CASTING_DISABLED: "1"
    ports:
      # Streaming server. NOT behind Umbrel's login (the browser and Stremio apps call it directly), so keep it on your home network only.
      - "11470:11470"
    # Intel iGPU passthrough so the streaming server can offer hardware (VAAPI) transcode profiles.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/stremio:/root/.stremio-server
