releaseNotes: "Changes: Quick Access is now ONE code per person (a 4 digit PIN, a 6 digit PIN or a pattern) that works on every device and app that offers it: set it once, then just turn it on for each device. In My settings you can turn it on here or change your code. Changes: applied changes now move to a collapsible Archive. Also: New: Change inbox. Claude can now send you PocketBase settings changes through your repo (portal-changes/ folder on main): they appear in Changes with a plain-English plan and you just press Apply, no new release needed. Data only (set or remove a global setting), only from your own repo, nothing happens until you apply. Also: Sharper icon: a larger glass square with no outer border. New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: You can rename the apps on your home screen (Edit, then the pencil on a tile), and sign in a TV with a QR code. Updated to Portal Admin 0.27.0."
