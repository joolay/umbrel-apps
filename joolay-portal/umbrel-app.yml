releaseNotes: "Changes: New AI tab in My settings. Save API keys from several providers (Anthropic Claude, OpenAI, Google Gemini, OpenRouter or your own local endpoint) on your JoolzApp account, test each one, pick a default key and choose a different key for any AI app (Diner Bell, Jolly Grocer, Listify, ShutterWorth, Project Tracker). Keys stay on the server; the browser only ever sees the last 4 characters. An existing single key is moved into the list automatically."
