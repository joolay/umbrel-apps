support: https://github.com/joolay/umbrel-apps/issues
port: 3885
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Changes: New Status feed card under App keys. Apps such as App Updater and Services Manager can send a cleaned status file (passwords, tokens and keys are removed) to a GitHub repo you choose, so you and Claude can see how they are doing without opening anything to the internet. Needs a GitHub token that can write to that repo."
