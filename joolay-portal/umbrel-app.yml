releaseNotes: "New change in Portal Admin > Changes: gives OpenClaw a private tailnet address (https://openclaw.<your tailnet>) through TSDProxy. The Store no longer shows an Admin folder or Admin link; it holds apps only (admins use the Portal Admin app). The top bar now stays at the top of the screen when you scroll. JoolzApp Portal is now called JoolzApp Store (same app, same address). JoolzApp apps page skips routes you ignored in Port Master."
