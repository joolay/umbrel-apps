path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: You can rename the apps on your home screen (Edit, then the pencil on a tile), and sign in a TV with a QR code. Updated to Portal Admin 0.27.0."
