gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "New: the App Store. A new tile and page list every app you can use, each with View on web and Install. Install shows the exact steps for your phone or computer (iPhone and iPad, Android, Chrome, Edge, Safari) and opens the app so you can add it to your home screen as a standalone app. Apps without a secure address say so instead of failing."
