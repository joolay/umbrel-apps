releaseNotes: "The JoolzApp Portal is now the App Store. Tap an app for View on web or Install (steps for your device: iPhone and iPad, Android, Chrome, Edge, Safari). Apps live in folders that admins arrange for everyone: long-press to edit, drag icons and folders, rename them and write descriptions. A new floating top bar has the title on the left and a light/dark theme icon on the right, saved to your account."
