releaseNotes: "The JoolzApp Store is now called the JoolzApp Dashboard, so it is clearly different from Portal Admin. Portal Admin and the Dashboard now use the one shared JoolzApp template (jz.js): Install icon and Settings gear in the top bar, the name without the icon, and the shared sync ticks. Cleanup: removed the old port 3892 redirect (old bookmarks to it stop working), the Connect to PocketBase prompts (new apps link by themselves), the Setup screen (its Sign-ups and Account approval switches moved to Global settings), and the Family tile and event ticker from Portal Admin itself (they stay on the JoolzApp Dashboard). The Rearrange pencil is gone from the top bar: press and hold a tile or icon to rearrange (as before). Account menu in the shared template: the profile icon sits at the far right of the top bar and opens a dropdown of large icons (Settings, Day/Night mode, Install only in a phone or tablet browser never in the installed app, and Log out at the bottom); Settings, theme and Install no longer sit loose in the bar. Before: Fix: Portal Admin finds Umbrel's login proxy by several container names, so the automatic admin sign-in works again after Docker renamed it. Before: Portal Admin: /config now says why the automatic admin sign-in is off (only on your home network or tailnet), to help diagnose it. Before: Fix: the home screen no longer sticks on Loading (a line from 0.39.0 was in the wrong place, so admin-only tiles broke the Store). Before: New: Changes page has a Sign in with Google card: paste the Google client ID and secret once and Portal Admin switches Google on as a sign-in provider of the JoolzApp account in PocketBase (secret goes straight to PocketBase, never stored here); the sign-in screen then shows Continue with Google (return address: your JoolzApp Dashboard address + /google-callback.html, which must be added to the Google client). Before: New: Port Master can put any installed app on the JoolzApp Dashboard (Stremio, OpenClaw and other apps that do not use the JoolzApp account) and hide it again: it makes the same tile the Apps page Add button makes. Only Port Master (through the Portal API), only for apps really installed on this Umbrel, never for your own JoolzApp apps. A tile can be admin-only: nobody else sees it on the Store. Before: Changes: New Changes-card step that queues a new JoolzApp for App Updater to install automatically; App Updater reads the queue and reports each install through the Portal API. Before: Changes: Portal Admin now keeps a change counter and a read marker in each app's status file and works out the handshake state (status/claude-<app>.json is Claude's side), and reports it back to the apps. The top bar shows the connected icon. Before: Admins now see an Admin folder in the JoolzApp Dashboard listing the owner-only apps (Port Master, Theme Editor, App Updater and the other hidden tools); nobody else gets it, and the server refuses anyone who is not an admin. New global theme: Portal Admin serves the Glass theme as /theme.css (edited in the new Theme Editor app), and apps that load theme-global.js pick it up without an update. New change in Portal Admin > Changes: gives OpenClaw a private tailnet address (https://openclaw.<your tailnet>) through TSDProxy; Services Manager (1.1.1 or newer) then restarts TSDProxy by itself 30 seconds later. The Store no longer shows an Admin folder or Admin link; it holds apps only (admins use the Portal Admin app). The top bar now stays at the top of the screen when you scroll. JoolzApp Dashboard is now called JoolzApp Dashboard (same app, same address). JoolzApp apps page skips routes you ignored in Port Master."
