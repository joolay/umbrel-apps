gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  AI keys: an admin sets one Master key (default and free trial), NVIDIA is a new provider, models are picked from the provider's own list, and a parent can share one of their keys with the whole family (family members use it instead of the free trial). New AI usage panel: your own monthly AI requests, and parents can see each family member's.
