# JoolzFlix: the web UI (mirrored from github.com/joolay/homebrew app-flix, see src/flix/README.md) plus a small profile-sync API (`web`),
# and the Stremio streaming server (`server`, the community tsaridas/stremio-docker image, unmodified). It replaces the old joolay-stremio app.
# The UI is protected by Umbrel's login (app_proxy). Ports 3901 (profile-sync API only) and 11470 (streaming server) are published on the host
# for the TV app and the Stremio apps, which cannot use that login, so keep this Umbrel on your home network only.
# Keep the `web` image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-flix_web_1
      APP_PORT: 3900

  web:
    image: ghcr.io/joolay/flix:1.0.0
    restart: on-failure
    environment:
      - PORT=3900
      - API_PORT=3901
      - DATA_DIR=/data
      # Host port the streaming server below is published on
      - TF_STREMIO_PORT=11470
    ports:
      # Profile-sync API only. NOT behind Umbrel's login (the TV app calls it directly).
      - "3901:3901"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: tsaridas/stremio-docker:latest
    restart: on-failure
    environment:
      NO_CORS: "1"
      # Avoids SSDP errors inside Docker.
      CASTING_DISABLED: "1"
    ports:
      # Streaming server. NOT behind Umbrel's login (browsers, the TV and Stremio apps call it directly).
      - "11470:11470"
    # Intel iGPU passthrough so the streaming server can offer hardware (VAAPI) transcode profiles.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/stremio:/root/.stremio-server
