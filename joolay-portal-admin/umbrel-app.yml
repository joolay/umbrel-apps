manifestVersion: 1
id: joolay-portal-admin
category: developer
name: Portal Admin
version: "0.1.2"
tagline: One admin panel for all your custom PocketBase apps
description: >-
  A central admin panel for your custom apps that use PocketBase. Register each app, then manage
  global settings, per-app settings and per-user overrides in one place, switch apps on or off or into
  maintenance mode, block individual users, and review an audit log of every change.
  Connects to the PocketBase app on your Umbrel automatically; sign in with your PocketBase superuser account. Portal Admin keeps its data in your PocketBase
  (collections portal_apps, portal_settings, portal_audit) and stores nothing else.
developer: joolay
