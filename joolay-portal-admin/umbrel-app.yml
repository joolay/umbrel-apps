releaseNotes: "Renamed JoolzApp Portal with a new twin-bolt icon. The dashboard is now an iPhone-style home screen: Settings and Family appear as app icons, the top bar stays put while you scroll, there is a dock, and you can long-press to rearrange (icons jiggle), hide or restore apps. Your layout is saved on your account. Family now means one household; extended relatives such as grandparents can be linked to any number of families, and can be moved into the household when they live with you."
