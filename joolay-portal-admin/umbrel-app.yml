releaseNotes: "Portal Admin now works out what PocketBase changes a new app needs (from the app's x-pocketbase declaration) and creates the missing collections and fields for apps from your own store; other apps' changes wait for you to approve. Nothing is ever removed. Earlier: New apps installed on your Umbrel are detected automatically: apps that use the JoolzApp account are registered for you, and others are offered under Detected on your Umbrel on the Apps page. Earlier: Admins can set a user's password directly. Public-access guard: when published through Tailscale Funnel, admin sign-in and admin API calls are refused (home network and tailnet only). Open buttons on each approved app. Earlier: Users can sign up and sign in to manage shared preferences and request access to apps; per-app approval for new accounts; access requests and account deletion requests for you to approve; remember me and forgot password."
