releaseNotes: "Sharper icon: a larger glass square with no outer border. New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: People can rename the apps on their own home screen (Edit, then the pencil on a tile); Admin > App names shows every rename and lets you reset it. Also: QR sign-in for JoolzApp accounts (an app shows a QR code, a signed-in phone approves it) and the image start-up fix."
