releaseNotes: "New: QR sign-in for JoolzApp accounts. An app (JoolzTV first) shows a QR code, a signed-in phone approves it in the Portal, and the app signs that person in; nothing secret travels to the TV. Also fixes the image start-up (appkeys.js was missing from the Docker image). Also: New: Admin > App keys. Each app that needs a private key (JoolzTV: TMDB) gets a box here; paste it once and it is stored hidden in PocketBase and never shown again. Run Changes > App keys first."
