support: https://github.com/joolay/umbrel-apps/issues
port: 3890
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Portal Admin now keeps its app list in step with your Umbrel: new joolay-* apps are registered automatically while you are signed in, plus a Sync from Umbrel button on the Apps page. Needs UMBREL_MCP_TOKEN in the app settings."
