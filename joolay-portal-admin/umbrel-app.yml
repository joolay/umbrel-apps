releaseNotes: "New: Paid apps. The admin can lock an app behind a Yoco payment (one-off or for a number of days, with an optional household price); locked apps show a padlock and the price, and unlock automatically once paid. Make your own folders on the home screen and dock, dock icons grow under the mouse, and the dashboard has an animated background you can change in My settings. You can link a spouse (invite an existing account, or create theirs; an admin approves new accounts) and name and surname are required at sign-up. The admin is now also a regular JoolzApp person with the same features as everyone else. New navy-blue app icon, Umbrel app icons on tiles, and a scrolling Upcoming ticker in the top bar."
