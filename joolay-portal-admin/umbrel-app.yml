releaseNotes: "My settings now has Profile (name, password, date of birth, parents) and Family (create, invite, immediate and extended, managers) tabs: the one place to manage your JoolzApp account for every app. One JoolzApp sign-up page for every app: ShutterWorth and GrubToGo now send people here to create an account, and bring them back when it is made. Sign-up asks for a date of birth; under-18s name a parent who already has an account and are held until the parent approves. Parents approve (and withdraw) from the Dashboard. Accounts are now created by this app's server, using the PocketBase login you connected with Connect. Prettier glass-style look across the portal and Dashboard: frosted panels, soft gradient background, rounded tiles and buttons. Light and dark."
