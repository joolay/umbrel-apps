releaseNotes: "Changes: Portal Admin is now for admin tools only. Its main screen shows the admin tools directly (no Admin folder, no apps); open your apps from the JoolzApp Portal. Its layout is saved separately, so the Portal home screen is untouched. Changes: Quick Access can now check a person's code for other apps (JoolzTV uses it so a parent can give a kid more time). Also: Quick Access is now ONE code per person (a 4 digit PIN, a 6 digit PIN or a pattern) that works on every device and app that offers it: set it once, then just turn it on for each device. In My settings you can turn it on here or change your code. Changes: applied changes now move to a collapsible Archive. Also: New: Change inbox. Claude can now send you PocketBase settings changes through your repo (portal-changes/ folder on main): they appear in Changes with a plain-English plan and you just press Apply, no new release needed. Data only (set or remove a global setting), only from your own repo, nothing happens until you apply. Also: Sharper icon: a larger glass square with no outer border. New: Quick Access. Sign in with a 4 or 6 digit PIN or a pattern on a device you already signed in on (offered at sign-up, set in My settings; JoolzTV on the TV too). JoolzTV sign-ins now last until you sign out, and an admin can sign anyone out everywhere from Admin > Users > Sign-in. Also: People can rename the apps on their own home screen (Edit, then the pencil on a tile); Admin > App names shows every rename and lets you reset it. Also: QR sign-in for JoolzApp accounts (an app shows a QR code, a signed-in phone approves it) and the image start-up fix."
submitter: joolay
