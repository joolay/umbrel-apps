# Portal Admin: central admin panel for custom apps backed by PocketBase.
# Source: src/portal-admin in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-portal-admin_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: this is an admin panel. You also sign in with a PocketBase superuser.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/portal-admin:0.1.2
    restart: on-failure
    stop_grace_period: 10s
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      # Optional: override the built-in PocketBase address (default http://host.docker.internal:5400 = the Umbrel PocketBase app).
      - PB_URL=${PB_URL:-}
      # Umbrel app sync (read-only list). Set your Umbrel MCP token here in the app's settings, never in this repo.
      - UMBREL_MCP_TOKEN=${UMBREL_MCP_TOKEN:-}
