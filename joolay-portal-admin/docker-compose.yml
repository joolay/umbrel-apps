# Portal Admin: central admin panel for custom apps backed by PocketBase.
# Source: src/portal-admin in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-portal-admin_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: this is an admin panel. You also sign in with a PocketBase superuser.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/portal-admin:0.21.10
    restart: on-failure
    stop_grace_period: 10s
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public hub (https://joolzapp.<tailnet>.ts.net via TSDProxy + Funnel, see deploy/tsdproxy). Port 3892 is the server's
    # dedicated public port: it skips Umbrel's login (still on the normal address, port 3890) and is always user-only, so
    # admin sign-in and the PocketBase admin APIs are refused there. TSDProxy reads the labels below.
    ports:
      - "3892:3001"
      # Portal API for the apps (needs an app key). Not published through the tunnel.
      - "3899:3002"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "joolzapp"
      tsdproxy.port.1: "443/https:3892/http, no_autodetect, tailscale_funnel"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Umbrel's installed-app folders: umbrel-app.yml and docker-compose.yml are read to detect new apps, and the "Connect" button
      # writes one file, <app>/data/pocketbase.env, for your own joolay-* apps (after checking a PocketBase superuser login).
      - ${UMBREL_ROOT}/app-data:/umbrel-app-data
    environment:
      # Optional: override the built-in PocketBase address (default http://host.docker.internal:5400 = the Umbrel PocketBase app).
      - PB_URL=${PB_URL:-}
