# Portal Admin: central admin panel for custom apps backed by PocketBase.
# Source: src/portal-admin in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-portal-admin_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: this is an admin panel. You also sign in with a PocketBase superuser.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/portal-admin:0.43.2
    restart: on-failure
    stop_grace_period: 10s
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Portal API for the apps and for JoolzApp Dashboard (each needs its own key). Not published through the tunnel.
      - "3899:3002"
      # Portal Admin on the tailnet: https://portaladmin.<tailnet>.ts.net (Tailscale only, never public). Sign in with an admin JoolzApp account.
      - "3909:3000"
    # The Tailscale name (and Funnel, if public) is kept by Port Master since 0.42.3 (TSDProxy tab); this app publishes its port for it.
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Umbrel's installed-app folders: umbrel-app.yml and docker-compose.yml are read to detect new apps, and Portal Admin
      # writes one file, <app>/data/pocketbase.env, for each new joolay-* app (a limited login and a Portal API key, never the superuser login).
      - ${UMBREL_ROOT}/app-data:/umbrel-app-data
      # TSDProxy's settings folder (~/tsdproxy/config, next to the Umbrel folder). Only the Changes page writes here, to publish third-party apps such as OpenClaw on the tailnet.
      - ${UMBREL_ROOT}/../tsdproxy/config:/tsdproxy-config
    environment:
      # Optional: override the built-in PocketBase address (default http://host.docker.internal:5400 = the Umbrel PocketBase app).
      - PB_URL=${PB_URL:-}
