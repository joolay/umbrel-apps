# Portal Admin: central admin panel for custom apps backed by PocketBase.
# Source: src/portal-admin in this repo (built by .github/workflows/build-images.yml).
# Keep the image tag equal to `version` in umbrel-app.yml.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-portal-admin_web_1
      APP_PORT: 3000
      # Umbrel's login stays ON: this is an admin panel. You also sign in with a PocketBase superuser.
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/joolay/portal-admin:0.5.0
    restart: on-failure
    stop_grace_period: 10s
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Direct port for the public hub (Tailscale Funnel, see deploy/joolzapp-tunnel). Umbrel's login stays on the normal
    # app address (port 3890); this port skips it, which is safe because the server itself refuses admin sign-in and
    # admin API calls for requests that arrive through Funnel.
    ports:
      - "3892:3000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      # Optional: override the built-in PocketBase address (default http://host.docker.internal:5400 = the Umbrel PocketBase app).
      - PB_URL=${PB_URL:-}
