manifestVersion: 1
id: joolay-openclaw
category: developer
name: OpenClaw
version: "2026.11.10"
tagline: The OpenClaw gateway, built from source and set up for your Tailscale addresses
description: >-
  OpenClaw's own open source gateway and Control UI (MIT licence), compiled from the upstream release tag by this store's build instead of using a ready-made image.
  It starts already set up for how you reach your Umbrel: the Tailscale name (https://openclaw.<your tailnet>, so the browser's WebSocket is wss://), the Tailscale address
  and the Umbrel's address on your home network are all allowed origins, and the gateway listens on the Docker network behind Umbrel's proxy. Tailnet only: nothing here uses
  Funnel and nothing is opened to the internet. A gateway token is made on first start and kept in the app's data folder (data/state/joolz-gateway-token); paste it into the
  Control UI to sign in. Everything OpenClaw keeps (config, sessions, workspace) lives in that data folder, so updates never reset it. Owner-only: it has no icon on the JoolzApp
  home screen; admins find it in the Admin folder.
developer: joolay
