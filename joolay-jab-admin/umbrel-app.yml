manifestVersion: 1
id: joolay-jab-admin
category: productivity
name: JAB Admin
version: "1.1.0"
tagline: People and settings for JoolzApp Biz
description: >-
  JAB Admin is the admin panel for JoolzApp Biz (JAB), the practice's private dashboard. Add and remove people, give them a role
  (Admin, Editor, Member or View-only), set or reset passwords, sign someone out everywhere and set the practice name.
  It is separate from the family Portal Admin: JAB has its own accounts and shares nothing with your JoolzApp accounts or PocketBase.
  It shares only a data folder with the JAB dashboard, so install JoolzApp Biz first. Umbrel's own login protects it.
