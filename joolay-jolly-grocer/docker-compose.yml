# Jolly Grocer runs here as a real Umbrel app. Source: src/jolly-grocer in this repo, built by .github/workflows/build-images.yml.
# Keep the image tag equal to `version` in umbrel-app.yml.
# Data lives in PocketBase (found at http://host.docker.internal:5400): lists, shops and purchases in jollygrocer_state, receipt
# photos in jollygrocer_receipts. The superuser login goes in <app data>/data/pocketbase.env, never in this public repo, or
# Portal Admin writes it when you connect PocketBase there.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-jolly-grocer_web_1
      APP_PORT: 3897
      # No Umbrel login for this app: Jolly Grocer locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/jolly-grocer:1.4.3
    restart: on-failure
    stop_grace_period: 1m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public address https://jolly-grocer.<tailnet>.ts.net via TSDProxy + Funnel (24/11/2026 decision: every app except the admin tools is public).
    # Safe to publish: the app locks itself behind the JoolzApp account. Host port 3896 gives it the LAN / Tailscale-address routes like the other apps.
    ports:
      - "3896:3897"
    # The Tailscale name is kept by Port Master since 1.4.3 (TSDProxy tab); this app publishes its port for it.
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=jolly-grocer
      - POCKETBASE_APP_NAME=Jolly Grocer
      # Refuse to show anything until PocketBase accounts are working.
      - REQUIRE_ACCOUNTS=1
