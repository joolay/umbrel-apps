manifestVersion: 1
id: joolay-jolly-grocer
category: files
name: Jolly Grocer
version: "1.0.0"
tagline: Your grocery shopping companion
description: >-
  Jolly Grocer sorts your shopping list by shop and category, remembers short shop codes, and checks each shop out with a
  receipt photo that links what you bought to your list. It learns regular purchases and their prices, suggests items for
  the next list, and breaks spending down weekly and monthly by category. Receipt photos are archived as small images in
  your PocketBase. Sign in with your JoolzApp account and everything follows you across devices.
developer: joolay
website: https://github.com/joolay/umbrel-apps/tree/main/src/jolly-grocer
dependencies: []
repo: https://github.com/joolay/umbrel-apps
support: https://github.com/joolay/umbrel-apps/issues
port: 3897
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "First release. Lists sorted by shop then category, two-capital-letter shop codes, swipe left to delete, per-shop checkout with a receipt photo, learned prices for regular items, suggestions for the next list, weekly and monthly spending analysis, personal or non-grocery items kept out of family totals, and a receipt archive in PocketBase with a rollover request after 1 to 10 years."
submitter: joolay
submission: https://github.com/joolay/umbrel-apps
icon: https://raw.githubusercontent.com/joolay/umbrel-apps/main/joolay-jolly-grocer/icon.svg
