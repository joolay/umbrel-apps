support: https://github.com/joolay/umbrel-apps/issues
port: 3897
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Changes: Photo review lets you correct item names and set a Qty, and remembers the names, shops and categories you change for the next scan. You can add a new shop or category right from any shop or category dropdown (+ New), and rename or delete shops and categories on the Shops tab. Spacing fixed. The top bar no longer shows the app icon, the JoolzApp dashboard and Sign out line is gone (Home is in the top bar, Sign out is on the Data tab), and the monthly grocery spend moved to the Data tab."
submitter: joolay
submission: https://github.com/joolay/umbrel-apps
