port: 3897
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Changes: Jolly Grocer now has a menu bar and a toolbar docked under the top bar. The menu bar has a dropdown to switch lists (with new list, new list from unbought items, rename and delete), and a weekly or monthly dropdown with earlier and later arrows on Spend. The Lists and Spend tabs moved into the toolbar."
