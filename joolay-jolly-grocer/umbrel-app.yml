port: 3897
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  AI: Settings now has a drop-down to use the Master key or one of your own keys with a model of your choice. Family members use the key a parent shares instead of the free trial. NVIDIA added. Each AI request now counts towards your monthly AI usage in Portal Admin.
