releaseNotes: "Changes: Lists are now saved by date with no list names, and each list has an optional Add tag button (for example Braai or Month-end) shown in the toolbar next to the date, and each shop section in a list has its own separate Add tag. A new search icon at the right of the toolbar finds lists by tag or date; the duplicate date heading at the top of a list is gone. Jolly Grocer now has a menu bar and a toolbar docked under the top bar. The Lists and Spend tabs are in the menu bar. The toolbar has a dropdown to switch lists (with new list, new list from unbought items, rename and delete), and on Spend a Weekly, Monthly and Annually switch spread equally across the toolbar with earlier and later arrows (Annually is new: the 12 months ending this month, with a month by month chart). A new Analyse tab shows what one item costs you over 3, 6 or 12 months (price over time, spend per month, cheapest shop, how often you buy it) and your shopping trends (what costs most, prices going up or down, categories against the previous span, the days you shop)."
