manifestVersion: 1
id: joolay-theme-editor
category: developer
name: Theme Editor
version: "1.0.0"
tagline: Edit the global Glass theme that every JoolzApp can load
description: >-
  Owner-only editor for the JoolzApp Glass theme: backdrop glows, panel and text colours, status colours, corner radius, glass opacity, font and,
  if you want one look everywhere, a single accent colour. A live preview (light and dark) shows the change before you save. Saving publishes the theme to
  Portal Admin, which serves it as /theme.css; apps that load it (templates/glass/theme-global.js) pick it up without an update. Each device has its own template: edit All views, or Mobile, Tablet, Desktop and TV separately (a view only changes what you set for it). Every item offers named options plus a custom picker, and the top bar can be styled too. Reset returns everything
  to the Glass defaults. It has no icon on the JoolzApp home screen; admins find it in the Admin folder of the JoolzApp Store.
