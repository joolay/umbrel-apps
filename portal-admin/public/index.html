<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Admin</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card login-card" autocomplete="on">
    <div class="brand big"><img src="icon.svg" alt="" width="40" height="40"><span>Portal Admin</span></div>
    <p class="muted">Sign in with your PocketBase <strong>superuser</strong> account.</p>
    <label>PocketBase URL
      <input id="login-url" type="url" placeholder="http://umbrel.local:8090" required>
    </label>
    <label>Superuser email
      <input id="login-email" type="email" autocomplete="username" required>
    </label>
    <label>Password
      <input id="login-pass" type="password" autocomplete="current-password" required>
    </label>
    <div id="login-err" class="error"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Portal Admin</span></div>
    <nav id="nav">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/global" data-route="global">Global settings</a>
      <a href="#/apps" data-route="apps">Apps</a>
      <a href="#/users" data-route="users">Users</a>
      <a href="#/audit" data-route="audit">Audit log</a>
      <a href="#/setup" data-route="setup">Setup &amp; integration</a>
    </nav>
    <div class="side-foot">
      <div id="who" class="muted small"></div>
      <button id="logout" class="btn small">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
