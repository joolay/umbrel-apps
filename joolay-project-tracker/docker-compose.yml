# Project Tracker runs here as a real Umbrel app. Source: src/project-tracker in this repo, built by .github/workflows/build-images.yml.
# Keep the image tag equal to `version` in umbrel-app.yml.
# Nothing private is stored in this public repo. Private lists live in PocketBase (projecttracker_data, only this app's limited login can
# use it). The GitHub token for the shared list is saved there too, from the app's Connection panel, and is never sent back to a browser.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-project-tracker_web_1
      APP_PORT: 3915
      # No Umbrel login: the tracker locks itself behind the JoolzApp account (any JoolzApp user; only the owner sees the App development list).
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/project-tracker:1.3.1
    restart: on-failure
    stop_grace_period: 1m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public address https://project-tracker.<tailnet>.ts.net via TSDProxy + Funnel (see deploy/tsdproxy). The app locks itself
    # behind the JoolzApp account, so publishing it directly is safe: everyone signs in, and only the owner is shown the App development list.
    ports:
      - "3916:3915"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "project-tracker"
      tsdproxy.port.1: "443/https:3916/http, no_autodetect, tailscale_funnel"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=project-tracker
      - POCKETBASE_APP_NAME=Project Tracker
