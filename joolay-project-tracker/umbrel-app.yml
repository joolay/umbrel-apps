releaseNotes: "Changes: Maintenance is now called Queued. There is a new top bar with Home and Settings (Connection, the 3-day rule and new lists now live in Settings); the list name no longer repeats and the sync light is just a dot. Tap a project for its notes (Claude reads them before working on it and asks you to confirm before clearing one); press and hold a project to edit or remove it. Priority arrows are on the left and Worked today is a short button on the top right. The 3-day rule (auto) is on for every project: switch it off in Settings or per project in Edit, and a status you set by hand stays until you work on the project on a later day. The shared list is only shown to the person who owns it."
