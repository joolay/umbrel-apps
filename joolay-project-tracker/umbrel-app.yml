releaseNotes: "Changes: The auto-Active rule now has an adjustable window in Settings (1 to 30 days, default 3). Fix: Queued and Hiatus projects no longer jump to Active just because their code folders had a recent commit; a project only moves to Active automatically after you have set its status once and then work on it on a later day."
