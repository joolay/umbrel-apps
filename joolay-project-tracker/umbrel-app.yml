releaseNotes: "Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Project Pilot now also reports its project and note counts to the status feed. Before: New Priority tab: one list across every category that you reorder with the arrows or by dragging, and each category follows it. New List view with a Details button: off shows title-only rows you can drag, tap any row to expand it; on shows full cards. Expand all and Collapse all work on every tab. Notes now has its own button. The top bar now stays at the top of the screen when you scroll. The Install icon also shows when the app is opened on an http address, and explains that installing needs the https address. Project Tracker is now called Project Pilot (same app, same address). A new floating top bar (title on the left, light/dark icon on the right, saved to your account) that no longer stretches tall. Sign in with a PIN or pattern instead of your password on a device you have already signed in on. Project Pilot offers it once after you sign in, and you can change or turn it off any time in Settings > Quick Access. Your code is the same one you set in the JoolzApp Portal."
