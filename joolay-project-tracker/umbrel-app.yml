manifestVersion: 1
id: joolay-project-tracker
category: developer
name: Project Tracker
version: "1.2.0"
tagline: Every project, its status and its priority in one place
description: >-
  Project Tracker keeps lists of projects with a status (Active, Queued, Hiatus or Closed), a priority order you set with arrows,
  and a tidy way to remove them: Archive keeps the details, Delete goes to a recycle bin for 30 days. A project that is Queued or
  Hiatus that you worked on in the last 3 days shows as Active by itself, unless you set its status by hand. The shared App
  development list lives in a GitHub repo and updates on every open screen within seconds. Your own lists are kept privately on your
  JoolzApp account. Sign in with your JoolzApp account.
