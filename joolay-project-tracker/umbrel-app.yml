releaseNotes: "The top bar now stays at the top of the screen when you scroll. The Install icon also shows when the app is opened on an http address, and explains that installing needs the https address. Project Tracker is now called Project Pilot (same app, same address). A new floating top bar (title on the left, light/dark icon on the right, saved to your account) that no longer stretches tall. Sign in with a PIN or pattern instead of your password on a device you have already signed in on. Project Pilot offers it once after you sign in, and you can change or turn it off any time in Settings > Quick Access. Your code is the same one you set in the JoolzApp Portal."
