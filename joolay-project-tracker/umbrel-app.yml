releaseNotes: "Changes: The Priority tab and the Notes button are gone: drag tiles in any tab to set priority, tap anywhere on a tile to open its notes, and tap the tile name to expand or collapse it. The All tab is now split into groups, one per status: Active, Queued, Hiatus, Completed (green), Abandoned (amber) and Deleted, which always stays at the bottom. A group or tab only shows when something is in it, and you can drag the order of the groups in Settings. Slide a tile to the left: Active, Queued and Hiatus tiles reveal Complete, Abandon and Delete; Completed tiles reveal Reopen and Archive (never Delete); Abandoned tiles reveal Reopen, Archive and Delete. The Closed button is gone. A month after a project is finished you are asked to move completed ones to the Archive, and to Keep, Archive or Delete abandoned ones. The bin never empties itself: you are asked to empty it every month. Tiles and rows now have a ⋮⋮ drag handle: drag a tile anywhere in the grid or list to set its priority (the up and down arrows are gone except on one-line rows in the Priority tab). The project list and the tabs stay at the top while you scroll; pick which tabs to show in Settings, and when they don't fit the screen they become a drop-down list. The Home button now comes from the shared top bar. The app icon is cleaner: no border or glaze, just the brand colour and a sharp white glyph. Notes can be edited (tap Edit on a note), and notes Claude leaves for you show a Claude badge. The old sync dot is gone: sync problems now show in a banner, and the connected and Claude-link icons use the new Glass template style. Before: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Project Pilot now also reports its project and note counts to the status feed. Before: New Priority tab: one list across every category that you reorder with the arrows or by dragging, and each category follows it. New List view with a Details button: off shows title-only rows you can drag, tap any row to expand it; on shows full cards. Expand all and Collapse all work on every tab. Notes now has its own button. The top bar now stays at the top of the screen when you scroll. The Install icon also shows when the app is opened on an http address, and explains that installing needs the https address. Project Tracker is now called Project Pilot (same app, same address). A new floating top bar (title on the left, light/dark icon on the right, saved to your account) that no longer stretches tall. Sign in with a PIN or pattern instead of your password on a device you have already signed in on. Project Pilot offers it once after you sign in, and you can change or turn it off any time in Settings > Quick Access. Your code is the same one you set in the JoolzApp Portal."
