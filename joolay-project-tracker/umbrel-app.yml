releaseNotes: "Changes: Each project now has a Chat button. In Settings choose Chat with Claude (opens a new chat in the Claude app with the project and its notes filled in) or Built-in chat (uses the AI key saved on your JoolzApp account: it can read the project's repo folders and suggest note and status changes that only happen when you press Apply). Needs Portal Admin 0.32.0."
