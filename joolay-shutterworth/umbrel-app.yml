releaseNotes: "Every JoolzApp app now has a Back to Dashboard button that returns you to Portal Admin already signed in. Opens straight from the JoolzApp dashboard without a separate sign-in. Sign-in now matches Portal Admin: Remember me and Forgot password. New accounts can set up AI while signing up, and anyone can use their own provider, model and key (Gemini, OpenRouter, Anthropic, OpenAI or custom) from Portal Admin; photo identifications on your own key are not limited by the free trial. Gemini is the default. ShutterWorth now follows Portal Admin: per-app approval, app on/off and maintenance, closed sign-ups, and your shared currency, time zone, date format and theme."
