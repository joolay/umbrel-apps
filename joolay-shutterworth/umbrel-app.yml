manifestVersion: 1
id: joolay-shutterworth
category: files
name: ShutterWorth
version: "1.0.2"
tagline: Photograph your belongings and build an insurance inventory
description: >-
  A dashboard shortcut to ShutterWorth, the self-hosted photo inventory with replacement and depreciated values.
  This tile opens the ShutterWorth container that runs next to it on this Umbrel (container name "shutterworth",
  port 3880), through Umbrel's own login. It does not install or update ShutterWorth itself: that is done with
  deploy/install-on-umbrel.sh in the ShutterWorth repository.
developer: joolay
website: https://github.com/joolay/ShutterWorth
dependencies: []
repo: https://github.com/joolay/ShutterWorth
support: https://github.com/joolay/ShutterWorth/issues
port: 3881
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "New app icon: a gold price tag in a cream viewfinder."
submitter: joolay
submission: https://github.com/joolay/ShutterWorth
icon: https://raw.githubusercontent.com/joolay/umbrel-apps/main/joolay-shutterworth/icon.svg
