releaseNotes: "Accounts a parent created for a child also wait for an admin's approval. The Users panel now only manages ShutterWorth access and trial; name, email, password, admin rights, deleting accounts and sign-ups are managed in Portal Admin. Sign-up now lives on the one JoolzApp sign-up page in Portal Admin; the Create account button takes you there and back. Under-18s can't use ShutterWorth until a parent approves. Glass-style sign-in screen. Nothing else changes."
