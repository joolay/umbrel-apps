# ShutterWorth runs here as a real Umbrel app. Updating it in the App Store pulls the new image.
# The image tag below is bumped automatically by the ShutterWorth release workflow (keep it equal to `version` in umbrel-app.yml).
# Data (inventory, photos, AI key) lives in this app's data folder and survives updates.
# Optional sign-in settings go in <app data>/data/pocketbase.env, never in this public repo.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-shutterworth_web_1
      APP_PORT: 3880

  web:
    image: ghcr.io/joolay/shutterworth:1.2.1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=shutterworth
