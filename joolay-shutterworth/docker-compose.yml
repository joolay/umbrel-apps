# ShutterWorth runs here as a real Umbrel app. Updating it in the App Store pulls the new image.
# Source: src/shutterworth in this repo, built by .github/workflows/build-images.yml. Keep the image tag equal to `version` in umbrel-app.yml.
# Data (inventory, photos, AI key) lives in this app's data folder and survives updates.
# Optional sign-in settings go in <app data>/data/pocketbase.env, never in this public repo.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-shutterworth_web_1
      APP_PORT: 3880
      # No Umbrel login for this app: ShutterWorth locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/shutterworth:1.6.1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=shutterworth
      # Refuse to show anything until PocketBase accounts are working (Umbrel's login is off, so this is the lock).
      - REQUIRE_ACCOUNTS=1
