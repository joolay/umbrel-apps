# Umbrel needs at least one real container besides its own proxy ("no service selected" otherwise).
# `web` is a tiny relay from this app's port 3880 to the ShutterWorth container that
# deploy/install-on-umbrel.sh runs on umbrel_main_network; Umbrel's app_proxy (login + dashboard tile) sits in front of it.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-shutterworth_web_1
      APP_PORT: 3880

  web:
    image: caddy:2
    restart: on-failure
    command: caddy reverse-proxy --from :3880 --to shutterworth:3880
