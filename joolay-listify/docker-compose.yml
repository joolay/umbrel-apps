# Listify runs here as a real Umbrel app. Source: src/listify in this repo, built by .github/workflows/build-images.yml.
# Keep the image tag equal to `version` in umbrel-app.yml.
# Lists live in this app's data folder. PocketBase is found at http://host.docker.internal:5400. Put the superuser login in
# <app data>/data/pocketbase.env (POCKETBASE_SUPERUSER_EMAIL and POCKETBASE_SUPERUSER_PASSWORD), never in this public repo.
# Or open Portal Admin and connect PocketBase there.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-listify_web_1
      APP_PORT: 3895
      # No Umbrel login for this app: Listify locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/listify:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=listify
      - POCKETBASE_APP_NAME=Listify
      # Refuse to show anything until PocketBase accounts are working.
      - REQUIRE_ACCOUNTS=1
