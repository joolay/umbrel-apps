# GrubToGo runs here as a real Umbrel app. Source: src/grubtogo in this repo, built by .github/workflows/build-images.yml.
# Keep the image tag equal to `version` in umbrel-app.yml.
# Data (saved menus per person, AI key) lives in this app's data folder and survives updates.
# PocketBase is found at http://host.docker.internal:5400. Put the superuser login in <app data>/data/pocketbase.env (POCKETBASE_SUPERUSER_EMAIL and POCKETBASE_SUPERUSER_PASSWORD), never in this public repo.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-grubtogo_web_1
      APP_PORT: 3893
      # No Umbrel login for this app: GrubToGo locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/grubtogo:1.3.2
    restart: on-failure
    stop_grace_period: 1m
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Public address https://grubtogo.<tailnet>.ts.net via TSDProxy + Funnel (see deploy/tsdproxy). The app locks itself
    # behind the JoolzApp account, so publishing it directly is safe.
    ports:
      - "3894:3893"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "grubtogo"
      tsdproxy.port.1: "443/https:3894/http, no_autodetect, tailscale_funnel"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=grubtogo
      - POCKETBASE_APP_NAME=GrubToGo
      # Refuse to show anything until PocketBase accounts are working (Umbrel's login is off, so this is the lock).
      - REQUIRE_ACCOUNTS=1

# What GrubToGo needs in PocketBase. (joolz_families is shared by every JoolzApp app: it holds the family links.) Portal Admin reads this and creates the collection when the app is installed.
x-pocketbase: {
  "collections": [
    {
      "name": "grubtogo_menus",
      "fields": [
        {"name": "owner", "type": "text", "required": true},
        {"name": "ownerName", "type": "text"},
        {"name": "name", "type": "text", "required": true},
        {"name": "phone", "type": "text"},
        {"name": "currency", "type": "text"},
        {"name": "categories", "type": "json", "maxSize": 5000000},
        {"name": "branches", "type": "json", "maxSize": 200000},
        {"name": "version", "type": "text"},
        {"name": "versionByName", "type": "text"}
      ]
    },
    {
      "name": "grubtogo_menu_archive",
      "fields": [
        {"name": "menuId", "type": "text", "required": true},
        {"name": "version", "type": "text"},
        {"name": "byName", "type": "text"},
        {"name": "data", "type": "json", "maxSize": 5000000}
      ]
    },
    {
      "name": "joolz_families",
      "fields": [
        {"name": "name", "type": "text", "required": true},
        {"name": "owner", "type": "text", "required": true},
        {"name": "ownerName", "type": "text"},
        {"name": "memberIds", "type": "text"},
        {"name": "invitedIds", "type": "text"},
        {"name": "invitedEmails", "type": "text"},
        {"name": "members", "type": "json", "maxSize": 100000},
        {"name": "invited", "type": "json", "maxSize": 100000}
      ]
    },
    {
      "name": "grubtogo_family_orders",
      "fields": [
        {"name": "familyId", "type": "text", "required": true},
        {"name": "byId", "type": "text", "required": true},
        {"name": "byName", "type": "text"},
        {"name": "data", "type": "json", "maxSize": 1000000}
      ]
    },
    {
      "name": "joolz_guardians",
      "fields": [
        {"name": "childId", "type": "text", "required": true},
        {"name": "childName", "type": "text"},
        {"name": "parentId", "type": "text", "required": true},
        {"name": "parentName", "type": "text"},
        {"name": "kind", "type": "text"},
        {"name": "ref", "type": "text"},
        {"name": "label", "type": "text"},
        {"name": "status", "type": "text"},
        {"name": "decidedAt", "type": "text"}
      ]
    }
  ]
}
