releaseNotes: "Accounts a parent created for a child also wait for an admin's approval. Account, family and parent settings moved to Portal Admin; Settings here now only holds GrubToGo's own options and links there. Sign-up now lives on the one JoolzApp sign-up page in Portal Admin; the Create account button takes you there and back. Glass-style sign-in screen with a Show/Hide button on password fields. Every account now has a date of birth. Anyone under 18 names a parent or guardian who already has a JoolzApp account, and cannot use GrubToGo until a parent approves. Parents approve in Settings, also approve kids joining a family, and can withdraw approval. Accounts made before this can add a date of birth once in Settings. Split a bill between linked family members: link each person to a JoolzApp family member and everyone's own spending logs only their share (the person who ordered logs theirs, each linked person gets theirs in their own history). Create a family in Settings and invite people by email, even before they have a JoolzApp account: the invitation is waiting when they sign up (they accept first). The creator can make members managers, who can invite, remove and move members too. The link is stored with your JoolzApp account, so it carries across all JoolzApp apps. Link immediate family (who share joint expenses) or extended family such as cousins and grandparents (linked for future apps, never shown family expenses). When you mark an order as ordered, file it as a personal order or a family expense; family orders, history and spending are shared by everyone in the family, with who placed each one. Tap Mark as ordered to save an order to Previous orders under its date, then repeat it in one tap (also from the restaurant's menu page). A Spending page charts monthly expenditure and where you order from over 3, 6, 12 months or lifetime. Hold any menu item to edit its name, description or price: anyone can, and the item shows an edited tag with who changed it. Uploading a restaurant that is already in the archive no longer duplicates it; it becomes the latest version (dated by upload) and the old one is kept in Previous versions, which the uploader or an admin can restore. Branch phone numbers anyone adds are shared with all users. Every new menu in the shared archive now appears for everyone with a NEW tag until opened (switch any off in Settings). Franchises can have several branches, each with its own phone number, and you pick yours when ordering. Search is always on screen, and your orders now sync between your devices. Removed the save-to-file and import buttons; the default tip is now a setting on each device; copy any restaurant's order or the whole basket to the clipboard. Every JoolzApp app now has a Back to Dashboard button that returns you to Portal Admin already signed in. Opens straight from the JoolzApp dashboard without a separate sign-in. Sign-in now matches Portal Admin: Remember me and Forgot password. New accounts can set up AI while signing up, and everyone gets 10 free menu reads on the shared key before they need their own. Default AI provider is Google Gemini. Reads menus with your own AI provider, model and key from Portal Admin (My settings), including OpenRouter; falls back to the shared key. First release of GrubToGo (previously GrubDial): read a menu from a photo, PDF, link or text, order from several restaurants, split the bill and tap to call. Menus go into one shared archive; only the uploader or an admin can edit them."
