# GrubDial runs here as a real Umbrel app. Source: src/grubdial in this repo, built by .github/workflows/build-images.yml.
# Keep the image tag equal to `version` in umbrel-app.yml.
# Data (saved menus per person, AI key) lives in this app's data folder and survives updates.
# PocketBase is found at http://host.docker.internal:5400. Put the superuser login in <app data>/data/pocketbase.env (POCKETBASE_SUPERUSER_EMAIL and POCKETBASE_SUPERUSER_PASSWORD), never in this public repo.
services:
  app_proxy:
    environment:
      APP_HOST: joolay-grubdial_web_1
      APP_PORT: 3893
      # No Umbrel login for this app: GrubDial locks itself behind the JoolzApp account.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/joolay/grubdial:1.1.0
    restart: on-failure
    stop_grace_period: 1m
    # Lets the container reach the PocketBase app (port 5400) published on this Umbrel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - POCKETBASE_APP_ID=grubdial
      - POCKETBASE_APP_NAME=GrubDial
      # Refuse to show anything until PocketBase accounts are working (Umbrel's login is off, so this is the lock).
      - REQUIRE_ACCOUNTS=1

# What GrubDial needs in PocketBase. Portal Admin reads this and creates the collection when the app is installed.
x-pocketbase: {
  "collections": [
    {
      "name": "grubdial_menus",
      "fields": [
        {"name": "owner", "type": "text", "required": true},
        {"name": "ownerName", "type": "text"},
        {"name": "name", "type": "text", "required": true},
        {"name": "phone", "type": "text"},
        {"name": "currency", "type": "text"},
        {"name": "categories", "type": "json", "maxSize": 5000000}
      ]
    }
  ]
}
