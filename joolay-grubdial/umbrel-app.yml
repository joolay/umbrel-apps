manifestVersion: 1
id: joolay-grubdial
category: files
name: GrubDial
version: "1.1.0"
tagline: Read a menu, order from several restaurants, split the bill, tap to call
description: >-
  GrubDial reads a restaurant menu from a photo, PDF, link or pasted text, lets you build an order from one or more
  restaurants with special instructions, adds a tip, splits the bill equally or by item, and gives you the
  restaurant's phone number with a tap-to-call link. Sign in with your JoolzApp account; your saved menus follow you across devices.
developer: joolay
website: https://github.com/joolay/umbrel-apps/tree/main/src/grubdial
