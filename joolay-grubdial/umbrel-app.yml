repo: https://github.com/joolay/umbrel-apps
support: https://github.com/joolay/umbrel-apps/issues
port: 3893
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Menus now go into one shared archive that everyone signed in can order from. Only the person who uploaded a menu, or an admin, can edit or delete it. PocketBase is found automatically at the Umbrel PocketBase app; only the superuser login is needed in pocketbase.env."
