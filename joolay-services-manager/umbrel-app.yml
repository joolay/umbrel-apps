releaseNotes: "Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: Restarts TSDProxy by itself 30 seconds after Portal Admin asks for it (used when a new tailnet address is published). Changes: Sends container health, restarts, exit codes and the last log lines of failing containers to the Portal Admin status feed once it is switched on, so problems can be diagnosed without opening anything to the internet. The app gets no icon on the JoolzApp home screen. Needs Portal Admin 0.33.0."
