releaseNotes: "New: looks after TSDProxy (the service behind your Public and Tailscale-name addresses), which is not an Umbrel app and so was never watched or updated. It reads its version, checks for a newer image about every 12 hours and installs it by itself in the nightly window (03:30 by default, or on Update now in App Updater), keeping the old container to put back if the new one does not stay up. It also pauses and resumes proxies when Port Master asks, and keeps them paused after a TSDProxy restart. The first run adds an API key to TSDProxy settings and restarts it once. Before: Fix: the app did not start after the last update (a file was missing from its image). Changes: Top bar shows a connected icon (green when the server answers, red when it does not) and, because this app talks to Claude, an animated handshake icon: device on the left, AI on the right; the hand that is green made the last change, both green means the other side has read it, and hands that stop shaking mean a report Claude expected has not come through. Before: Restarts TSDProxy by itself 30 seconds after Portal Admin asks for it (used when a new tailnet address is published). Changes: Sends container health, restarts, exit codes and the last log lines of failing containers to the Portal Admin status feed once it is switched on, so problems can be diagnosed without opening anything to the internet. The app gets no icon on the JoolzApp home screen. Needs Portal Admin 0.33.0."
